learning_objectives:
  - "Distinguish atmospheric pressure, temperature, and density and explain how unequal heating sets air in motion."
  - "Explain why rising air expands and cools and descending air compresses and warms."
  - "Use parcel-versus-environment reasoning to distinguish stable air, unstable air, and a temperature inversion."
  - "Distinguish water-vapor content, relative humidity, dew point, and saturation."
  - "Explain four broad paths to saturation and the requirements for cloud formation."
  - "Use cloud layers and vertical development as evidence about stability, lift, moisture, ceiling, visibility, and precipitation."
  - "Connect the physical model with the observations and forecasts a VFR pilot later correlates for go/no-go and continue/divert decisions."
trouble_spots:
  - "Treating pressure, temperature, and density as interchangeable values."
  - "Saying rising air cools only because environmental temperature is lower aloft."
  - "Treating instability as a lifting mechanism rather than the atmosphere's response to displacement."
  - "Assuming smooth or stable air automatically means favorable VFR weather."
  - "Treating relative humidity as independent of temperature."
  - "Calling invisible water vapor a visible cloud."
  - "Treating an approximate lifted cloud-base estimate as a reported ceiling."
  - "Treating one pressure system, report, or favorable weather value as a complete flight decision."
