  title: VFR Operating Rules and Preflight Responsibilities
  description: Elena and Jonah prepare a daytime VFR flight. A failed display
    changes the airplane and its loading check, a runway closure changes the
    destination, and a stronger headwind leads to an early fuel stop. The delay
    cancels their gathering, so Elena replans a daylight flight home before
    sunset. The lesson connects Part 91 preflight and operating rules to those
    decisions.
