        claim_assessments:
          - claim_id: propeller-blade-twist
            verdict: supports
            rationale: Figures 7-6 and 7-7 identify changing blade angle from hub to tip and
              show that blade portions travel different distances and speeds at
              the same rpm. The text states that a blade with the same angle
              throughout would be inefficient because the hub portion would have
              a negative AOA while the tip would be stalled as airspeed
              increases.
          - claim_id: fixed-pitch-compromise
            verdict: supports
            rationale: The excerpt states that fixed-pitch blade angles are set by the
              manufacturer and cannot be changed, and that best efficiency
              occurs only at a given combination of airspeed and rpm. It
              explicitly says the setting is ideal for neither cruise nor climb,
              with some performance loss in each category.
          - claim_id: climb-cruise-propeller-tradeoff
            verdict: supports
            rationale: The text states that a climb propeller has lower pitch and less drag,
              resulting in higher rpm and more horsepower capability that
              improves takeoff and climb performance but decreases cruise
              performance. It states that a cruise propeller has higher pitch
              and improves cruise efficiency while decreasing takeoff and climb
              performance.
          - claim_id: fixed-pitch-rpm-indication
            verdict: supports
            rationale: The excerpt explicitly states that, in a fixed-pitch propeller
              installation, the tachometer is the indicator of engine power. It
              also says tachometers are color coded with a green arc for maximum
              continuous operating rpm and may have additional engine and/or
              propeller limitation markings.
          - claim_id: density-changes-power-at-rpm
            verdict: supports
            rationale: The excerpt gives the example that 2,300 rpm at 5,000 feet produces
              less horsepower than 2,300 rpm at sea level because power output
              depends on air density, which decreases as altitude increases.
