learning_objectives:
  - Build and continuously update a surface-position picture from current
    airport information, the airport diagram, ATC instructions, and outside cues.
  - Translate a taxi clearance into route segments, runway crossings, and
    hold-short limits before movement.
  - Use location, direction, and mandatory signs plus pavement markings to
    confirm position and recognize runway boundaries.
  - Explain explicit runway-crossing clearance, line-up-and-wait, runway-status
    light, and whole-aircraft runway-clearance decisions.
  - Distinguish airport, runway, and taxiway lighting at night and use
    pilot-controlled lighting only as current airport information describes it.
trouble_spots:
  - Treating a correct readback as proof that the airplane is on the correct surface.
  - Assuming a taxi clearance to the departure runway authorizes intermediate
    or departure-runway crossings.
  - Treating a taxiway centerline as a guarantee of wingtip clearance.
  - Crossing a hold marking when the nose or cockpit, rather than the entire
    airplane, appears clear.
  - Treating runway-status or pilot-controlled lights as a movement clearance.
  - Identifying a runway or airport at night from one light or color without
    corroborating the diagram, alignment, designation, and current information.
