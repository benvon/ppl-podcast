    authority: faa_guidance
    title: "Pilot's Handbook of Aeronautical Knowledge, Chapter 10: Weight and Balance"
    document_id: "FAA-H-8083-25C"
    locator: "Ch. 10, Figure 10-11 and Shifting, Adding, and Removing Weight, p. 10-10"
    url: "https://www.faa.gov/sites/faa.gov/files/12_phak_ch10.pdf#page=10"
    revision: "2023 edition"
    relevance_excerpt: "The sample tracks ramp, takeoff, and landing conditions; shifting a load leaves total weight unchanged but changes total moment and CG."
