learning_objectives:
  - Recognize an unresolved aircraft-condition question, hold departure, and
    choose a suitable replacement airplane when the discrepancy cannot be
    resolved in time.
  - Use current runway, performance, weather, and fuel information to revise a
    daytime VFR flight before departure.
  - Recheck the replacement airplane's weight and center of gravity for two
    people, bags, and fuel, then repeat the check after refueling.
  - Give an appropriate adult-passenger briefing for this airplane and flight,
    including the restraint operation, notices, and use required by section
    91.107.
  - Plan an en route altitude before departure with the minimum-safe-altitude
    and VFR cruising-altitude rules, then use actual progress to make an early
    fuel-stop decision.
  - Use the planned home-before-sunset cutoff to reject a delayed passenger leg
    when night recency and replacement-airplane night suitability have not been
    established.
trouble_spots:
  - A rental desk's release does not replace the PIC's safe-flight determination.
  - A runway length is useful only when that runway is available at the intended
    arrival time.
  - A fuel quantity that fits the tanks may put the loaded airplane outside
    weight or center-of-gravity limits; reducing fuel also affects range.
  - The VFR fuel reserve is a departure minimum, not a goal for remaining fuel
    at landing.
  - Minimum-safe-altitude conditions change with the area below, while 91.159
    applies only to specified level VFR cruise.
  - Extra night-VFR fuel cannot substitute for passenger recency or a
    night-equipped airplane, and Elena’s chosen sunset cutoff is earlier than
    the specific 61.57(b) window.
