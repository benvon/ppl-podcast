episode_id: "core-12"
claims:
  - {id: acs-hazards-decision-standard, type: faa_regulatory_standard, statement: "The private-pilot Weather Information task requires understanding hazardous weather and using it in go/no-go and continue/divert decisions, not merely recalling names.", sources: [acs-weather-hazards-decisions], risk: safety_critical, script_sections: ["What the ACS is asking you to connect", "Retrieval review"], status: draft}
  - {id: conservative-correlation-framework, type: faa_regulatory_standard, statement: "The applicant must analyze implications and correlate available weather information with the proposed VFR flight while accounting for resource limitations and personal minimums.", sources: [acs-weather-hazards-decisions], risk: safety_critical, script_sections: ["The decision pattern for every hazard", "A route can collect several hazards", "Retrieval review"], status: draft}
  - {id: wind-pressure-local-effects, type: faa_guidance, statement: "Pressure differences, temperature differences, Coriolis force, friction, and local effects shape wind; the same reported regional flow can differ near the surface.", sources: [phak-wind-circulation], risk: material, script_sections: ["Wind is the atmosphere in motion", "Retrieval review"], status: draft}
  - {id: obstruction-terrain-turbulence, type: faa_guidance, statement: "Buildings and terrain disturb wind flow, producing gusts and turbulence that can be especially consequential near runways and on the lee side of terrain.", sources: [phak-obstruction-wind], risk: safety_critical, script_sections: ["Wind is the atmosphere in motion", "Retrieval review"], status: draft}
  - {id: wind-shear-performance-change, type: faa_guidance, statement: "Wind shear is a rapid change in wind speed or direction over a small area and can abruptly change airspeed, performance, and flightpath, especially near the ground.", sources: [phak-low-level-wind-shear], risk: safety_critical, script_sections: ["Wind shear is change across a short distance", "Retrieval review"], status: draft}
  - {id: microburst-outflow-sequence, type: faa_guidance, statement: "A microburst combines a strong downdraft with spreading surface outflow, so an aircraft can encounter changing headwind, downdraft, and tailwind components in quick succession.", sources: [phak-low-level-wind-shear], risk: safety_critical, script_sections: ["Wind shear is change across a short distance"], status: draft}
  - {id: air-mass-front-boundary, type: faa_guidance, statement: "Air masses acquire broad temperature and moisture characteristics from their source regions, and a front marks the boundary between unlike air masses.", sources: [phak-fronts-air-masses], risk: material, script_sections: ["A front is a changing zone between air masses", "Retrieval review"], status: draft}
  - {id: front-multi-cue-recognition, type: faa_guidance, statement: "Frontal passage may be recognized through a combination of temperature, wind, pressure, cloud, and precipitation changes rather than one isolated cue.", sources: [phak-fronts-air-masses], risk: material, script_sections: ["A front is a changing zone between air masses", "Retrieval review"], status: draft}
  - {id: front-transition-zone, type: faa_guidance, statement: "A front is a transition zone with three-dimensional structure, not an infinitely thin line on a chart.", sources: [awh-front-variability], risk: material, script_sections: ["A front is a changing zone between air masses", "Retrieval review"], status: draft}
  - {id: fronts-not-weather-script, type: faa_guidance, statement: "Front type does not determine one fixed weather sequence; moisture, stability, movement, and vertical structure determine the actual clouds, precipitation, turbulence, and visibility.", sources: [awh-front-variability], risk: safety_critical, script_sections: ["Front names describe motion, not a guaranteed script", "Retrieval review"], status: draft}
  - {id: warm-front-broad-weather, type: faa_guidance, statement: "Advancing warm air generally rides over retreating cold air along a gradual warm-front slope, which can spread layered clouds, precipitation, reduced visibility, and fog over a broad area.", sources: [phak-warm-front], risk: material, script_sections: ["Front names describe motion, not a guaranteed script", "Retrieval review"], status: draft}
  - {id: cold-front-concentrated-weather, type: faa_guidance, statement: "Advancing cold air wedges beneath warmer air along a typically steeper cold front, which can concentrate uplift, wind shift, showers, turbulence, and thunderstorms.", sources: [phak-cold-front], risk: material, script_sections: ["Front names describe motion, not a guaranteed script", "Retrieval review"], status: draft}
  - {id: stationary-occluded-duration, type: faa_guidance, statement: "A stationary front can prolong clouds and precipitation, while an occlusion forms when a cold front catches a warm front and is often associated with extensive weather around a mature low.", sources: [phak-stationary-occluded-fronts], risk: material, script_sections: ["Front names describe motion, not a guaranteed script"], status: draft}
  - {id: thunderstorm-three-ingredients, type: faa_guidance, statement: "Thunderstorm development requires sufficient water vapor, unstable air, and a lifting mechanism.", sources: [awh-thunderstorm-ingredients-lifecycle], risk: material, script_sections: ["Thunderstorms assemble the Episode 11 chain", "Retrieval review"], status: draft}
  - {id: thunderstorm-life-cycle, type: faa_guidance, statement: "A thunderstorm cell progresses through cumulus, mature, and dissipating stages; the mature stage contains both updrafts and downdrafts and begins as precipitation reaches the surface.", sources: [awh-thunderstorm-ingredients-lifecycle], risk: material, script_sections: ["Thunderstorms assemble the Episode 11 chain"], status: draft}
  - {id: all-thunderstorms-hazardous, type: faa_guidance, statement: "All thunderstorms contain aviation hazards, including turbulence, wind shear, heavy precipitation, hail, lightning, and icing.", sources: [awh-thunderstorm-hazards], risk: safety_critical, script_sections: ["The hazard extends outside the visible rain", "Retrieval review"], status: draft}
  - {id: gust-front-beyond-rain, type: faa_guidance, statement: "Thunderstorm outflow and its gust front can produce hazardous wind change and turbulence outside the visible precipitation, and visual clues may be incomplete.", sources: [awh-thunderstorm-hazards], risk: safety_critical, script_sections: ["The hazard extends outside the visible rain", "Retrieval review"], status: draft}
  - {id: thunderstorm-avoidance-strategy, type: faa_guidance, statement: "FAA thunderstorm guidance makes avoidance the primary policy, warns against flight beneath a cell or anvil, and supports diverting or waiting when safe navigation around the area is not assured.", sources: [awh-thunderstorm-avoidance], risk: safety_critical, script_sections: ["Thunderstorm decisions are made before the gap becomes a question", "Retrieval review"], status: draft}
  - {id: datalink-strategic-not-tactical, type: faa_guidance, statement: "Data-linked radar mosaic imagery is delayed and is appropriate for strategic route selection, not tactical threading between cells.", sources: [awh-thunderstorm-avoidance], risk: safety_critical, script_sections: ["Thunderstorm decisions are made before the gap becomes a question"], status: draft}
  - {id: structural-icing-ingredients, type: faa_guidance, statement: "Structural icing requires liquid water that is supercooled below freezing and freezes on impact with the aircraft.", sources: [awh-icing-supercooled-water], risk: safety_critical, script_sections: ["Icing begins with supercooled liquid water", "Retrieval review"], status: draft}
  - {id: icing-form-variability, type: faa_guidance, statement: "Droplet size, liquid-water content, temperature, and aircraft shape influence the form and severity of structural icing, so a simple ice-type label cannot establish a safe encounter.", sources: [awh-icing-supercooled-water], risk: safety_critical, script_sections: ["Icing begins with supercooled liquid water"], status: draft}
  - {id: icing-three-dimensional-risk, type: faa_guidance, statement: "Frontal and terrain-forced lift can deepen icing regions, so freezing level, cloud layers, precipitation, terrain, and planned altitude must be correlated in three dimensions.", sources: [awh-icing-fronts-terrain], risk: safety_critical, script_sections: ["A freezing level is one boundary, not a complete answer", "Retrieval review"], status: draft}
  - {id: icing-aerodynamic-system-effects, type: faa_guidance, statement: "Even small roughness from frost, snow, or ice can reduce lift and increase drag, and ice can affect other aircraft systems and sensors.", sources: [awh-icing-effects], risk: safety_critical, script_sections: ["Ice changes the airplane before it looks dramatic", "Retrieval review"], status: draft}
  - {id: frost-clean-aircraft, type: faa_guidance, statement: "Frost, snow, and ice contamination must be treated as an aerodynamic hazard during preflight rather than as a cosmetic surface condition.", sources: [awh-icing-effects], risk: safety_critical, script_sections: ["Ice changes the airplane before it looks dramatic"], status: draft}
  - {id: fog-cloud-at-surface, type: faa_guidance, statement: "Fog is a surface-based cloud that reduces horizontal visibility, making it a direct VFR departure and arrival hazard.", sources: [awh-fog-definition-radiation], risk: safety_critical, script_sections: ["Fog is a cloud at the surface", "Retrieval review"], status: draft}
  - {id: radiation-fog-ingredients, type: faa_guidance, statement: "Radiation fog favors nighttime surface cooling, sufficient low-level moisture, and light wind; stronger mixing can prevent or disperse it, while calm air can limit its depth.", sources: [awh-fog-definition-radiation], risk: material, script_sections: ["Fog mechanisms tell you what may change it", "Retrieval review"], status: draft}
  - {id: advection-upslope-fog, type: faa_guidance, statement: "Advection fog forms as wind moves moist air over a colder surface, while upslope fog forms as moist stable air is forced uphill and cools toward saturation.", sources: [awh-fog-advection-upslope], risk: material, script_sections: ["Fog mechanisms tell you what may change it", "Retrieval review"], status: draft}
  - {id: precipitation-steam-frontal-fog, type: faa_guidance, statement: "Precipitation can saturate cooler air below, cold air over warmer water can produce steam fog, and frontal processes can organize broad low-visibility areas.", sources: [awh-fog-precipitation-steam], risk: material, script_sections: ["Fog mechanisms tell you what may change it"], status: draft}
  - {id: crosswind-component-capability, type: faa_guidance, statement: "A pilot should translate wind direction and speed into runway components and compare the crosswind with airplane capability, runway options, and an alternate rather than treating total wind speed as the whole decision.", sources: [afh-crosswind-capability], risk: safety_critical, script_sections: ["Wind becomes practical at the runway", "Retrieval review"], status: draft}
