learning_objectives:
  - Use a hypothetical multi-day VFR plan from northern California to Wisconsin
    to identify the mechanism, location, timing, evidence, and concrete planning
    response for each changing weather hazard.
  - "Reuse four defined hypothetical planning roles: the planned mountain
    corridor, western-Plains stopover, Wisconsin primary, and Wisconsin
    alternate outside the primary's shared fog or convective-outflow area."
  - Explain why a surface front symbol marks the bottom reference of a sloping,
    three-dimensional boundary rather than the full edge of associated weather.
  - Use warm, cold, stationary, and occluded front models to ask route- and
    time-specific questions without treating a front name as a fixed script.
  - Connect thunderstorm ingredients and cell life cycle with outflow, gust
    fronts, wind shear, strategic avoidance, and a stop-before-the-front choice.
  - Explain why delayed data-linked radar supports strategic thunderstorm
    avoidance and must not be the sole means for tactical path negotiation.
  - Apply the subfreezing-liquid-water overlap test separately to the planned
    mountain-corridor and Plains-front cross-sections.
  - Use radiation, advection, upslope, frontal, and steam-fog mechanisms to
    compare a northern California departure with later route and Wisconsin
    arrival decisions.
  - Connect large-scale wind with western terrain, local obstructions, Wisconsin
    runway components, airplane and pilot capability, and low-level wind shear.
  - Recognize mountain-wave downdrafts, rotors, and forecast uncertainty, then
    preserve a viable stop or turnaround before entering narrower terrain.
  - "Name the exact conservative option for each proposed leg: delay, different
    corridor, stopover, or destination outside the affected area."
trouble_spots:
  - Treating a charted front as a narrow line rather than a sloping weather zone.
  - Memorizing one guaranteed cloud-and-weather sequence for each front type.
  - Treating visible rain or a radar echo as the complete thunderstorm hazard
    boundary.
  - Using delayed data-linked radar as the sole means for tactical path
    negotiation.
  - Treating a freezing level or surface temperature as a complete icing answer.
  - Treating light frost or ice as cosmetic or primarily a weight problem.
  - Assuming all morning fog dissipates with sunrise.
  - Using total wind speed without resolving runway components or local terrain
    effects.
  - Treating wind shear as merely strong steady wind.
  - Using vague phrases such as actual evidence, this flight, both names, or
    usable alternatives instead of naming the source comparison, route segment,
    and specific delay, corridor, stopover, or destination choice.
