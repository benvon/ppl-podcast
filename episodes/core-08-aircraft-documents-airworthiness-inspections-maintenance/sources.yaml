    validation_url: "https://www.ecfr.gov/api/versioner/v1/full/2026-08-20/title-14.xml?part=91"
    revision: "eCFR current through August 20, 2026"
    relevance_excerpt: "The section establishes MEL and no-MEL pathways. Under paragraph (d), an inoperative item must not be among the VFR-day instruments and equipment prescribed by the applicable type-certification rules, shown as required on the aircraft equipment list or KOEL, required by § 91.205 or another operating rule, or required to be operational by an AD; it must then be removed or deactivated and placarded before a qualified determination that it is not a hazard."
