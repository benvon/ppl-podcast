learning_objectives:
  - "Explain which pressure inputs drive the airspeed indicator, altimeter, and vertical-speed indicator."
  - "Predict the distinct indication patterns produced by a blocked pitot opening, trapped pitot pressure, and a blocked static source."
  - "Connect conventional gyro behavior and failure recognition to rigidity, precession, and the installed vacuum or electrical power source."
  - "Distinguish magnetic-compass variation, deviation, dip-related acceleration and turning errors, and oscillation."
  - "Use shared-source grouping and independent indications to cross-check an abnormal instrument story without chasing one gauge."
trouble_spots:
  - "Treating three indications that share one static source as independent confirmation."
  - "Memorizing blocked-pitot symptoms without distinguishing an open drain from trapped pitot pressure."
  - "Treating a turn coordinator as a complete substitute for attitude information."
  - "Confusing magnetic variation with aircraft-specific deviation or applying compass mnemonics without their heading and hemisphere conditions."
  - "Assuming a clean electronic display makes its underlying sensor and power paths independent."
