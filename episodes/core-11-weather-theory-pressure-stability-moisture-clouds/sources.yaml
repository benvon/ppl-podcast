sources:
  - id: acs-weather-stability
    authority: faa_regulatory_standard
    title: "Private Pilot for Airplane Category Airman Certification Standards"
    document_id: "FAA-S-ACS-6C"
    locator: "PA.I.C.K3-K3b, Weather Information, printed p. 3"
    url: "https://www.faa.gov/training_testing/testing/acs/private_airplane_acs_6.pdf#page=11"
    revision: "April 2024; effective May 31, 2024"
    relevance_excerpt: "The Weather Information task requires meteorology applicable to departure, en route, alternate, and destination under VFR, including atmospheric composition and stability and wind."
    verified_at_utc: "2026-08-28T19:41:40Z"
    link_status: 200
    supports_claims: [acs-weather-theory-scope]

  - id: acs-weather-moisture-clouds-risk
    authority: faa_regulatory_standard
    title: "Private Pilot for Airplane Category Airman Certification Standards"
    document_id: "FAA-S-ACS-6C"
    locator: "PA.I.C.K3c-K3l, R1-R2, and S1-S3, Weather Information, printed p. 4"
    url: "https://www.faa.gov/training_testing/testing/acs/private_airplane_acs_6.pdf#page=12"
    revision: "April 2024; effective May 31, 2024"
    relevance_excerpt: "The task includes temperature and heat exchange, moisture and precipitation, weather-system formation, clouds, turbulence, thunderstorms, icing, fog, frost, and visibility obstructions; the applicant analyzes implications and correlates weather information to flight decisions."
    verified_at_utc: "2026-08-28T19:41:40Z"
    link_status: 200
    supports_claims: [acs-weather-theory-scope, acs-weather-decision-use, variables-not-verdicts]

  - id: phak-weather-theory-purpose
    authority: faa_guidance
    title: "Pilot's Handbook of Aeronautical Knowledge, Chapter 12: Weather Theory"
    document_id: "FAA-H-8083-25C"
    locator: "Ch. 12, Introduction, p. 12-1"
    url: "https://www.faa.gov/sites/faa.gov/files/14_phak_ch12.pdf#page=1"
    revision: "2023 edition; Chapter 12 page updated July 10, 2023; October 20, 2025 addendum does not modify Chapter 12"
    relevance_excerpt: "Weather includes temperature, moisture, wind, visibility, and barometric pressure; understanding theory supports sound decisions based on reports and forecasts."
    verified_at_utc: "2026-08-28T19:41:40Z"
    link_status: 200
    supports_claims: [weather-theory-supports-interpretation, variables-not-verdicts]

  - id: phak-atmosphere-troposphere
    authority: faa_guidance
    title: "Pilot's Handbook of Aeronautical Knowledge, Chapter 12: Weather Theory"
    document_id: "FAA-H-8083-25C"
    locator: "Ch. 12, Atmosphere and Composition of the Atmosphere, p. 12-2"
    url: "https://www.faa.gov/sites/faa.gov/files/14_phak_ch12.pdf#page=2"
    revision: "2023 edition"
    relevance_excerpt: "Air is a moving mixture of gases with variable water vapor; most weather, clouds, storms, and temperature variations occur in the troposphere."
    verified_at_utc: "2026-08-28T19:41:40Z"
    link_status: 200
    supports_claims: [atmosphere-mixture-water-vapor, troposphere-weather-layer]

  - id: phak-heating-density-pressure
    authority: faa_guidance
    title: "Pilot's Handbook of Aeronautical Knowledge, Chapter 12: Weather Theory"
    document_id: "FAA-H-8083-25C"
    locator: "Ch. 12, Atmospheric Circulation and Atmospheric Pressure, p. 12-3"
    url: "https://www.faa.gov/sites/faa.gov/files/14_phak_ch12.pdf#page=3"
    revision: "2023 edition"
    relevance_excerpt: "Uneven surface heating creates atmospheric motion and pressure changes; warming spreads air molecules and lowers density while cooling packs them more closely and raises density. Atmospheric pressure is force from the weight of air."
    verified_at_utc: "2026-08-28T19:41:40Z"
    link_status: 200
    supports_claims: [unequal-heating-drives-motion, temperature-density-relationship, pressure-air-weight]

  - id: phak-pressure-reference-altitude
    authority: faa_guidance
    title: "Pilot's Handbook of Aeronautical Knowledge, Chapter 12: Weather Theory"
    document_id: "FAA-H-8083-25C"
    locator: "Ch. 12, Measurement of Atmospheric Pressure and Altitude and Atmospheric Pressure, p. 12-5"
    url: "https://www.faa.gov/sites/faa.gov/files/14_phak_ch12.pdf#page=5"
    revision: "2023 edition"
    relevance_excerpt: "Standard sea-level pressure is 29.92 inches of mercury or 1,013.2 millibars; station readings are reduced to sea level for comparison, pressure decreases with altitude, and lower pressure corresponds to less-dense air."
    verified_at_utc: "2026-08-28T19:41:40Z"
    link_status: 200
    supports_claims: [standard-pressure-reference, sea-level-pressure-comparison, pressure-decreases-altitude]

  - id: phak-high-low-vertical-motion
    authority: faa_guidance
    title: "Pilot's Handbook of Aeronautical Knowledge, Chapter 12: Weather Theory"
    document_id: "FAA-H-8083-25C"
    locator: "Ch. 12, Wind and Currents and Wind Patterns, p. 12-7"
    url: "https://www.faa.gov/sites/faa.gov/files/14_phak_ch12.pdf#page=7"
    revision: "2023 edition"
    relevance_excerpt: "Pressure differences, temperature, Coriolis force, and friction contribute to atmospheric motion; descending dry air is generally associated with high pressure, while rising air and increasing cloudiness or precipitation commonly accompany low pressure."
    verified_at_utc: "2026-08-28T19:41:40Z"
    link_status: 200
    supports_claims: [pressure-patterns-motion-weather]

  - id: phak-stability-adiabatic
    authority: faa_guidance
    title: "Pilot's Handbook of Aeronautical Knowledge, Chapter 12: Weather Theory"
    document_id: "FAA-H-8083-25C"
    locator: "Ch. 12, Atmospheric Stability, p. 12-12"
    url: "https://www.faa.gov/sites/faa.gov/files/14_phak_ch12.pdf#page=12"
    revision: "2023 edition"
    relevance_excerpt: "Stability is resistance to vertical motion. Stable air damps vertical disturbances; unstable air amplifies them. Rising air expands and cools as pressure decreases, while descending air compresses and warms."
    verified_at_utc: "2026-08-28T19:41:40Z"
    link_status: 200
    supports_claims: [stability-definition, rising-cools-descending-warms]

  - id: phak-lapse-moisture-inversion
    authority: faa_guidance
    title: "Pilot's Handbook of Aeronautical Knowledge, Chapter 12: Weather Theory"
    document_id: "FAA-H-8083-25C"
    locator: "Ch. 12, Adiabatic Process, Moisture and Temperature, Relative Humidity, and Inversion, p. 12-13"
    url: "https://www.faa.gov/sites/faa.gov/files/14_phak_ch12.pdf#page=13"
    revision: "2023 edition"
    relevance_excerpt: "An air parcel cools as it rises and expands and warms as it descends and compresses. Saturated air cools more slowly than unsaturated air, which can make moist air less stable. Warm air can contain more water vapor; relative humidity compares actual moisture with capacity at the current temperature. Inversions are stable layers that can trap moisture and pollutants."
    verified_at_utc: "2026-08-28T19:41:40Z"
    link_status: 200
    supports_claims: [adiabatic-parcel-chain, saturated-parcel-slower-cooling, warm-air-moisture-capacity, relative-humidity-definition, inversion-stable-layer]

  - id: phak-dewpoint-saturation-lifting
    authority: faa_guidance
    title: "Pilot's Handbook of Aeronautical Knowledge, Chapter 12: Weather Theory"
    document_id: "FAA-H-8083-25C"
    locator: "Ch. 12, Temperature/Dew Point Relationship and Methods by Which Air Reaches Saturation, p. 12-14"
    url: "https://www.faa.gov/sites/faa.gov/files/14_phak_ch12.pdf#page=14"
    revision: "2023 edition"
    relevance_excerpt: "Dew point is the temperature at which air becomes saturated; further cooling causes condensation. Saturation can result from movement over a cold surface, mixing, nighttime ground cooling, or lifting."
    verified_at_utc: "2026-08-28T19:41:40Z"
    link_status: 200
    supports_claims: [dewpoint-saturation-definition, saturation-four-paths, temperature-dewpoint-cloud-base-model]

  - id: phak-cloud-formation-low-clouds
    authority: faa_guidance
    title: "Pilot's Handbook of Aeronautical Knowledge, Chapter 12: Weather Theory"
    document_id: "FAA-H-8083-25C"
    locator: "Ch. 12, Clouds and low-cloud classification, p. 12-15"
    url: "https://www.faa.gov/sites/faa.gov/files/14_phak_ch12.pdf#page=15"
    revision: "2023 edition"
    relevance_excerpt: "Cloud formation requires adequate water vapor, condensation nuclei, and cooling to saturation. Cloud type reflects base height, shape, and characteristics; low clouds can create low ceilings and visibility restrictions."
    verified_at_utc: "2026-08-28T19:41:40Z"
    link_status: 200
    supports_claims: [cloud-formation-requirements, low-cloud-operational-meaning]

  - id: phak-cloud-families-vertical
    authority: faa_guidance
    title: "Pilot's Handbook of Aeronautical Knowledge, Chapter 12: Weather Theory"
    document_id: "FAA-H-8083-25C"
    locator: "Ch. 12, Basic Cloud Types and Clouds with Vertical Development, p. 12-16"
    url: "https://www.faa.gov/sites/faa.gov/files/14_phak_ch12.pdf#page=16"
    revision: "2023 edition"
    relevance_excerpt: "The basic cloud families are low, middle, high, and vertically developing. Towering cumulus indicates instability, and cumulonimbus contains moisture and unstable air and can produce hazardous weather."
    verified_at_utc: "2026-08-28T19:41:40Z"
    link_status: 200
    supports_claims: [cloud-family-classification, vertical-cloud-instability]

  - id: phak-ceiling-visibility-precipitation
    authority: faa_guidance
    title: "Pilot's Handbook of Aeronautical Knowledge, Chapter 12: Weather Theory"
    document_id: "FAA-H-8083-25C"
    locator: "Ch. 12, Ceiling, Visibility, and Precipitation, p. 12-17"
    url: "https://www.faa.gov/sites/faa.gov/files/14_phak_ch12.pdf#page=17"
    revision: "2023 edition"
    relevance_excerpt: "Ceiling is the lowest broken or overcast layer or vertical visibility into an obscuration; visibility is the greatest horizontal distance at which prominent objects can be seen; precipitation can reduce visibility and create icing or runway hazards."
    verified_at_utc: "2026-08-28T19:41:40Z"
    link_status: 200
    supports_claims: [ceiling-visibility-meaning, precipitation-observable-consequence]
