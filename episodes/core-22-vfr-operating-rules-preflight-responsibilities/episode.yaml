learning_objectives:
  - Use aircraft certificates, approved limitations, inspection records, and
    equipment requirements to decide whether to accept an airplane.
  - Apply the appropriate 91.213 path to an inoperative installed item without
    assuming a placard alone authorizes departure.
  - Use current runway, performance, weather, and fuel information to revise a
    daytime VFR flight before departure.
  - Brief an adult passenger on restraint operation and use before surface
    movement and takeoff.
  - Choose an en route altitude with the minimum-safe-altitude and VFR
    cruising-altitude rules, then use actual progress to make an early fuel-stop
    decision.
trouble_spots:
  - An aircraft rental desk's release does not replace the PIC's safe-flight
    determination.
  - An item absent from the 91.205 day-VFR list may still be required by the
    aircraft's approved documents, type certification, or an AD.
  - A runway length is useful only when that runway is available at the intended
    arrival time.
  - The VFR fuel reserve is a departure minimum, not a goal for remaining fuel
    at landing.
  - Minimum-safe-altitude conditions change with the area below, while 91.159
    applies only to specified level VFR cruise.
