learning_objectives:
  - Explain why a front is a three-dimensional transition zone and use moisture,
    stability, movement, and vertical structure to anticipate changing weather
    without treating a front name as a fixed script.
  - Connect the three thunderstorm ingredients and cell life cycle with hazards
    that extend beyond visible precipitation, including outflow, turbulence, and
    wind shear.
  - Explain why delayed data-linked radar supports strategic thunderstorm
    avoidance rather than tactical navigation between cells.
  - Identify the overlap of subfreezing temperature and supercooled liquid water
    and correlate freezing level, cloud, precipitation, terrain, and altitude as
    a three-dimensional icing risk.
  - Treat frost, snow, and ice contamination as aerodynamic and system hazards
    before the accumulation appears dramatic.
  - Use radiation, advection, upslope, precipitation, frontal, and steam-fog
    mechanisms to reason about formation, persistence, and improvement.
  - Connect regional wind with terrain and obstruction effects, runway
    components, airplane capability, personal proficiency, and low-level wind
    shear.
  - Correlate several hazards across departure, route, destination, and
    alternate conditions to make an early conservative decision.
trouble_spots:
  - Treating a charted front as a narrow line rather than a sloping weather zone.
  - Memorizing one guaranteed cloud-and-weather sequence for each front type.
  - Treating visible rain or a radar echo as the complete thunderstorm hazard
    boundary.
  - Using delayed data-linked radar as a tactical gap-finding display.
  - Treating a freezing level or surface temperature as a complete icing answer.
  - Treating light frost or ice as cosmetic or primarily a weight problem.
  - Assuming all morning fog dissipates with sunrise.
  - Using total wind speed without resolving runway components or local terrain
    effects.
  - Treating wind shear as merely strong steady wind.
