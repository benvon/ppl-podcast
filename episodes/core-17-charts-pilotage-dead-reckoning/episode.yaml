learning_objectives:
  - Build a useful route picture from a current sectional by locating terrain,
    obstructions, airspace, and visually distinctive route features.
  - Define and distinguish pilotage, dead reckoning, checkpoint, course,
    heading, track, wind correction angle, variation, deviation, groundspeed,
    and ETA.
  - Select prominent checkpoints that can be corroborated by more than one
    visible feature and use them to maintain route orientation.
  - Convert a charted true course into a wind-corrected, magnetic, and compass
    heading while preserving the purpose of each correction.
  - Build a simple navigation log from distance, heading, groundspeed, and
    estimated checkpoint times.
  - Compare planned position and progress with observed landmarks and elapsed
    time, then revise heading, groundspeed, or ETA only as the evidence
    supports.
trouble_spots:
  - Treating a current sectional as a permanent or complete statement of present
    conditions.
  - Treating the Maximum Elevation Figure as a prescribed or automatically safe
    altitude.
  - Choosing small or ambiguous checkpoints and relying on a single feature for
    position.
  - Using course, heading, and track as interchangeable terms.
  - Assuming a calculated wind correction guarantees the desired ground track.
  - Diagnosing a late checkpoint as a wind error before confirming position and
    timing.
  - Allowing navigation calculations to displace aircraft control and the
    outside traffic scan.
