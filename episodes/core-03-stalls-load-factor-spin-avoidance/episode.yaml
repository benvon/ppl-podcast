learning_objectives:
  - "Explain why a stall is an angle-of-attack event rather than a single airspeed."
  - "Describe how load factor, coordination, configuration, weight, center of gravity, power, and yaw affect the airspeed at which a stall occurs."
  - "Recognize common stall cues and identify the aerodynamic priority in recovery."
  - "Explain why a stalled, yawed airplane can enter a spin and how to avoid the conditions that lead there."
trouble_spots:
  - "Treating published stall speed as a universal safe-speed boundary"
  - "Trying to recover by adding power or leveling the wings before reducing angle of attack"
  - "Using inside rudder to tighten an overshooting base-to-final turn"
  - "Assuming an airplane is approved for intentional spins"
