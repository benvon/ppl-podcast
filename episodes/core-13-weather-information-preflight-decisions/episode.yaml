learning_objectives:
  - Distinguish observations, analyses, forecasts, and advisories by scope and
    valid time.
  - Correlate METARs, TAFs, PIREPs, graphical forecasts, winds aloft, and
    advisories by route segment.
  - Choose outlook, standard, or abbreviated briefing information for the
    planning stage.
  - State go, no-go, delay, reroute, alternate, continue, and divert triggers
    using personal minimums.
  - Explain the age, coverage, and strategic-use limits of cockpit weather
    displays.
trouble_spots:
  - Treating an app or display as the product rather than identifying the
    underlying source and valid time.
  - Extending point observations and terminal forecasts across an entire route.
  - Treating gridded interpolation or an empty PIREP display as verified actual
    conditions.
  - Collecting weather without connecting it to a route, time, decision, and
    update trigger.
