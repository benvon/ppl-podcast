  - id: phak-lateral-stability
    authority: faa_guidance
    title: "Pilot’s Handbook of Aeronautical Knowledge, Chapter 5: Aerodynamics of Flight"
    document_id: "FAA-H-8083-25C"
    locator: "Chapter 5, Lateral Stability, printed p. 5-18"
    url: "https://www.faa.gov/sites/faa.gov/files/regulations_policies/handbooks_manuals/aviation/phak/07_phak_ch5.pdf#page=18"
    programmatic_url: "https://www.faa.gov/sites/faa.gov/files/07_phak_ch5_0.pdf"
    programmatic_attestation: {url: "https://www.faa.gov/regulationspolicies/handbooksmanuals/aviation/phak/chapter-5-aerodynamics-flight", link_text: "07_phak_ch5_0.pdf", sha256: "672c1a05653b628c20eef81cc42afaafbde98bf54c7e09f9c7ad1349292c1a37"}
    revision: "FAA-H-8083-25C, 2023; FAA handbook index lists an October 2025 addendum"
    relevance_excerpt: "The PHAK explains that dihedral, sweepback, keel effect, and weight distribution contribute to lateral stability. In a sideslip, dihedral changes each wing’s angle of attack and creates a restoring rolling moment."
    verified_at_utc: "2026-08-16T14:58:00Z"
    link_status: 200
    supports_claims: [lateral-stability-dihedral, lateral-stability-design-factors]
  - id: phak-axis-stability
    authority: faa_guidance
    title: "Pilot’s Handbook of Aeronautical Knowledge, Chapter 5: Aerodynamics of Flight"
    document_id: "FAA-H-8083-25C"
    locator: "Chapter 5, Longitudinal, Lateral, and Directional Stability, printed pp. 5-15–5-19"
    url: "https://www.faa.gov/sites/faa.gov/files/regulations_policies/handbooks_manuals/aviation/phak/07_phak_ch5.pdf#page=19"
    programmatic_url: "https://www.faa.gov/sites/faa.gov/files/07_phak_ch5_0.pdf"
    programmatic_attestation: {url: "https://www.faa.gov/regulationspolicies/handbooksmanuals/aviation/phak/chapter-5-aerodynamics-flight", link_text: "07_phak_ch5_0.pdf", sha256: "672c1a05653b628c20eef81cc42afaafbde98bf54c7e09f9c7ad1349292c1a37"}
    revision: "FAA-H-8083-25C, 2023; FAA handbook index lists an October 2025 addendum"
    relevance_excerpt: "The PHAK describes longitudinal, lateral, and directional stability as pitch, roll, and yaw stability about the lateral, longitudinal, and vertical axes. The vertical fin and fuselage area aft of the CG tend to point the nose into the relative wind."
    verified_at_utc: "2026-08-15T23:54:13Z"
    link_status: 200
    supports_claims: [stability-by-axis, directional-weather-vane]
  - id: phak-torque-slipstream
    authority: faa_guidance
    title: "Pilot’s Handbook of Aeronautical Knowledge, Chapter 5: Aerodynamics of Flight"
    document_id: "FAA-H-8083-25C"
    locator: "Chapter 5, Torque Reaction and Corkscrew Effect, printed p. 5-31"
    url: "https://www.faa.gov/sites/faa.gov/files/regulations_policies/handbooks_manuals/aviation/phak/07_phak_ch5.pdf#page=31"
    programmatic_url: "https://www.faa.gov/sites/faa.gov/files/07_phak_ch5_0.pdf"
    programmatic_attestation: {url: "https://www.faa.gov/regulationspolicies/handbooksmanuals/aviation/phak/chapter-5-aerodynamics-flight", link_text: "07_phak_ch5_0.pdf", sha256: "672c1a05653b628c20eef81cc42afaafbde98bf54c7e09f9c7ad1349292c1a37"}
    revision: "FAA-H-8083-25C, 2023; FAA handbook index lists an October 2025 addendum"
    relevance_excerpt: "The PHAK identifies torque reaction and the corkscrew effect of the slipstream as two elements of left-turning tendency in the usual U.S.-built clockwise-from-the-pilot propeller example. The magnitude varies with airplane, propeller, engine power, RPM, airspeed, and ground conditions."
    verified_at_utc: "2026-08-15T23:54:13Z"
    link_status: 200
    supports_claims: [torque-reaction, spiraling-slipstream, aircraft-specific-variation, right-rudder-context]
  - id: phak-gyroscopic-p-factor
    authority: faa_guidance
    title: "Pilot’s Handbook of Aeronautical Knowledge, Chapter 5: Aerodynamics of Flight"
    document_id: "FAA-H-8083-25C"
    locator: "Chapter 5, Gyroscopic Action and Asymmetric Loading (P-Factor), printed p. 5-32"
    url: "https://www.faa.gov/sites/faa.gov/files/regulations_policies/handbooks_manuals/aviation/phak/07_phak_ch5.pdf#page=32"
    programmatic_url: "https://www.faa.gov/sites/faa.gov/files/07_phak_ch5_0.pdf"
    programmatic_attestation: {url: "https://www.faa.gov/regulationspolicies/handbooksmanuals/aviation/phak/chapter-5-aerodynamics-flight", link_text: "07_phak_ch5_0.pdf", sha256: "672c1a05653b628c20eef81cc42afaafbde98bf54c7e09f9c7ad1349292c1a37"}
    revision: "FAA-H-8083-25C, 2023; FAA handbook index lists an October 2025 addendum"
    relevance_excerpt: "The PHAK explains gyroscopic precession and states that, at high angle of attack, the downward-moving propeller blade can have greater resultant velocity and thrust than the upward-moving blade, creating left yaw in the usual propeller-rotation example. It emphasizes that the four effects vary with flight situation and aircraft design."
    verified_at_utc: "2026-08-15T23:54:13Z"
    link_status: 200
    supports_claims: [gyroscopic-precession, p-factor, aircraft-specific-variation, right-rudder-context]
