  - id: phak-weather-theory-purpose
    authority: faa_guidance
    title: "Pilot's Handbook of Aeronautical Knowledge, Chapter 12: Weather Theory"
    document_id: "FAA-H-8083-25C"
    locator: "Ch. 12, Introduction, p. 12-1"
    url: "https://www.faa.gov/sites/faa.gov/files/14_phak_ch12.pdf#page=1"
    revision: "2023 edition; Chapter 12 page updated July 10, 2023; October 20, 2025 addendum does not modify Chapter 12"
    relevance_excerpt: "Weather includes temperature, moisture, wind, visibility, and barometric pressure; understanding theory supports sound decisions based on reports and forecasts."
    verified_at_utc: "2026-08-28T19:41:40Z"
    link_status: 200
    supports_claims: [weather-theory-supports-interpretation]

  - id: phak-atmosphere-troposphere
    authority: faa_guidance
    title: "Pilot's Handbook of Aeronautical Knowledge, Chapter 12: Weather Theory"
    document_id: "FAA-H-8083-25C"
    locator: "Ch. 12, Atmosphere and Composition of the Atmosphere, p. 12-2"
    url: "https://www.faa.gov/sites/faa.gov/files/14_phak_ch12.pdf#page=2"
    revision: "2023 edition"
    relevance_excerpt: "Air is a moving mixture of gases with variable water vapor; most weather, clouds, storms, and temperature variations occur in the troposphere."
    verified_at_utc: "2026-08-28T19:41:40Z"
    link_status: 200
    supports_claims: [atmosphere-mixture-water-vapor, troposphere-weather-phenomena]

  - id: awh-air-parcel-troposphere
    authority: faa_guidance
    title: "Aviation Weather Handbook"
    document_id: "FAA-H-8083-28B"
    locator: "Ch. 4, Air Parcel and Troposphere, p. 4-3"
    url: "https://www.faa.gov/sites/faa.gov/files/FAA-H-8083-28B.pdf#page=63"
    revision: "FAA-H-8083-28B, April 2026"
    relevance_excerpt: "An air parcel is an imaginary volume used to assign approximately uniform atmospheric properties; it has no precise numerical size. The troposphere extends from the surface to about 36,000 feet, contains almost all weather, and varies in depth with latitude and season."
    verified_at_utc: "2026-08-30T13:34:42Z"
    link_status: 200
    supports_claims: [troposphere-depth, air-parcel-conceptual-model, parcel-properties-uniform]

  - id: awh-standard-atmosphere-reference
    authority: faa_guidance
    title: "Aviation Weather Handbook"
    document_id: "FAA-H-8083-28B"
    locator: "Ch. 4, The Standard Atmosphere, p. 4-5"
    url: "https://www.faa.gov/sites/faa.gov/files/FAA-H-8083-28B.pdf#page=65"
    revision: "FAA-H-8083-28B, April 2026"
    relevance_excerpt: "The standard atmosphere is a hypothetical fixed distribution of temperature, pressure, and density used for altimeter calibration, aircraft performance calculation, and other common reference purposes."
    verified_at_utc: "2026-08-31T14:29:00Z"
    link_status: 200
    supports_claims: [standard-atmosphere-fixed-reference]

  - id: phak-heating-density-pressure
    authority: faa_guidance
    title: "Pilot's Handbook of Aeronautical Knowledge, Chapter 12: Weather Theory"
    document_id: "FAA-H-8083-25C"
    locator: "Ch. 12, Atmospheric Circulation and Atmospheric Pressure, p. 12-3"
    url: "https://www.faa.gov/sites/faa.gov/files/14_phak_ch12.pdf#page=3"
    revision: "2023 edition"
    relevance_excerpt: "Uneven surface heating creates atmospheric motion and pressure changes; warming spreads air molecules and lowers density while cooling packs them more closely and raises density. Atmospheric pressure is force per unit area produced by the weight of the air above."
    verified_at_utc: "2026-08-31T14:38:30Z"
    link_status: 200
    supports_claims: [unequal-heating-drives-motion, temperature-density-relationship, pressure-air-weight, surface-heating-rising-air]

  - id: awh-heat-transfer-modes
    authority: faa_guidance
    title: "Aviation Weather Handbook"
    document_id: "FAA-H-8083-28B"
    locator: "Ch. 5, Heat Transfer, Radiation, Conduction, and Convection, pp. 5-4 to 5-7"
    url: "https://www.faa.gov/sites/faa.gov/files/FAA-H-8083-28B.pdf#page=70"
    revision: "FAA-H-8083-28B, April 2026"
    relevance_excerpt: "Heat moves through the atmosphere by radiation, conduction, and convection. Solar radiation transfers energy to Earth's surface; conduction transfers heat through molecular contact; convection transports heat by fluid motion."
    verified_at_utc: "2026-08-31T17:25:23Z"
    link_status: 200
    supports_claims: [heat-transfer-modes]

  - id: awh-temperature-advection
    authority: faa_guidance
    title: "Aviation Weather Handbook"
    document_id: "FAA-H-8083-28B"
    locator: "Ch. 13, Wind Effects on Stability, p. 13-8"
    url: "https://www.faa.gov/sites/faa.gov/files/FAA-H-8083-28B.pdf#page=161"
    revision: "FAA-H-8083-28B, April 2026"
    relevance_excerpt: "Wind can change an air column's temperature profile by blowing colder or warmer air into a layer; the handbook calls these horizontal temperature changes cold-air advection and warm-air advection."
    verified_at_utc: "2026-08-31T17:25:23Z"
    link_status: 200
    supports_claims: [temperature-advection]

  - id: phak-pressure-reference-altitude
    authority: faa_guidance
    title: "Pilot's Handbook of Aeronautical Knowledge, Chapter 12: Weather Theory"
    document_id: "FAA-H-8083-25C"
    locator: "Ch. 12, Measurement of Atmospheric Pressure and Altitude and Atmospheric Pressure, p. 12-5"
    url: "https://www.faa.gov/sites/faa.gov/files/14_phak_ch12.pdf#page=5"
    revision: "2023 edition"
    relevance_excerpt: "Standard sea-level pressure is 29.92 inches of mercury or 1,013.2 millibars; station readings are reduced to sea level for comparison, pressure decreases with altitude, and lower pressure corresponds to less-dense air."
    verified_at_utc: "2026-08-28T19:41:40Z"
    link_status: 200
    supports_claims: [standard-pressure-reference, sea-level-pressure-comparison, pressure-decreases-altitude]

  - id: awh-pressure-units-station
    authority: faa_guidance
    title: "Aviation Weather Handbook"
    document_id: "FAA-H-8083-28B"
    locator: "Ch. 8, Atmospheric Pressure Units and Station Pressure, p. 8-3"
    url: "https://www.faa.gov/sites/faa.gov/files/FAA-H-8083-28B.pdf#page=97"
    revision: "FAA-H-8083-28B, April 2026"
    relevance_excerpt: "Hectopascals and millibars are equivalent pressure units; inches of mercury are used for U.S. altimetry. Station pressure is the actual pressure at field elevation and is normally lower at higher-elevation airports."
    verified_at_utc: "2026-08-30T13:34:42Z"
    link_status: 200
    supports_claims: [hectopascal-millibar-equivalence, station-pressure-local-reference]

  - id: awh-sea-level-pressure-reference
    authority: faa_guidance
    title: "Aviation Weather Handbook"
    document_id: "FAA-H-8083-28B"
    locator: "Ch. 8, Sea Level Pressure, p. 8-6"
    url: "https://www.faa.gov/sites/faa.gov/files/FAA-H-8083-28B.pdf#page=100"
    revision: "FAA-H-8083-28B, April 2026"
    relevance_excerpt: "Station pressures at different elevations are adjusted to mean sea level to make them comparable; sea-level pressure is typically displayed on surface weather charts."
    verified_at_utc: "2026-08-30T13:34:42Z"
    link_status: 200
    supports_claims: [sea-level-pressure-comparison]

  - id: faa-pcg-altitude-reference
    authority: faa_guidance
    title: "Pilot/Controller Glossary"
    document_id: "FAA Pilot/Controller Glossary"
    locator: "Term ALTITUDE, including MSL Altitude and AGL Altitude"
    url: "https://www.faa.gov/air_traffic/publications/atpubs/pcg_html/glossary-a.html#ALTITUDE"
    revision: "Current FAA web edition verified August 30, 2026"
    relevance_excerpt: "Altitude is the height of a level, point, or object measured above ground level or from mean sea level; MSL altitude is measured from mean sea level and AGL altitude is measured above ground level."
    verified_at_utc: "2026-08-30T13:34:42Z"
    link_status: 200
    supports_claims: [msl-agl-references]

  - id: faa-pcg-airport-elevation
    authority: faa_guidance
    title: "Pilot/Controller Glossary"
    document_id: "FAA Pilot/Controller Glossary"
    locator: "Term AIRPORT ELEVATION"
    url: "https://www.faa.gov/air_traffic/publications/atpubs/pcg_html/glossary-a.html#AIRPORT_ELEVATION"
    revision: "Current FAA web edition verified August 30, 2026"
    relevance_excerpt: "Airport elevation is the highest point of an airport's usable runways measured in feet from mean sea level."
    verified_at_utc: "2026-08-30T13:34:42Z"
    link_status: 200
    supports_claims: [airport-elevation-reference]

  - id: awh-altimeter-setting-reference
    authority: faa_guidance
    title: "Aviation Weather Handbook"
    document_id: "FAA-H-8083-28B"
    locator: "Ch. 8, Indicated Altitude and Altimeter Setting, pp. 8-11 to 8-12"
    url: "https://www.faa.gov/sites/faa.gov/files/FAA-H-8083-28B.pdf#page=106"
    revision: "FAA-H-8083-28B, April 2026"
    relevance_excerpt: "Indicated altitude is an MSL altitude shown with the local altimeter setting; the setting is chosen so the altimeter indicates true altitude at field elevation and keeps nearby aircraft indications compatible."
    verified_at_utc: "2026-08-30T13:34:42Z"
    link_status: 200
    supports_claims: [altimeter-setting-purpose]

  - id: awh-pressure-altitude-reference
    authority: faa_guidance
    title: "Aviation Weather Handbook"
    document_id: "FAA-H-8083-28B"
    locator: "Ch. 8, Pressure Altitude, p. 8-13"
    url: "https://www.faa.gov/sites/faa.gov/files/FAA-H-8083-28B.pdf#page=107"
    revision: "FAA-H-8083-28B, April 2026"
    relevance_excerpt: "Pressure altitude is the altitude associated with a specific static-port pressure when the altimeter is set to the standard 29.92 inches of mercury reference."
    verified_at_utc: "2026-08-30T13:34:42Z"
    link_status: 200
    supports_claims: [pressure-altitude-reference]

  - id: awh-density-altitude-reference
    authority: faa_guidance
    title: "Aviation Weather Handbook"
    document_id: "FAA-H-8083-28B"
    locator: "Ch. 8, Density Altitude, p. 8-14"
    url: "https://www.faa.gov/sites/faa.gov/files/FAA-H-8083-28B.pdf#page=108"
    revision: "FAA-H-8083-28B, April 2026"
    relevance_excerpt: "Density altitude is pressure altitude corrected for temperature deviations from the standard atmosphere and is an index to aircraft performance."
    verified_at_utc: "2026-08-31T20:14:00Z"
    link_status: 200
    supports_claims: [density-altitude-performance-index]

  - id: awh-metar-altimeter-cloud-bases
    authority: faa_guidance
    title: "Aviation Weather Handbook"
    document_id: "FAA-H-8083-28B"
    locator: "Ch. 24, Sky Condition, Temperature/Dewpoint, and Altimeter Group, p. 24-18"
    url: "https://www.faa.gov/sites/faa.gov/files/FAA-H-8083-28B.pdf#page=302"
    revision: "FAA-H-8083-28B, April 2026"
    relevance_excerpt: "METAR cloud-layer heights are expressed in feet AGL; the altimeter group reports the altimeter setting in inches of mercury for use by aircraft altimeters."
    verified_at_utc: "2026-08-31T14:29:00Z"
    link_status: 200
    supports_claims: [metar-altimeter-cloud-references]

  - id: awh-metar-sea-level-pressure
    authority: faa_guidance
    title: "Aviation Weather Handbook"
    document_id: "FAA-H-8083-28B"
    locator: "Ch. 24, Sea Level Pressure remark, p. 24-24"
