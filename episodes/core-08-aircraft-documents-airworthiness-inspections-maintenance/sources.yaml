  - id: cfr-91-407-after-maintenance
    authority: regulation
    title: "14 CFR § 91.407 — Operation after maintenance, preventive maintenance, rebuilding, or alteration"
    document_id: "14 CFR 91.407"
    locator: "§ 91.407(a)–(b)"
    url: "https://www.ecfr.gov/current/title-14/chapter-I/subchapter-F/part-91/subpart-E/section-91.407"
    validation_url: "https://www.ecfr.gov/api/versioner/v1/full/2026-08-20/title-14.xml?part=91"
    revision: "eCFR current through August 20, 2026"
    relevance_excerpt: "After maintenance, no person may operate the aircraft until it is approved for return to service and the required entry is made. If work may appreciably change flight characteristics or substantially affect operation in flight, the aircraft may not carry anyone other than crewmembers until an appropriately rated pilot with at least a private pilot certificate conducts and logs an operational check, unless ground tests, inspection, or both conclusively show otherwise."
    verified_at_utc: "2026-08-24T16:58:27Z"
    link_status: 200
    supports_claims: [after-maintenance-return-entry, after-maintenance-operational-check]

