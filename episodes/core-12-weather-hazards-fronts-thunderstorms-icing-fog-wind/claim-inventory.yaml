episode_id: "core-12"
claims:
  - {id: acs-hazards-decision-standard, type: faa_regulatory_standard, statement: "The private-pilot Weather Information task requires understanding hazardous weather and using it in go/no-go and continue/divert decisions, not merely recalling names.", sources: [acs-weather-hazards-decisions], risk: safety_critical, script_sections: ["What the ACS is asking you to connect", "Crossing western terrain: wind is not one number", "Retrieval review"], status: draft}
  - {id: conservative-correlation-framework, type: faa_regulatory_standard, statement: "The applicant must analyze implications and correlate available weather information with a flight decision while accounting for resource limitations and personal minimums.", sources: [acs-weather-hazards-decisions], risk: safety_critical, script_sections: ["Put the hypothetical route on the table", "Re-plan the whole trip", "Retrieval review"], status: draft}
  - {id: wind-pressure-local-effects, type: faa_guidance, statement: "Pressure differences, Coriolis force, friction, and temperature differences produce atmospheric motion, while local conditions and geological features can change wind direction and speed close to the surface.", sources: [phak-wind-circulation], risk: material, script_sections: ["Crossing western terrain: wind is not one number", "Retrieval review"], status: draft}
  - {id: obstruction-terrain-turbulence, type: faa_guidance, statement: "Ground topography and large buildings disturb wind flow, producing rapidly changing gusts and turbulence whose intensity depends on obstacle size and wind speed and matters near runways.", sources: [phak-obstruction-wind], risk: safety_critical, script_sections: ["Crossing western terrain: wind is not one number", "A Wisconsin arrival begins with runway geometry", "Retrieval review"], status: draft}
  - {id: mountain-wave-downdraft-rotor, type: faa_guidance, statement: "Mountain waves can contain larger-scale updrafts and downdrafts, and a rotor zone can develop near or below ridge level on the downwind side with potentially severe-to-extreme wind shear and turbulence.", sources: [awh-mountain-wave-hazards], risk: safety_critical, script_sections: ["Crossing western terrain: wind is not one number"], status: draft}
  - {id: mountain-wave-forecast-variability, type: faa_guidance, statement: "Mountain-wave activity can be difficult to forecast, highly localized, and short-lived.", sources: [aim-mountain-wave-forecast-limits], risk: safety_critical, script_sections: ["Crossing western terrain: wind is not one number"], status: draft}
  - {id: wind-shear-performance-change, type: faa_guidance, statement: "Wind shear is a rapid change in wind speed or direction over a small area and can abruptly change airspeed, performance, and flightpath, especially near the ground.", sources: [phak-low-level-wind-shear], risk: safety_critical, script_sections: ["Low-level wind shear can change the arrival before the rain", "Retrieval review"], status: draft}
  - {id: microburst-outflow-sequence, type: faa_guidance, statement: "A microburst combines a strong downdraft with spreading surface outflow, so an aircraft can encounter changing headwind, downdraft, and tailwind components in quick succession.", sources: [phak-low-level-wind-shear], risk: safety_critical, script_sections: ["Low-level wind shear can change the arrival before the rain"], status: draft}
  - {id: air-mass-front-boundary, type: faa_guidance, statement: "A front is the boundary layer between air masses with different characteristics.", sources: [phak-fronts-air-masses], risk: material, script_sections: ["A front on the route is a sloping volume", "Retrieval review"], status: draft}
  - {id: front-chart-surface-location, type: faa_guidance, statement: "Surface-front symbols depict the analyzed location of warm, cold, stationary, and occluded fronts on a surface analysis chart.", sources: [phak-front-chart-location], risk: material, script_sections: ["A front on the route is a sloping volume", "Retrieval review"], status: draft}
  - {id: front-multi-cue-recognition, type: faa_guidance, statement: "At the surface, a front may be detected through temperature gradients, wind convergence, and a pressure fall before passage followed by a pressure rise.", sources: [awh-front-surface-signs], risk: material, script_sections: ["A front on the route is a sloping volume", "Retrieval review"], status: draft}
  - {id: front-transition-zone, type: faa_guidance, statement: "A front has vertical structure and slopes over colder, denser air rather than existing only at the surface.", sources: [awh-front-variability], risk: material, script_sections: ["A front on the route is a sloping volume", "Retrieval review"], status: draft}
  - {id: fronts-not-weather-script, type: faa_guidance, statement: "No two fronts are the same, although generalized weather conditions associated with front types help identify them.", sources: [phak-fronts-air-masses], risk: safety_critical, script_sections: ["Front names change the route question", "Retrieval review"], status: draft}
  - {id: warm-front-broad-weather, type: faa_guidance, statement: "Advancing warm air slides gradually over colder air; lifting can produce cirriform or stratiform cloud and fog along the frontal boundary, with thunderstorms possible in summer.", sources: [phak-warm-front], risk: material, script_sections: ["Front names change the route question", "Retrieval review"], status: draft}
  - {id: cold-front-concentrated-weather, type: faa_guidance, statement: "Advancing cold air slides beneath warmer air and forces it upward; a fast-moving cold front can have a steeper surface and narrow band of concentrated weather.", sources: [phak-cold-front], risk: material, script_sections: ["Front names change the route question", "Retrieval review"], status: draft}
  - {id: stationary-front-duration, type: faa_guidance, statement: "A stationary front can influence local weather for days when opposing air-mass forces remain relatively equal.", sources: [phak-stationary-occluded-fronts], risk: material, script_sections: ["Front names change the route question", "Retrieval review"], status: draft}
  - {id: occluded-front-formation, type: faa_guidance, statement: "An occluded front forms when a faster cold front catches a slower warm front.", sources: [phak-stationary-occluded-fronts], risk: material, script_sections: ["Front names change the route question", "Retrieval review"], status: draft}
  - {id: thunderstorm-three-ingredients, type: faa_guidance, statement: "Thunderstorm development requires sufficient water vapor, unstable air, and a lifting mechanism.", sources: [awh-thunderstorm-ingredients-lifecycle], risk: material, script_sections: ["Stop before the Plains cold front", "Retrieval review"], status: draft}
  - {id: thunderstorm-life-cycle, type: faa_guidance, statement: "The mature stage begins when precipitation reaches the surface and a downdraft develops alongside the updraft; the dissipating stage is dominated by downdraft.", sources: [awh-thunderstorm-lifecycle], risk: material, script_sections: ["Stop before the Plains cold front", "Retrieval review"], status: draft}
  - {id: all-thunderstorms-hazardous, type: faa_guidance, statement: "All thunderstorms contain aviation hazards in different combinations, but not every thunderstorm contains every listed hazard.", sources: [awh-thunderstorm-hazards], risk: safety_critical, script_sections: ["Stop before the Plains cold front", "Retrieval review"], status: draft}
  - {id: gust-front-ahead-parent, type: faa_guidance, statement: "A mature-stage downdraft can spread along the surface as a cool gust front well ahead of the parent thunderstorm cell.", sources: [awh-thunderstorm-lifecycle], risk: safety_critical, script_sections: ["Stop before the Plains cold front", "Low-level wind shear can change the arrival before the rain", "Retrieval review"], status: draft}
  - {id: storm-visual-hazards-uncertain, type: faa_guidance, statement: "Visual appearance cannot determine which combination of aviation hazards a thunderstorm contains.", sources: [awh-thunderstorm-hazards], risk: safety_critical, script_sections: ["Stop before the Plains cold front", "Retrieval review"], status: draft}
  - {id: thunderstorm-avoidance-strategy, type: faa_guidance, statement: "FAA guidance makes thunderstorm avoidance the primary policy and warns against takeoff or landing toward an approaching storm and flight under a cell or anvil.", sources: [awh-thunderstorm-avoidance], risk: safety_critical, script_sections: ["Stop before the Plains cold front", "Use delayed radar strategically to stay clear of the convective area", "Retrieval review"], status: draft}
  - {id: thunderstorm-divert-wait, type: faa_guidance, statement: "FAA guidance says to divert and wait out thunderstorms on the ground when unable to navigate around a thunderstorm area.", sources: [awh-thunderstorm-divert-wait], risk: safety_critical, script_sections: ["Use delayed radar strategically to stay clear of the convective area", "Retrieval review"], status: draft}
  - {id: datalink-strategic-not-tactical, type: faa_guidance, statement: "Data-linked NEXRAD mosaic imagery is delayed and supports strategic route selection to avoid thunderstorms; it must not be used as the sole means for tactical path negotiation through a thunderstorm area.", sources: [awh-thunderstorm-avoidance], risk: safety_critical, script_sections: ["Use delayed radar strategically to stay clear of the convective area", "Retrieval review"], status: draft}
  - {id: structural-icing-ingredients, type: faa_guidance, statement: "Structural icing requires liquid water that is supercooled below freezing and freezes on impact with the aircraft.", sources: [awh-icing-supercooled-water], risk: safety_critical, script_sections: ["Place icing inside the frontal cross-section", "Retrieval review"], status: draft}
  - {id: icing-form-variability, type: faa_guidance, statement: "Supercooled liquid water content, temperature, and droplet size are closely related to icing type and severity; aircraft type, design, and airspeed also matter.", sources: [awh-icing-factors], risk: safety_critical, script_sections: ["Place icing inside the frontal cross-section"], status: draft}
  - {id: icing-frontal-terrain-distribution, type: faa_guidance, statement: "Freezing rain or freezing drizzle below a front is a favored location for severe clear icing and can extend over a broad area, while mountain windward-side upward currents can support large supercooled droplets above the freezing level.", sources: [awh-icing-fronts-terrain], risk: safety_critical, script_sections: ["Place icing inside the frontal cross-section", "Retrieval review"], status: draft}
  - {id: icing-aerodynamic-system-effects, type: faa_guidance, statement: "Even small roughness from frost, snow, or ice on a wing can reduce lift and increase drag, and ice can accumulate on exposed frontal surfaces including the propeller, windshield, antennas, vents, intakes, and cowlings.", sources: [awh-icing-effects], risk: safety_critical, script_sections: ["Place icing inside the frontal cross-section", "Retrieval review"], status: draft}
  - {id: fog-cloud-at-surface, type: faa_guidance, statement: "Fog is based at the surface and reduces horizontal visibility below five-eighths statute mile.", sources: [awh-fog-definition-radiation], risk: safety_critical, script_sections: ["Northern California departure: ask why visibility is low", "Crossing western terrain: wind is not one number", "Retrieval review"], status: draft}
  - {id: radiation-fog-ingredients, type: faa_guidance, statement: "Radiation fog is favored by shallow relatively moist surface air, clear sky, and light wind; calm keeps it shallow, slight mixing can deepen it, and stronger wind disperses it or lifts it into low cloud.", sources: [awh-radiation-fog-factors], risk: material, script_sections: ["Northern California departure: ask why visibility is low", "Retrieval review"], status: draft}
  - {id: advection-fog-formation, type: faa_guidance, statement: "Advection fog forms when moist air moves over a colder surface and cools below its dewpoint.", sources: [awh-fog-advection-upslope], risk: material, script_sections: ["Northern California departure: ask why visibility is low", "Retrieval review"], status: draft}
  - {id: upslope-fog-formation, type: faa_guidance, statement: "Upslope fog forms when moist stable air moves up sloping terrain and cools adiabatically to or below its dewpoint.", sources: [awh-fog-upslope], risk: material, script_sections: ["Crossing western terrain: wind is not one number", "Retrieval review"], status: draft}
  - {id: frontal-fog-formation, type: faa_guidance, statement: "Frontal fog can form when precipitation evaporates or sublimates into cold air below that is already near its dewpoint and saturates it.", sources: [awh-fog-precipitation-steam], risk: material, script_sections: ["A Wisconsin arrival begins with runway geometry", "Retrieval review"], status: draft}
  - {id: steam-fog-formation, type: faa_guidance, statement: "Steam fog can form when very cold air moves over relatively warm water and added vapor recondenses in the cold air.", sources: [awh-fog-steam], risk: material, script_sections: ["A Wisconsin arrival begins with runway geometry", "Retrieval review"], status: draft}
  - {id: crosswind-components-runway, type: faa_guidance, statement: "Natural wind has a headwind component along the ground track and a crosswind component at right angles; takeoff and landing capability should be considered against reported wind and available landing directions.", sources: [afh-crosswind-capability], risk: material, script_sections: ["A Wisconsin arrival begins with runway geometry", "Retrieval review"], status: draft}
  - {id: crosswind-component-capability, type: faa_guidance, statement: "A crosswind component chart determines headwind and crosswind components, and pilots should avoid wind conditions that exceed the airplane's maximum crosswind capability.", sources: [afh-crosswind-chart-capability], risk: safety_critical, script_sections: ["A Wisconsin arrival begins with runway geometry", "Retrieval review"], status: draft}
