learning_objectives:
  - "Explain a stall as exceeding critical angle of attack, not reaching one universal airspeed."
  - "Connect load factor, coordination, and the changing airspeed at which critical angle of attack can occur."
  - "Recognize why stall cues and recovery procedures must be understood for the particular airplane."
  - "Explain how a stalled, yawed airplane can enter a spin and how avoiding that combination reduces risk."
trouble_spots:
  - "Treating a published one-G stall speed as a universal margin from a stall"
  - "Assuming pitch attitude alone tells the pilot angle of attack"
  - "Using rudder to tighten an overshooting turn rather than changing the plan"
  - "Assuming a generic spin recovery replaces the POH/AFM procedure"
