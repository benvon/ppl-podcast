          areas; requires risk management for go/no-go and continue/divert
          decisions, personal weather minimums, hazardous weather, and
          limitations of weather equipment, reports, forecasts, and inflight
          resources; and requires analyzing weather implications and correlating
          weather information to a go/no-go decision. The cited authored
          statements preserve these requirements without adding material ACS
          requirements.
