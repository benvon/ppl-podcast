    link_status: 200
    supports_claims: [asos-awos-observations]

  - id: atc-atis-altimeter-content
    authority: faa_guidance
    title: "FAA Order JO 7110.65, Air Traffic Control"
    document_id: "FAA Order JO 7110.65"
    locator: "Ch. 2, Automatic Terminal Information Service Procedures, para. 2-9-3"
