episode_id: "core-07"
claims:
  - {id: acs-instrument-systems-anchor, type: faa_standard, statement: "The Private Pilot Airplane ACS includes pitot-static, vacuum/pressure, and associated flight instruments in the Operation of Systems task.", sources: [acs-operation-of-systems], risk: checkride, script_sections: [what-the-acs-is-asking-you-to-connect], status: fact_checked_initial_draft}
  - {id: acs-failure-recognition-anchor, type: faa_standard, statement: "The ACS connects instrument-system knowledge with recognizing abnormal or failure indications, detecting a malfunction, and managing a system failure.", sources: [acs-operation-of-systems], risk: safety_critical, script_sections: [what-the-acs-is-asking-you-to-connect, retrieval-review], status: fact_checked_initial_draft}
  - {id: acs-cross-check-anchor, type: faa_standard, statement: "The ACS basic instrument maneuver tasks require understanding instrument limitations and errors, instrument function and operation, attitude indications, and proper instrument cross-check techniques.", sources: [acs-basic-instrument-cross-check], risk: checkride, script_sections: [what-the-acs-is-asking-you-to-connect, cross-check-the-story-not-the-loudest-gauge], status: fact_checked_initial_draft}
  - {id: acs-instrument-risk-anchor, type: faa_standard, statement: "The ACS identifies spatial disorientation, loss of control, and deciding when to seek assistance or declare an emergency among risks associated with basic instrument flight.", sources: [acs-basic-instrument-cross-check], risk: safety_critical, script_sections: [cross-check-the-story-not-the-loudest-gauge], status: fact_checked_initial_draft}
  - {id: acs-equipment-failure-factor, type: faa_standard, statement: "The ACS includes system and equipment failures among factors relevant to preventing unusual attitudes.", sources: [acs-unusual-attitude-failure-factor], risk: safety_critical, script_sections: [what-each-gyro-can-and-cannot-tell-you], status: fact_checked_initial_draft}
  - {id: pitot-static-pressure-model, type: faa_guidance, statement: "Static pressure is ambient atmospheric pressure, dynamic pressure is associated with motion through air, and the pitot tube receives total pressure consisting of static plus dynamic pressure.", sources: [phak-pitot-static-overview], risk: instructional, script_sections: [three-questions-for-every-instrument, pitot-static-pressure-becomes-information], status: fact_checked_initial_draft}
  - {id: pitot-static-instrument-source-map, type: faa_guidance, statement: "The ASI uses pitot total pressure and static pressure, while the altimeter and VSI use static pressure only.", sources: [phak-pitot-static-overview], risk: safety_critical, script_sections: [three-questions-for-every-instrument, pitot-static-pressure-becomes-information, retrieval-review], status: fact_checked_initial_draft}
  - {id: alternate-static-general-effects, type: faa_guidance, statement: "In the PHAK's general conventional example, selecting a lower-pressure flight-deck alternate static source makes the altimeter and ASI indicate higher and causes a momentary VSI climb before stabilization at constant altitude.", sources: [phak-alternate-static], risk: safety_critical, script_sections: [a-blocked-static-source-changes-the-family], status: fact_checked_initial_draft}
  - {id: aircraft-specific-static-corrections, type: faa_guidance, statement: "The AFM or POH identifies the error introduced by an airplane's alternate static source and the approved response for its installation.", sources: [phak-alternate-static], risk: safety_critical, script_sections: [a-blocked-static-source-changes-the-family], status: fact_checked_initial_draft}
  - {id: altimeter-senses-static-pressure, type: faa_guidance, statement: "A pressure altimeter uses static pressure acting around sealed aneroid wafers; lower pressure expands them and is displayed as higher altitude, while higher pressure contracts them and is displayed as lower altitude.", sources: [phak-altimeter-operation-and-errors], risk: instructional, script_sections: [pitot-static-pressure-becomes-information], status: fact_checked_initial_draft}
  - {id: cold-temperature-altimeter-error, type: faa_guidance, statement: "An altimeter setting compensates for nonstandard pressure but not nonstandard temperature; in colder-than-standard air, true altitude can be lower than indicated altitude.", sources: [phak-altimeter-temperature-error], risk: safety_critical, script_sections: [pitot-static-pressure-becomes-information], status: fact_checked_initial_draft}
  - {id: vsi-differential-pressure, type: faa_guidance, statement: "A VSI compares direct static pressure inside a diaphragm with static pressure entering the case through a calibrated restriction.", sources: [phak-vsi-operation], risk: instructional, script_sections: [pitot-static-pressure-becomes-information], status: fact_checked_initial_draft}
  - {id: vsi-trend-rate-lag, type: faa_guidance, statement: "A conventional VSI first shows a change in vertical trend and then, after normal lag, a stabilized rate of climb or descent.", sources: [phak-vsi-operation], risk: safety_critical, script_sections: [three-questions-for-every-instrument, pitot-static-pressure-becomes-information], status: fact_checked_initial_draft}
  - {id: asi-is-pressure-comparison, type: faa_guidance, statement: "The ASI is a differential pressure instrument that compares pitot pressure in its diaphragm with static pressure in the surrounding case.", sources: [phak-asi-operation], risk: instructional, script_sections: [pitot-static-pressure-becomes-information], status: fact_checked_initial_draft}
  - {id: pitot-block-drain-open, type: faa_guidance, statement: "If the pitot opening is blocked but its drain remains open, trapped air vents, pitot pressure equalizes toward ambient pressure, and the ASI rapidly falls toward zero.", sources: [phak-blocked-pitot], risk: safety_critical, script_sections: [a-blocked-pitot-source-changes-one-instrument, retrieval-review], status: fact_checked_initial_draft}
  - {id: pitot-block-pressure-trapped, type: faa_guidance, statement: "If both the pitot opening and drain are blocked, total pressure is trapped and the ASI no longer responds normally to actual airspeed changes at a constant altitude.", sources: [phak-blocked-pitot], risk: safety_critical, script_sections: [a-blocked-pitot-source-changes-one-instrument], status: fact_checked_initial_draft}
  - {id: pitot-block-leaves-static-instruments, type: teaching_explanation, statement: "With a pitot-only blockage and an open static system, the altimeter and VSI remain available as independent static-pressure evidence while the ASI is affected.", sources: [phak-blocked-pitot, phak-pitot-static-overview], risk: safety_critical, script_sections: [a-blocked-pitot-source-changes-one-instrument], status: fact_checked_initial_draft}
  - {id: trapped-pitot-asi-follows-altitude, type: faa_guidance, statement: "With trapped pitot pressure and a clear static source, the ASI indicates higher in a climb and lower in a descent because live static pressure changes around the diaphragm.", sources: [phak-trapped-pitot-altitude-effect], risk: safety_critical, script_sections: [a-blocked-pitot-source-changes-one-instrument, retrieval-review], status: fact_checked_initial_draft}
  - {id: static-block-altimeter-vsi, type: faa_guidance, statement: "A blocked static system traps pressure, freezes the altimeter near the blockage altitude, and makes the VSI settle at zero.", sources: [phak-blocked-static], risk: safety_critical, script_sections: [a-blocked-static-source-changes-the-family, retrieval-review], status: fact_checked_initial_draft}
  - {id: static-block-asi-error, type: faa_guidance, statement: "With a blocked static source and clear pitot tube, the ASI reads lower than actual above the blockage altitude and higher than actual below it.", sources: [phak-blocked-static], risk: safety_critical, script_sections: [a-blocked-static-source-changes-the-family, retrieval-review], status: fact_checked_initial_draft}
  - {id: shared-static-can-fail-together, type: teaching_explanation, statement: "Because the ASI, altimeter, and VSI share static pressure, one static blockage can make all three indications wrong in a coordinated pattern.", sources: [phak-blocked-static, phak-pitot-static-overview], risk: safety_critical, script_sections: [a-blocked-static-source-changes-the-family, cross-check-by-source-and-failure-path], status: fact_checked_initial_draft}
  - {id: pfd-combines-indications, type: faa_guidance, statement: "A primary flight display can combine airspeed, attitude, altitude, vertical speed, turn, and heading information on one screen.", sources: [phak-glass-sensor-paths], risk: instructional, script_sections: [electronic-displays-still-have-source-paths], status: fact_checked_initial_draft}
  - {id: adc-uses-pitot-static-inputs, type: faa_guidance, statement: "An air data computer receives pitot-static inputs and computes airspeed and altitude data for an electronic flight display.", sources: [phak-air-data-computer], risk: safety_critical, script_sections: [electronic-displays-still-have-source-paths], status: fact_checked_initial_draft}
  - {id: display-does-not-create-independent-sources, type: teaching_explanation, statement: "Putting several indications on one electronic display does not make their underlying sensor inputs independent.", sources: [phak-glass-sensor-paths, phak-air-data-computer, phak-ahrs-heading-path], risk: safety_critical, script_sections: [electronic-displays-still-have-source-paths], status: fact_checked_initial_draft}
  - {id: ahrs-and-magnetometer-paths, type: faa_guidance, statement: "An AHRS provides attitude information to the PFD, while heading information is derived from a magnetometer sensing Earth's magnetic field.", sources: [phak-ahrs-heading-path], risk: instructional, script_sections: [electronic-displays-still-have-source-paths], status: fact_checked_initial_draft}
  - {id: gyro-rigidity, type: faa_guidance, statement: "Rigidity in space is a spinning gyro's tendency to remain aligned in its plane of rotation.", sources: [phak-gyro-principles], risk: instructional, script_sections: [gyroscopes-stability-needs-power], status: fact_checked_initial_draft}
  - {id: gyro-precession, type: faa_guidance, statement: "Precession is a gyro's response to a deflecting force appearing 90 degrees later in the direction of rotation; it can be used for rate indication or can contribute unwanted error.", sources: [phak-gyro-principles], risk: instructional, script_sections: [gyroscopes-stability-needs-power], status: fact_checked_initial_draft}
  - {id: common-gyro-power-split, type: faa_guidance, statement: "A common conventional arrangement uses vacuum or pressure power for attitude and heading indicators and electrical power for the turn coordinator.", sources: [phak-gyro-power-and-low-vacuum], risk: safety_critical, script_sections: [three-questions-for-every-instrument, gyroscopes-stability-needs-power, retrieval-review], status: fact_checked_initial_draft}
  - {id: gyro-source-diversity, type: faa_guidance, statement: "Many aircraft use at least two gyro power sources so one source of bank information remains after one power-source failure.", sources: [phak-gyro-power-and-low-vacuum], risk: safety_critical, script_sections: [gyroscopes-stability-needs-power], status: fact_checked_initial_draft}
  - {id: low-vacuum-unreliable-gyros, type: faa_guidance, statement: "Low suction can slow vacuum-driven gyros and make the attitude and heading indicators unstable and inaccurate.", sources: [phak-gyro-power-and-low-vacuum], risk: safety_critical, script_sections: [gyroscopes-stability-needs-power, cross-check-by-source-and-failure-path, retrieval-review], status: fact_checked_initial_draft}
  - {id: turn-indicator-backup-bank, type: faa_guidance, statement: "Turn indicators can provide backup bank information if the attitude indicator fails.", sources: [phak-turn-indicator-backup], risk: safety_critical, script_sections: [what-each-gyro-can-and-cannot-tell-you], status: fact_checked_initial_draft}
  - {id: turn-coordinator-information, type: faa_guidance, statement: "A turn coordinator's canted gyro initially senses roll rate and, after roll stabilizes, indicates rate and direction of turn.", sources: [phak-turn-coordinator], risk: instructional, script_sections: [what-each-gyro-can-and-cannot-tell-you], status: fact_checked_initial_draft}
  - {id: turn-coordinator-limitations, type: faa_guidance, statement: "A turn coordinator does not display a specific bank angle and provides no pitch information.", sources: [phak-turn-coordinator], risk: safety_critical, script_sections: [what-each-gyro-can-and-cannot-tell-you], status: fact_checked_initial_draft}
  - {id: inclinometer-coordination, type: faa_guidance, statement: "The inclinometer ball shows turn coordination rather than aircraft attitude.", sources: [phak-inclinometer], risk: instructional, script_sections: [what-each-gyro-can-and-cannot-tell-you], status: fact_checked_initial_draft}
  - {id: attitude-indicator-purpose, type: faa_guidance, statement: "A conventional attitude indicator uses gyro rigidity and the relationship of a miniature airplane to a horizon bar to show pitch and bank.", sources: [phak-attitude-indicator], risk: instructional, script_sections: [what-each-gyro-can-and-cannot-tell-you], status: fact_checked_initial_draft}
  - {id: attitude-indicator-limits, type: faa_guidance, statement: "Conventional attitude-indicator pitch and bank limits vary; some instruments can peg, tumble, or show erroneous indications when those limits are exceeded, while many modern designs avoid that failure mode.", sources: [phak-attitude-indicator-limits], risk: safety_critical, script_sections: [what-each-gyro-can-and-cannot-tell-you], status: fact_checked_initial_draft}
  - {id: heading-indicator-drift, type: faa_guidance, statement: "A free-gyro heading indicator provides a stable display but drifts because of frictional precession and Earth rotation and therefore requires comparison with the magnetic compass.", sources: [phak-heading-indicator-drift], risk: safety_critical, script_sections: [what-each-gyro-can-and-cannot-tell-you, retrieval-review], status: fact_checked_initial_draft}
  - {id: heading-alignment-conditions, type: faa_guidance, statement: "A free heading indicator should be compared frequently with the magnetic compass and aligned while straight and level at a constant speed to reduce compass errors.", sources: [phak-heading-low-vacuum], risk: safety_critical, script_sections: [what-each-gyro-can-and-cannot-tell-you, magnetic-compass-design-and-errors], status: fact_checked_initial_draft}
  - {id: low-suction-increases-gyro-error, type: faa_guidance, statement: "When inadequate suction slows attitude and heading gyros, they become more susceptible to deflection from their intended plane of rotation.", sources: [phak-heading-low-vacuum], risk: safety_critical, script_sections: [what-each-gyro-can-and-cannot-tell-you], status: fact_checked_initial_draft}
  - {id: magnetic-compass-principle, type: faa_guidance, statement: "A conventional magnetic compass uses magnets attached to a fluid-damped float and card assembly that aligns with Earth's magnetic field.", sources: [phak-magnetic-compass-basics], risk: instructional, script_sections: [three-questions-for-every-instrument, magnetic-compass-design-and-errors], status: fact_checked_initial_draft}
  - {id: compass-bank-limitation, type: faa_guidance, statement: "A conventional magnetic compass permits limited tilt and can give erratic, unpredictable indications at steeper bank angles.", sources: [phak-magnetic-compass-basics], risk: safety_critical, script_sections: [magnetic-compass-design-and-errors], status: fact_checked_initial_draft}
  - {id: compass-dip-physical-model, type: faa_guidance, statement: "In the Northern Hemisphere, Earth's magnetic field slopes downward toward magnetic north; a conventional compass keeps its center of gravity below the pivot to hold the card nearly horizontal, but motion can tilt the assembly and expose it to the field's vertical component.", sources: [phak-magnetic-compass-basics, phak-compass-dip-model], risk: instructional, script_sections: [magnetic-compass-design-and-errors, retrieval-review], status: fact_checked_editorial_revision}
  - {id: variation-definition, type: faa_guidance, statement: "Variation is the location-dependent angular difference between true and magnetic directions.", sources: [phak-variation-and-deviation], risk: checkride, script_sections: [magnetic-compass-design-and-errors, retrieval-review], status: fact_checked_initial_draft}
  - {id: deviation-definition, type: faa_guidance, statement: "Deviation is heading-dependent compass error produced by magnetic fields in the airplane.", sources: [phak-variation-and-deviation], risk: checkride, script_sections: [magnetic-compass-design-and-errors, retrieval-review], status: fact_checked_initial_draft}
  - {id: deviation-correction-card, type: faa_guidance, statement: "After an AMT minimizes compass deviation, remaining heading-dependent corrections are recorded on a compass correction card near that compass.", sources: [phak-compass-correction-card], risk: safety_critical, script_sections: [magnetic-compass-design-and-errors], status: fact_checked_initial_draft}
  - {id: compass-acceleration-error, type: faa_guidance, statement: "Magnetic dip and inertia act on the pendulous compass mounting during airspeed changes; in the Northern Hemisphere on easterly or westerly headings, acceleration indicates toward north and deceleration indicates toward south.", sources: [phak-compass-dip-errors], risk: checkride, script_sections: [magnetic-compass-design-and-errors, retrieval-review], status: fact_checked_editorial_revision}
  - {id: compass-turning-error, type: faa_guidance, statement: "In the Northern Hemisphere, a conventional compass card leads when turning toward a northerly heading and lags when turning toward a southerly heading, calling for an early northerly rollout and a late southerly rollout.", sources: [phak-compass-dip-errors], risk: checkride, script_sections: [magnetic-compass-design-and-errors, retrieval-review], status: fact_checked_editorial_revision}
  - {id: compass-errors-condition-dependent, type: faa_guidance, statement: "Magnetic-compass acceleration and turning errors arise when motion tilts the compass assembly in Earth's dipping magnetic field; their direction and size vary with heading and proximity to the magnetic poles.", sources: [phak-compass-dip-model, phak-compass-dip-errors], risk: instructional, script_sections: [magnetic-compass-design-and-errors], status: fact_checked_editorial_revision}
  - {id: compass-oscillation-average, type: faa_guidance, statement: "Compass oscillation makes the card fluctuate around actual heading, so the average between swings is used when aligning a free heading indicator.", sources: [phak-compass-oscillation], risk: safety_critical, script_sections: [magnetic-compass-design-and-errors], status: fact_checked_initial_draft}
  - {id: source-grouping-cross-check, type: teaching_explanation, statement: "A disciplined cross-check compares indications from genuinely independent sources and groups disagreements by shared pressure, power, sensor, computer, or display dependencies.", sources: [acs-basic-instrument-cross-check], risk: safety_critical, script_sections: [what-the-acs-is-asking-you-to-connect, cross-check-by-source-and-failure-path], status: initial_draft}
  - {id: control-before-diagnosis, type: teaching_explanation, statement: "When indications disagree, maintaining control with reliable information and avoiding repeated inputs to chase one suspect gauge take priority over naming the exact failed component.", sources: [acs-basic-instrument-cross-check], risk: safety_critical, script_sections: [cross-check-by-source-and-failure-path], status: initial_draft}
