  - id: phak-high-low-vertical-motion
    authority: faa_guidance
    title: "Pilot's Handbook of Aeronautical Knowledge, Chapter 12: Weather Theory"
    document_id: "FAA-H-8083-25C"
    locator: "Ch. 12, Wind and Currents and Wind Patterns, p. 12-7"
    url: "https://www.faa.gov/sites/faa.gov/files/14_phak_ch12.pdf#page=7"
    revision: "2023 edition"
    relevance_excerpt: "Pressure differences, temperature, Coriolis force, and friction contribute to atmospheric motion; descending dry air is generally associated with high pressure, while rising air and increasing cloudiness or precipitation commonly accompany low pressure."
    verified_at_utc: "2026-08-28T19:41:40Z"
    link_status: 200
    supports_claims: [pressure-patterns-motion-weather]

  - id: phak-stability-adiabatic
    authority: faa_guidance
    title: "Pilot's Handbook of Aeronautical Knowledge, Chapter 12: Weather Theory"
    document_id: "FAA-H-8083-25C"
    locator: "Atmospheric Stability, printed p. 12-12"
    url: "https://www.faa.gov/sites/faa.gov/files/14_phak_ch12.pdf#page=12"
    revision: "2023 edition"
    relevance_excerpt: "Stability is resistance to vertical motion. Stable air damps vertical disturbances; unstable air amplifies them. Rising air expands and cools as pressure decreases, while descending air compresses and warms."
    verified_at_utc: "2026-08-28T19:41:40Z"
    link_status: 200
    supports_claims: [stability-definition, rising-cools-descending-warms]

  - id: awh-parcel-stability-comparison
    authority: faa_guidance
    title: "Aviation Weather Handbook"
    document_id: "FAA-H-8083-28B"
    locator: "Ch. 13, Using a Parcel as a Tool to Evaluate Stability, p. 13-2"
    url: "https://www.faa.gov/sites/faa.gov/files/FAA-H-8083-28B.pdf#page=155"
    revision: "FAA-H-8083-28B, April 2026"
    relevance_excerpt: "Atmospheric stability is evaluated by hypothetically lifting a parcel and comparing its temperature and density with surrounding environmental air at the same test level."
    verified_at_utc: "2026-08-31T14:29:00Z"
    link_status: 200
    supports_claims: [parcel-environment-stability-comparison]

  - id: awh-convection-definition
    authority: faa_guidance
    title: "Aviation Weather Handbook"
    document_id: "FAA-H-8083-28B"
    locator: "Ch. 13, Convection, p. 13-11"
    url: "https://www.faa.gov/sites/faa.gov/files/FAA-H-8083-28B.pdf#page=164"
    revision: "FAA-H-8083-28B, April 2026"
    relevance_excerpt: "In meteorology, convection is vertical transport of heat and moisture by updrafts and downdrafts in an unstable atmosphere and may occur with or without visible clouds."
    verified_at_utc: "2026-08-31T14:29:00Z"
    link_status: 200
    supports_claims: [convection-vertical-transport]

  - id: phak-lapse-moisture-inversion
    authority: faa_guidance
    title: "Pilot's Handbook of Aeronautical Knowledge, Chapter 12: Weather Theory"
    document_id: "FAA-H-8083-25C"
    locator: "Ch. 12, Adiabatic Process, Moisture and Temperature, Relative Humidity, and Inversion, p. 12-13"
    url: "https://www.faa.gov/sites/faa.gov/files/14_phak_ch12.pdf#page=13"
    revision: "2023 edition"
    relevance_excerpt: "An air parcel cools as it rises and expands and warms as it descends and compresses. Saturated air cools more slowly than unsaturated air, which can make moist air less stable. Warm air can contain more water vapor; relative humidity compares actual moisture with capacity at the current temperature. Inversions are stable layers that can trap moisture and pollutants."
    verified_at_utc: "2026-08-28T19:41:40Z"
    link_status: 200
    supports_claims: [adiabatic-parcel-chain, saturated-parcel-slower-cooling, warm-air-moisture-capacity, relative-humidity-definition, inversion-stable-layer]

  - id: phak-dewpoint-saturation-lifting
    authority: faa_guidance
    title: "Pilot's Handbook of Aeronautical Knowledge, Chapter 12: Weather Theory"
    document_id: "FAA-H-8083-25C"
    locator: "Ch. 12, Temperature/Dew Point Relationship and Methods by Which Air Reaches Saturation, p. 12-14"
    url: "https://www.faa.gov/sites/faa.gov/files/14_phak_ch12.pdf#page=14"
    revision: "2023 edition"
    relevance_excerpt: "Dew point is the temperature at which air becomes saturated; further cooling causes condensation. Saturation can result from movement over a cold surface, mixing, nighttime ground cooling, or lifting."
    verified_at_utc: "2026-08-28T19:41:40Z"
    link_status: 200
    supports_claims: [saturation-four-paths, temperature-dewpoint-cloud-base-model]

  - id: nws-dew-point-definition
    authority: federal_science_guidance
    title: "National Weather Service Glossary"
    document_id: "NWS Glossary"
    locator: "Term Dew Point"
    url: "https://forecast.weather.gov/glossary.php?word=dew%20point"
    revision: "Current NWS web edition verified August 31, 2026"
    relevance_excerpt: "Dew point is the temperature to which air must be cooled to reach saturation, assuming air pressure and moisture content are constant."
    verified_at_utc: "2026-08-31T20:16:00Z"
    link_status: 200
    supports_claims: [dewpoint-saturation-definition]

  - id: phak-cloud-formation-low-clouds
    authority: faa_guidance
    title: "Pilot's Handbook of Aeronautical Knowledge, Chapter 12: Weather Theory"
    document_id: "FAA-H-8083-25C"
    locator: "Ch. 12, Clouds and low-cloud classification, p. 12-15"
    url: "https://www.faa.gov/sites/faa.gov/files/14_phak_ch12.pdf#page=15"
    revision: "2023 edition"
    relevance_excerpt: "Cloud formation requires adequate water vapor, condensation nuclei, and cooling to saturation. The cloud-classification list defines cumulus as heaped or piled, stratus as formed in layers, cirrus as ringlets or fibrous high cloud, and nimbus as rain-bearing; low clouds can create low ceilings and visibility restrictions."
    verified_at_utc: "2026-08-28T19:41:40Z"
    link_status: 200
    supports_claims: [cloud-formation-requirements, low-cloud-operational-meaning, visible-cloud-formation, cloud-base-classification]

  - id: noaa-cloud-light-scattering
    authority: federal_science_guidance
    title: "What Are Rainbow Clouds?"
    document_id: "NOAA NESDIS optical phenomena education"
    locator: "The Short Answer, cloud-droplet and ice-crystal light scattering"
    url: "https://www.nesdis.noaa.gov/about/k-12-education/optical-phenomena/what-are-rainbow-clouds"
    revision: "Published August 31, 2025; verified August 31, 2026"
    relevance_excerpt: "Small water droplets and ice crystals scatter sunlight; this light interaction makes cloud particles visible and can produce cloud optical effects."
    verified_at_utc: "2026-08-31T14:29:00Z"
    link_status: 200
    supports_claims: [cloud-particle-light-scattering]

  - id: phak-cloud-families-vertical
    authority: faa_guidance
    title: "Pilot's Handbook of Aeronautical Knowledge, Chapter 12: Weather Theory"
    document_id: "FAA-H-8083-25C"
    locator: "Ch. 12, Basic Cloud Types and Clouds with Vertical Development, p. 12-16"
    url: "https://www.faa.gov/sites/faa.gov/files/14_phak_ch12.pdf#page=16"
    revision: "2023 edition"
    relevance_excerpt: "The basic cloud families are low, middle, high, and vertically developing. Towering cumulus indicates instability, and cumulonimbus contains moisture and unstable air and can produce hazardous weather."
    verified_at_utc: "2026-08-28T19:41:40Z"
    link_status: 200
    supports_claims: [cloud-vertical-development-family, vertical-cloud-instability]

  - id: phak-cloud-name-classifications
    authority: faa_guidance
    title: "Pilot's Handbook of Aeronautical Knowledge, Chapter 12: Weather Theory"
