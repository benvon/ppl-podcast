learning_objectives:
  - Use current airport information, observed traffic, wind information, and
    visual indicators to build a nontowered-airport traffic picture.
  - Identify the standard traffic-pattern legs, altitude, direction, entry,
    spacing, and departure path.
  - Use CTAF self-announcements to share position and intentions without
    treating the frequency as a clearance or sequencing service.
  - Apply visual scanning and right-of-way rules to converging, head-on,
    overtaking, landing, and special-category conflicts.
  - Distinguish regulatory requirements from FAA-recommended operating practices.
  - Recognize when an early spacing change, extended leg, go-around, or
    departure delay is the safer resolution to a developing conflict.
trouble_spots:
  - Treating a quiet CTAF as evidence that the pattern is empty.
  - Treating a radio call, UNICOM runway recommendation, or straight-in approach
    as a clearance or grant of priority.
  - Descending into a traffic pattern instead of reaching traffic-pattern
    altitude before entry.
  - Confusing the departure leg with the upwind leg or using pattern-leg names
    without a shared mental picture.
  - Memorizing right-of-way slogans without identifying geometry, aircraft
    category, and who must give way.
  - Allowing displays or radio work to replace outside scanning.
  - Presenting AIM and advisory-circular recommendations as though every
    recommended technique were a regulation.
