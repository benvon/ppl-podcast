episode_id: "core-11"
claims:
  - {id: acs-weather-theory-scope, type: faa_standard, statement: "ACS Weather Information requires meteorology applicable to VFR flight, including atmospheric composition and stability, temperature and heat exchange, moisture and precipitation, weather-system formation, clouds, turbulence, thunderstorms, icing, fog, frost, and visibility obstructions.", sources: [acs-weather-stability, acs-weather-moisture-clouds-risk], risk: operational, script_sections: ["What the ACS is asking you to connect"], status: draft}
  - {id: acs-weather-decision-use, type: faa_standard, statement: "The applicant analyzes the implications of weather conditions and correlates weather information to make a go/no-go decision while identifying risks associated with go/no-go, continue/divert, and weather-information limitations.", sources: [acs-weather-moisture-clouds-risk], risk: safety_critical, script_sections: ["What the ACS is asking you to connect", "The map for this lesson", "From theory to Episode 12", "Two mornings, two outcomes"], status: draft}
  - {id: weather-theory-supports-interpretation, type: faa_guidance, statement: "Understanding weather theory supports sound decisions based on aviation weather reports and forecasts.", sources: [phak-weather-theory-purpose], risk: operational, script_sections: ["What the ACS is asking you to connect", "The map for this lesson", "Rising air, stability, and convection", "From theory to Episode 12"], status: draft}
  - {id: lesson-causal-overview, type: teaching_explanation, statement: "Pressure references, heating and density, vertical motion, stability, saturation, and cloud formation form one causal model that helps a learner interpret later weather reports, forecasts, charts, and hazards.", sources: [phak-weather-theory-purpose, acs-weather-moisture-clouds-risk], risk: operational, script_sections: ["The map for this lesson", "Retrieval review"], status: draft}
  - {id: atmosphere-mixture-water-vapor, type: faa_guidance, statement: "The atmosphere is a moving mixture of gases that includes a variable amount of water vapor, and that small variable component is responsible for major weather changes.", sources: [phak-atmosphere-troposphere], risk: foundational, script_sections: ["The atmosphere is the working material"], status: draft}
  - {id: troposphere-weather-layer, type: faa_guidance, statement: "Most weather, clouds, storms, and temperature variations occur in the troposphere; the standard-atmosphere tropopause is about 36,000 feet, while the troposphere's actual depth varies with latitude and season.", sources: [phak-atmosphere-troposphere, awh-air-parcel-troposphere], risk: foundational, script_sections: ["The atmosphere is the working material"], status: draft}
  - {id: air-parcel-conceptual-model, type: faa_guidance, statement: "An air parcel is an imaginary volume used to assign approximately uniform atmospheric properties and reason about what selected air is doing.", sources: [awh-air-parcel-troposphere], risk: foundational, script_sections: ["The atmosphere is the working material"], status: draft}
  - {id: parcel-scale-follows-question, type: teaching_explanation, statement: "Because the FAA model gives a parcel no precise numerical definition, its useful conceptual scope can follow the phenomenon being discussed as long as the assigned properties remain approximately uniform; the boundary is analytical rather than physical.", sources: [awh-air-parcel-troposphere], risk: foundational, script_sections: ["The atmosphere is the working material"], status: draft}
  - {id: unequal-heating-drives-motion, type: faa_guidance, statement: "Uneven heating of Earth's surface changes density and pressure and sets air in motion.", sources: [phak-heating-density-pressure], risk: foundational, script_sections: ["Heating changes density and starts motion", "Rising air, stability, and convection"], status: draft}
  - {id: temperature-density-relationship, type: faa_guidance, statement: "Warming spreads air molecules and makes air less dense, while cooling packs molecules more closely and makes air denser.", sources: [phak-heating-density-pressure], risk: foundational, script_sections: ["Heating changes density and starts motion", "Rising air, stability, and convection"], status: draft}
  - {id: pressure-air-weight, type: faa_guidance, statement: "Atmospheric pressure is the force per unit area exerted by the weight of the air above a surface.", sources: [phak-heating-density-pressure], risk: foundational, script_sections: ["Pressure and its reference systems"], status: draft}
  - {id: standard-pressure-reference, type: faa_guidance, statement: "The standard sea-level pressure reference is 29.92 inches of mercury or 1,013.2 hectopascals; hectopascals and millibars are equivalent units.", sources: [phak-pressure-reference-altitude, awh-pressure-units-station], risk: foundational, script_sections: ["Pressure and its reference systems"], status: draft}
  - {id: standard-atmosphere-fixed-reference, type: faa_guidance, statement: "The standard atmosphere is a fixed hypothetical distribution of pressure, temperature, and density used as a common reference for altimeter calibration and aircraft-performance relationships.", sources: [awh-standard-atmosphere-reference], risk: foundational, script_sections: ["Pressure and its reference systems"], status: draft}
  - {id: station-pressure-local-reference, type: faa_guidance, statement: "Station pressure is pressure measured at field elevation and is normally lower at higher-elevation airports because less atmosphere is above the station.", sources: [awh-pressure-units-station], risk: foundational, script_sections: ["Pressure and its reference systems"], status: draft}
  - {id: sea-level-pressure-comparison, type: faa_guidance, statement: "Weather stations normalize station pressure to a mean-sea-level reference so readings from different elevations can be compared without confusing terrain elevation with the pressure pattern.", sources: [phak-pressure-reference-altitude, awh-sea-level-pressure-reference], risk: operational, script_sections: ["Pressure and its reference systems", "From theory to Episode 12"], status: draft}
  - {id: msl-agl-airport-elevation, type: faa_guidance, statement: "Airport elevation and MSL altitude use mean sea level as a shared vertical reference, while AGL height is measured from the local ground; the references answer different questions and are not interchangeable.", sources: [faa-pcg-altitude-reference, faa-pcg-airport-elevation], risk: operational, script_sections: ["How pressure references appear in flight information"], status: draft}
  - {id: altimeter-setting-purpose, type: faa_guidance, statement: "The local altimeter setting is chosen so an altimeter indicates the airport's published elevation at the field and supports useful MSL-based altitude indication.", sources: [awh-altimeter-setting-reference], risk: operational, script_sections: ["How pressure references appear in flight information"], status: draft}
  - {id: aviation-pressure-information-uses, type: faa_guidance, statement: "METAR, ASOS/AWOS broadcasts, ATIS, and ATC may provide the altimeter setting through their respective observation and issuance functions; the pilot uses a current reported setting for altitude indication.", sources: [awh-metar-altimeter-cloud-bases, aim-awos-asos-observations, atc-atis-altimeter-content, atc-altimeter-setting-issuance, awh-altimeter-setting-reference], risk: operational, script_sections: ["How pressure references appear in flight information"], status: draft}
  - {id: metar-pressure-height-references, type: faa_guidance, statement: "A METAR reports cloud-layer heights in AGL and contains an altimeter-setting group; designated stations may also include normalized sea-level pressure in remarks.", sources: [awh-metar-altimeter-cloud-bases, awh-metar-sea-level-pressure], risk: operational, script_sections: ["How pressure references appear in flight information"], status: draft}
  - {id: pressure-density-altitude-reference, type: faa_guidance, statement: "Pressure altitude maps measured pressure to the standard-atmosphere 29.92 inHg reference; density altitude corrects pressure altitude for nonstandard temperature and serves as an aircraft-performance index rather than a geometric height.", sources: [awh-pressure-density-altitude], risk: operational, script_sections: ["How pressure references appear in flight information"], status: draft}
  - {id: pressure-decreases-altitude, type: faa_guidance, statement: "Atmospheric pressure decreases with altitude, and lower pressure corresponds to less-dense air.", sources: [phak-pressure-reference-altitude], risk: foundational, script_sections: ["Pressure and its reference systems", "Rising air, stability, and convection"], status: draft}
  - {id: pressure-patterns-motion-weather, type: faa_guidance, statement: "Pressure and temperature differences contribute to atmospheric motion; descending dry air is generally associated with high pressure, while rising air and increasing cloudiness or precipitation commonly accompany low pressure.", sources: [phak-high-low-vertical-motion], risk: operational, script_sections: ["Rising air, stability, and convection", "From theory to Episode 12"], status: draft}
  - {id: stability-definition, type: faa_guidance, statement: "Atmospheric stability is resistance to vertical motion: stable air damps small vertical disturbances, while unstable air allows them to grow.", sources: [phak-stability-adiabatic], risk: operational, script_sections: ["Rising air, stability, and convection"], status: draft}
  - {id: convection-vertical-transport, type: faa_guidance, statement: "Meteorological convection is vertical transport of heat and moisture in the atmosphere and may begin when surface heating creates rising, less-dense air.", sources: [awh-convection-definition, phak-heating-density-pressure], risk: operational, script_sections: ["Rising air, stability, and convection"], status: draft}
  - {id: parcel-environment-stability-comparison, type: faa_guidance, statement: "Stability reasoning compares a hypothetically lifted parcel with surrounding environmental air at the same level: colder and denser favors sinking, while warmer and less dense favors continued ascent.", sources: [awh-parcel-stability-comparison], risk: operational, script_sections: ["Rising air, stability, and convection"], status: draft}
  - {id: rising-cools-descending-warms, type: faa_guidance, statement: "Rising air expands and cools as pressure decreases, while descending air compresses and warms as pressure increases.", sources: [phak-stability-adiabatic], risk: foundational, script_sections: ["Rising air, stability, and convection"], status: draft}
  - {id: adiabatic-parcel-chain, type: faa_guidance, statement: "For a rising unsaturated parcel, decreasing pressure permits expansion and the parcel's temperature falls; descent reverses that pressure-volume-temperature chain.", sources: [phak-lapse-moisture-inversion], risk: foundational, script_sections: ["Rising air, stability, and convection"], status: draft}
  - {id: saturated-parcel-slower-cooling, type: faa_guidance, statement: "Saturated or moist rising air cools more slowly than unsaturated or dry air, which can leave it warmer and less dense than surrounding air and support deeper vertical development in unstable conditions.", sources: [phak-lapse-moisture-inversion], risk: foundational, script_sections: ["Rising air, stability, and convection"], status: draft}
  - {id: warm-air-moisture-capacity, type: faa_guidance, statement: "Warmer air can contain more water vapor than cooler air before saturation.", sources: [phak-lapse-moisture-inversion], risk: foundational, script_sections: ["Moisture becomes visible at saturation"], status: draft}
  - {id: relative-humidity-definition, type: faa_guidance, statement: "Relative humidity compares the water vapor present with the amount the air could contain at the current temperature.", sources: [phak-lapse-moisture-inversion], risk: foundational, script_sections: ["Moisture becomes visible at saturation"], status: draft}
  - {id: inversion-stable-layer, type: faa_guidance, statement: "A temperature inversion is a layer in which temperature rises with altitude; it is commonly smooth and stable and can trap moisture and pollutants below it.", sources: [phak-lapse-moisture-inversion], risk: operational, script_sections: ["Rising air, stability, and convection", "Two mornings, two outcomes"], status: draft}
  - {id: dewpoint-saturation-definition, type: faa_guidance, statement: "Dew point is the temperature to which air must be cooled to become saturated when its water-vapor amount does not change; further cooling permits condensation.", sources: [phak-dewpoint-saturation-lifting], risk: foundational, script_sections: ["Moisture becomes visible at saturation"], status: draft}
  - {id: saturation-four-paths, type: faa_guidance, statement: "Air can reach saturation by moving over a cold surface, mixing warm and cold air, cooling through contact with the ground at night, or being lifted and cooled.", sources: [phak-dewpoint-saturation-lifting], risk: operational, script_sections: ["Four paths to saturation"], status: draft}
  - {id: temperature-dewpoint-cloud-base-model, type: faa_guidance, statement: "When unsaturated air is lifted, temperature and dew point converge; a wider surface spread generally requires more lifting before saturation, and the PHAK uses that relationship to estimate an approximate cloud-base height.", sources: [phak-dewpoint-saturation-lifting], risk: operational, script_sections: ["Four paths to saturation"], status: draft}
  - {id: cloud-formation-requirements, type: faa_guidance, statement: "Cloud formation requires adequate water vapor, condensation nuclei, and a process that cools air to saturation.", sources: [phak-cloud-formation-low-clouds], risk: foundational, script_sections: ["Moisture becomes visible at saturation", "Clouds make the chain visible"], status: draft}
  - {id: visible-cloud-causal-chain, type: teaching_explanation, statement: "Cooling toward dew point brings invisible water vapor to saturation; condensation or deposition on nuclei forms droplets or ice crystals that scatter light and make a cloud visible.", sources: [phak-cloud-formation-low-clouds, noaa-cloud-light-scattering], risk: foundational, script_sections: ["Moisture becomes visible at saturation", "Clouds make the chain visible", "Retrieval review"], status: draft}
  - {id: low-cloud-operational-meaning, type: faa_guidance, statement: "Low clouds can create low ceilings, restrict visibility, change rapidly, and make VFR flight impossible.", sources: [phak-cloud-formation-low-clouds], risk: safety_critical, script_sections: ["Clouds make the chain visible", "From theory to Episode 12"], status: draft}
  - {id: cloud-family-classification, type: faa_guidance, statement: "The PHAK groups clouds by base height and vertical development into low, middle, high, and vertically developing families.", sources: [phak-cloud-families-vertical], risk: foundational, script_sections: ["What cloud structure can tell you"], status: draft}
  - {id: vertical-cloud-instability, type: faa_guidance, statement: "Towering cumulus indicates instability, and cumulonimbus contains unstable air and substantial moisture and can produce hazardous weather.", sources: [phak-cloud-families-vertical], risk: safety_critical, script_sections: ["What cloud structure can tell you"], status: draft}
  - {id: ceiling-visibility-meaning, type: faa_guidance, statement: "For aviation, ceiling is the lowest broken or overcast layer or vertical visibility into an obscuration, while visibility is the greatest horizontal distance at which prominent objects can be seen.", sources: [phak-ceiling-visibility-precipitation], risk: operational, script_sections: ["From theory to Episode 12"], status: draft}
  - {id: precipitation-observable-consequence, type: faa_guidance, statement: "Precipitation forms when cloud water or ice particles grow large enough to fall and can reduce visibility or contribute to icing and runway hazards.", sources: [phak-ceiling-visibility-precipitation], risk: safety_critical, script_sections: ["What cloud structure can tell you", "From theory to Episode 12"], status: draft}
  - {id: variables-not-verdicts, type: teaching_explanation, statement: "A weather observation or forecast supplies evidence about pressure, temperature, moisture, clouds, visibility, and change; the pilot must connect those variables to the route, timing, capabilities, and decision rather than treating one value as a complete verdict.", sources: [acs-weather-moisture-clouds-risk, phak-weather-theory-purpose], risk: safety_critical, script_sections: ["Rising air, stability, and convection", "From theory to Episode 12", "Two mornings, two outcomes"], status: draft}
