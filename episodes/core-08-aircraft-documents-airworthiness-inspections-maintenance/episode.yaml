learning_objectives:
  - "Explain conformity to the approved design and condition for safe operation as the two parts of an airworthiness determination."
  - "Locate and interpret the registration, airworthiness certificate, approved operating material, supplements, weight-and-balance data, placards, and relevant maintenance records."
  - "Distinguish owner/operator maintenance responsibility from the PIC's responsibility to determine condition for safe flight."
  - "Determine which common inspection requirements apply to the airplane and operation, including the for-hire context of the 100-hour rule."
  - "Apply the § 91.213(d) no-MEL sequence and make a separate operational-risk decision."
  - "Identify the task, eligibility, performance, return-to-service, and record-entry gates for pilot preventive maintenance."
trouble_spots:
  - "Treating an airworthiness certificate or current annual inspection as proof of present condition for safe flight."
  - "Using a generic POH or online manual without confirming aircraft applicability, revisions, supplements, and installed configuration."
  - "Assuming every training airplane requires a 100-hour inspection without analyzing the operation described by § 91.409(b)."
  - "Checking only § 91.205 for an inoperative item, or treating a placard as a substitute for proper removal or deactivation."
  - "Assuming any simple-looking maintenance task is preventive maintenance or omitting the return-to-service entry."
