  - id: phak-addition-removal-fuel
    authority: faa_guidance
    title: "Pilot's Handbook of Aeronautical Knowledge, Chapter 10: Weight and Balance"
    document_id: "FAA-H-8083-25C"
    locator: "Ch. 10, Weight Addition or Removal and Chapter Summary, p. 10-11"
    url: "https://www.faa.gov/sites/faa.gov/files/12_phak_ch10.pdf#page=11"
    revision: "2023 edition"
    relevance_excerpt: "Adding or removing weight requires a new CG check; fuel burn reduces weight at the fuel-tank arm, and the CG effect depends on tank location."
