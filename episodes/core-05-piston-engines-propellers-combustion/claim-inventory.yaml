episode_id: "core-05"
claims:
  - {id: acs-powerplant-propeller-anchor, type: faa_standard, statement: "The Private Pilot Airplane ACS identifies powerplant and propeller knowledge as part of safe operation of the airplane's systems.", sources: [acs-powerplant-propeller-systems], risk: instructional, script_sections: [what-the-acs-is-asking-you-to-connect], status: draft}
  - {id: acs-abnormal-indications-anchor, type: faa_standard, statement: "The ACS connects system knowledge to recognizing abnormal indications and detecting malfunctions or failures.", sources: [acs-powerplant-propeller-systems], risk: safety_critical, script_sections: [what-the-acs-is-asking-you-to-connect, read-relationships-not-isolated-numbers], status: draft}
  - {id: acs-before-takeoff-check-anchor, type: faa_standard, statement: "The ACS requires understanding why before-takeoff checklist items are checked, how they detect malfunctions, and whether engine parameters are suitable.", sources: [acs-before-takeoff-malfunction-check], risk: safety_critical, script_sections: [two-sparks-two-independent-sources], status: draft}
  - {id: reciprocating-energy-conversion, type: faa_guidance, statement: "A reciprocating engine converts fuel's chemical energy into mechanical energy through combustion, using piston motion to produce crankshaft rotation.", sources: [phak-reciprocating-engine-principle], risk: instructional, script_sections: [pressure-becomes-rotation], status: draft}
  - {id: spark-compression-ignition-distinction, type: faa_guidance, statement: "A spark-ignition engine uses spark plugs to ignite a premixed charge, while a compression-ignition engine heats compressed air enough for injected fuel to ignite.", sources: [phak-reciprocating-engine-principle], risk: instructional, script_sections: [pressure-becomes-rotation], status: draft}
  - {id: opposed-engine-context, type: faa_guidance, statement: "Horizontally opposed, usually air-cooled engines are the most common reciprocating-engine arrangement in smaller airplanes.", sources: [phak-reciprocating-engine-principle], risk: instructional, script_sections: [pressure-becomes-rotation], status: draft}
  - {id: four-stroke-components, type: faa_guidance, statement: "A common spark-ignition reciprocating engine uses cylinders, pistons, intake and exhaust valves, spark plugs, connecting rods, and a crankshaft to carry out its operating cycle.", sources: [phak-four-stroke-components], risk: instructional, script_sections: [pressure-becomes-rotation, four-strokes-one-power-event], status: draft}
  - {id: intake-compression-power-strokes, type: faa_guidance, statement: "In the four-stroke cycle, the intake stroke admits the charge, compression prepares it for higher power output, and ignition begins the power stroke that drives the piston down.", sources: [phak-four-stroke-components], risk: instructional, script_sections: [four-strokes-one-power-event], status: draft}
  - {id: exhaust-stroke, type: faa_guidance, statement: "The exhaust stroke uses an open exhaust valve and an upward-moving piston to purge burned gases from the cylinder.", sources: [phak-four-stroke-cycle], risk: instructional, script_sections: [four-strokes-one-power-event], status: draft}
  - {id: staggered-cylinder-power, type: faa_guidance, statement: "In the PHAK's four-cylinder example, cylinders operate on different strokes and their power events are timed to maintain crankshaft rotation.", sources: [phak-four-stroke-cycle], risk: instructional, script_sections: [four-strokes-one-power-event], status: draft}
  - {id: propeller-rotating-airfoil, type: faa_guidance, statement: "A propeller is a rotating airfoil that turns engine power into thrust and is subject to the aerodynamic principles that apply to other airfoils.", sources: [phak-four-stroke-cycle], risk: instructional, script_sections: [the-propeller-is-a-rotating-wing], status: draft}
  - {id: propeller-thrust-variables, type: faa_guidance, statement: "Propeller thrust depends on blade airfoil shape, blade angle of attack, and rotational speed.", sources: [phak-four-stroke-cycle], risk: instructional, script_sections: [the-propeller-is-a-rotating-wing], status: draft}
  - {id: propeller-blade-twist, type: faa_guidance, statement: "Pitch distribution is blade twist from the shank to the tip because blade sections travel at different speeds; the tip travels faster than the inner blade.", sources: [amtp-propeller-pitch-distribution], risk: instructional, script_sections: [why-a-propeller-blade-is-twisted], status: draft}
  - {id: fixed-pitch-compromise, type: faa_guidance, statement: "A fixed-pitch propeller has a manufacturer-set blade angle and is most efficient only for a limited airspeed-and-rpm combination, creating a climb-versus-cruise compromise.", sources: [phak-propeller-twist-fixed-pitch], risk: instructional, script_sections: [fixed-pitch-means-a-designed-compromise], status: draft}
  - {id: climb-cruise-propeller-tradeoff, type: faa_guidance, statement: "A lower-pitch climb propeller permits higher rpm and favors takeoff and climb, while a higher-pitch cruise propeller favors cruise efficiency at the expense of takeoff and climb performance.", sources: [phak-propeller-twist-fixed-pitch], risk: instructional, script_sections: [fixed-pitch-means-a-designed-compromise], status: draft}
  - {id: fixed-pitch-rpm-indication, type: faa_guidance, statement: "In a fixed-pitch installation, the tachometer serves as the engine-power indicator and can include operating-range and limitation markings.", sources: [phak-propeller-twist-fixed-pitch], risk: safety_critical, script_sections: [fixed-pitch-means-a-designed-compromise, read-relationships-not-isolated-numbers], status: draft}
  - {id: density-changes-power-at-rpm, type: faa_guidance, statement: "The same rpm at higher altitude can represent less power because reduced air density reduces engine power output.", sources: [phak-propeller-twist-fixed-pitch], risk: safety_critical, script_sections: [fixed-pitch-means-a-designed-compromise, read-relationships-not-isolated-numbers], status: draft}
  - {id: constant-speed-governor, type: faa_guidance, statement: "Within its governing range, a constant-speed propeller governor responds to rpm changes by varying blade angle to maintain the rpm selected with the propeller control as airspeed or propeller load changes.", sources: [phak-constant-speed-propeller], risk: instructional, script_sections: [constant-speed-separates-power-from-rpm], status: draft}
  - {id: constant-speed-controls, type: faa_guidance, statement: "In a typical constant-speed installation, the throttle changes power output and the propeller control selects the governor's engine-and-propeller rpm target.", sources: [phak-constant-speed-propeller], risk: safety_critical, script_sections: [constant-speed-separates-power-from-rpm], status: draft}
  - {id: constant-speed-range, type: faa_guidance, statement: "A constant-speed propeller can hold selected rpm only while blade angle remains within its governing range and away from the pitch stops.", sources: [phak-constant-speed-propeller], risk: instructional, script_sections: [constant-speed-separates-power-from-rpm], status: draft}
  - {id: manifold-pressure-meaning, type: faa_guidance, statement: "At a constant rpm and altitude, manifold pressure is directly related to the charge delivered to the combustion chambers and therefore to power output.", sources: [phak-constant-speed-propeller], risk: safety_critical, script_sections: [constant-speed-separates-power-from-rpm, read-relationships-not-isolated-numbers], status: draft}
  - {id: intake-pressure-difference, type: teaching_explanation, statement: "During intake, the descending piston creates a low-pressure area in the cylinder, and higher-pressure air flows through the induction path to fill it.", sources: [amtp-intake-pressure-and-throttle], risk: instructional, script_sections: [four-strokes-one-power-event], status: draft}
  - {id: throttle-intake-restriction, type: faa_guidance, statement: "The throttle regulates airflow to the cylinders: it restricts airflow more as it closes and admits more air as it opens.", sources: [amtp-intake-pressure-and-throttle], risk: instructional, script_sections: [four-strokes-one-power-event], status: draft}
  - {id: mixture-ratio-boundary, type: faa_guidance, statement: "The mixture control adjusts fuel flow to lean or enrich the fuel-air mixture as air density changes.", sources: [phak-mixture-control-boundary], risk: instructional, script_sections: [four-strokes-one-power-event], status: draft}
  - {id: manufacturer-power-relationship, type: faa_guidance, statement: "For a constant-speed installation, the manufacturer’s recommended relationship and adjustment sequence for manifold pressure and rpm protects the engine from excessive cylinder stress.", sources: [phak-constant-speed-power-relationship], risk: safety_critical, script_sections: [constant-speed-separates-power-from-rpm, read-relationships-not-isolated-numbers], status: draft}
  - {id: magneto-independent-power, type: faa_guidance, statement: "A magneto generates ignition energy independently of the aircraft electrical system and operates whenever the crankshaft is turning.", sources: [phak-dual-ignition], risk: safety_critical, script_sections: [two-sparks-two-independent-sources, the-propeller-is-always-live], status: draft}
  - {id: dual-ignition-reliability, type: faa_guidance, statement: "Two independent magnetos and two spark plugs per cylinder improve ignition-system reliability and combustion; failure of one side normally permits continued operation with some power loss.", sources: [phak-dual-ignition], risk: safety_critical, script_sections: [two-sparks-two-independent-sources], status: draft}
  - {id: ignition-check-meaning, type: faa_guidance, statement: "A small rpm decrease when selecting each magneto can be normal, but an engine that stops or has an excessive rpm drop requires correction before flight; the permissible decrease is specified in the AFM or POH.", sources: [phak-dual-ignition], risk: safety_critical, script_sections: [two-sparks-two-independent-sources], status: draft}
  - {id: propeller-always-live-hazard, type: faa_guidance, statement: "Moving a propeller can turn the engine and produce ignition even with the master off, and a broken magneto ground can preserve that hazard with the ignition switch selected OFF.", sources: [phak-magneto-propeller-hazard], risk: safety_critical, script_sections: [the-propeller-is-always-live], status: draft}
  - {id: normal-combustion-pressure, type: faa_guidance, statement: "Normal spark-ignition combustion begins at the spark plugs and burns across the charge to create a smooth pressure rise timed for the power stroke.", sources: [phak-combustion-abnormalities], risk: instructional, script_sections: [combustion-is-a-timed-pressure-event], status: draft}
  - {id: detonation-definition-effects, type: faa_guidance, statement: "Detonation is uncontrolled explosive ignition in the combustion chamber that produces excessive pressure and temperature and can cause roughness, power loss, overheating, or engine damage.", sources: [phak-combustion-abnormalities], risk: safety_critical, script_sections: [detonation-is-explosive-combustion], status: draft}
  - {id: detonation-operating-factors, type: faa_guidance, statement: "The PHAK associates detonation risk with incorrect fuel grade, excessive manifold pressure for the rpm, high-power excessively lean operation, and reduced cooling during extended ground operation or steep climb.", sources: [phak-combustion-abnormalities], risk: safety_critical, script_sections: [detonation-is-explosive-combustion], status: draft}
  - {id: preignition-definition-effects, type: faa_guidance, statement: "Preignition occurs before the normal ignition event when a hot spot ignites the charge and can cause power loss, high temperature, and damaging pressure while the piston is still compressing the charge.", sources: [phak-combustion-abnormalities], risk: safety_critical, script_sections: [preignition-starts-before-the-spark], status: draft}
  - {id: abnormal-combustion-overlap, type: faa_guidance, statement: "Detonation and preignition may occur together, one can cause the other, and their common cockpit effects can make them difficult to distinguish in operation.", sources: [phak-detonation-preignition-relationship], risk: safety_critical, script_sections: [preignition-starts-before-the-spark, read-relationships-not-isolated-numbers], status: draft}
  - {id: published-ranges-reduce-risk, type: faa_guidance, statement: "Using the recommended fuel and operating within published temperature, pressure, and rpm ranges reduces the chance of detonation or preignition.", sources: [phak-detonation-preignition-relationship], risk: safety_critical, script_sections: [preignition-starts-before-the-spark, read-relationships-not-isolated-numbers], status: draft}
