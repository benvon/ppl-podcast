episode_id: "{{EPISODE_ID}}"
# Declare every HTTPS link in show-notes.md. Link text and URL must match the
# Markdown exactly. Claim-backed links map to supported claims. Supplemental
# study links use kind: supplemental and omit locator, source_id, and claim_ids.
links:
  - id: replace-with-stable-link-id
    text: "Specific source section"
    url: "https://www.faa.gov/path/to/document.pdf#page=1"
    locator: "Specific section/task/paragraph and printed p. 1"
    source_id: replace-with-stable-source-id
    claim_ids: [replace-with-stable-claim-id]
