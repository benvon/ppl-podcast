    link_status: 200
    supports_claims: [longitudinal-stability-tail-force]
  - id: phak-longitudinal-stability-power
    authority: faa_guidance
    title: "Pilot’s Handbook of Aeronautical Knowledge, Chapter 5: Aerodynamics of Flight"
    document_id: "FAA-H-8083-25C"
    locator: "Chapter 5, Longitudinal Stability and Power Changes, printed p. 5-17"
    url: "https://www.faa.gov/sites/faa.gov/files/regulations_policies/handbooks_manuals/aviation/phak/07_phak_ch5.pdf#page=17"
    programmatic_url: "https://www.faa.gov/sites/faa.gov/files/07_phak_ch5_0.pdf"
    programmatic_attestation: {url: "https://www.faa.gov/regulationspolicies/handbooksmanuals/aviation/phak/chapter-5-aerodynamics-flight", link_text: "07_phak_ch5_0.pdf", sha256: "672c1a05653b628c20eef81cc42afaafbde98bf54c7e09f9c7ad1349292c1a37"}
    revision: "FAA-H-8083-25C, 2023; FAA handbook index lists an October 2025 addendum"
    relevance_excerpt: "The PHAK describes diminishing pitch oscillations in a dynamically stable aircraft and explains that the thrust line’s relationship to the center of gravity can make power changes create pitching moments."
