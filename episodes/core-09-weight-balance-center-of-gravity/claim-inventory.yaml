episode_id: "core-09"
claims:
  - {id: acs-performance-connections, type: faa_standard, statement: "ACS Task PA.I.F connects chart and data use with loading, CG, weight and balance, and aerodynamics when determining airplane performance and limitations.", sources: [acs-performance-knowledge-risk], risk: operational, script_sections: ["What the ACS is asking you to connect"], status: draft}
  - {id: acs-performance-risk, type: faa_standard, statement: "ACS Task PA.I.F includes risk management for performance data, airplane limitations, and differences between calculated and actual performance.", sources: [acs-performance-knowledge-risk], risk: operational, script_sections: ["What the ACS is asking you to connect", "Weight is also a performance input"], status: draft}
  - {id: acs-compute-correct-all-phases, type: faa_standard, statement: "The ACS skill requires computing weight and balance, correcting out-of-CG loading errors, and determining that limits are maintained during all phases of flight.", sources: [acs-performance-skills], risk: safety_critical, script_sections: ["What the ACS is asking you to connect", "Check the whole flight, not one snapshot"], status: draft}
  - {id: cargo-securement-separate, type: faa_standard, statement: "ACS Flight Deck Management separately requires knowledge of securing items and cargo and the skill to secure all items in the aircraft.", sources: [acs-cargo-securement], risk: safety_critical, script_sections: ["Loading is also a restraint problem"], status: draft}
  - {id: weight-and-cg-separate-limits, type: faa_guidance, statement: "Operating above maximum weight compromises structural integrity and performance, while operating outside CG limits creates control difficulty, so both limits must be checked.", sources: [phak-weight-balance-introduction], risk: safety_critical, script_sections: ["Two questions, not one"], status: draft}
  - {id: excess-weight-lift-demand, type: faa_guidance, statement: "Additional aircraft weight increases the lift demand, while available lift remains limited by design, angle of attack, airspeed, and density.", sources: [phak-weight-balance-introduction], risk: operational, script_sections: ["Weight is also a performance input"], status: draft}
  - {id: weight-performance-effects, type: faa_guidance, statement: "Excess weight can increase takeoff, stall, approach, and landing speeds; lengthen takeoff and landing; and reduce climb, range, speed, and maneuverability.", sources: [phak-weight-effects-and-cg], risk: safety_critical, script_sections: ["Weight is also a performance input"], status: draft}
  - {id: combined-performance-risk, type: faa_guidance, statement: "Excess weight consumes performance margin and becomes more hazardous when combined with other performance-reducing factors.", sources: [phak-weight-effects-and-cg], risk: safety_critical, script_sections: ["Weight is also a performance input"], status: draft}
  - {id: cg-is-weight-distribution, type: faa_guidance, statement: "CG is the aircraft's balance point and its location depends on how weight is distributed rather than on total weight alone.", sources: [phak-weight-effects-and-cg], risk: operational, script_sections: ["Two questions, not one"], status: draft}
  - {id: fuel-load-tradeoff, type: faa_guidance, statement: "Reducing fuel can reduce loaded weight but also reduces available range, so the fuel decision must remain integrated with flight planning.", sources: [phak-weight-effects-and-cg], risk: safety_critical, script_sections: ["Correct the loading, then run the plan again"], status: draft}
  - {id: equipment-changes-data, type: faa_guidance, statement: "Installing extra radios or instruments, and completing repairs or modifications, may affect aircraft weight.", sources: [phak-weight-effects-and-cg], risk: operational, script_sections: ["Start with the airplane that actually exists"], status: draft}
  - {id: forward-cg-effects, type: faa_guidance, statement: "A forward-CG condition can create higher control forces and difficulty raising the nose; beyond the forward limit, an extreme case can make it difficult or impossible to flare for landing.", sources: [phak-adverse-balance-effects], risk: safety_critical, script_sections: ["What forward and aft CG change"], status: draft}
  - {id: aft-cg-effects, type: faa_guidance, statement: "A CG beyond the aft limit reduces longitudinal stability, can create very light control forces, and can reduce stall and spin recovery capability.", sources: [phak-adverse-balance-effects], risk: safety_critical, script_sections: ["What forward and aft CG change"], status: draft}
  - {id: cg-limits-aircraft-specific, type: faa_guidance, statement: "Forward and aft CG limits are established for the particular aircraft and are published in its approved information; limits may vary with weight or operation.", sources: [phak-adverse-balance-effects], risk: safety_critical, script_sections: ["What forward and aft CG change", "Start with the airplane that actually exists"], status: draft}
  - {id: loading-controls-cg, type: faa_guidance, statement: "Seat assignments, baggage placement, and fuel-tank location can affect CG, so pilots can often correct balance by changing the loading arrangement.", sources: [phak-adverse-balance-effects], risk: operational, script_sections: ["What forward and aft CG change", "Correct the loading, then run the plan again"], status: draft}
  - {id: aircraft-data-foundation, type: faa_guidance, statement: "Current and accurate weight-and-balance information and records, updated for aircraft changes as appropriate, form the foundation for loading calculations and decisions; the AFM supplies loading charts or graphs and manufacturer loading procedures.", sources: [phak-weight-balance-management], risk: safety_critical, script_sections: ["Start with the airplane that actually exists"], status: draft}
  - {id: loading-fuel-variable-factors, type: faa_guidance, statement: "Loading and fuel management are the principal pilot-controlled variables that can change total weight and CG.", sources: [phak-weight-balance-management], risk: operational, script_sections: ["Check the whole flight, not one snapshot"], status: draft}
  - {id: seats-bags-fuel-tradeoff, type: faa_guidance, statement: "Many airplanes cannot remain within approved weight and balance limits with every seat occupied, the baggage compartments full, and the fuel tanks full.", sources: [phak-weight-balance-management], risk: operational, script_sections: ["Correct the loading, then run the plan again"], status: draft}
  - {id: datum-arm-moment, type: faa_guidance, statement: "The datum is the manufacturer's reference, arm is distance from that reference, and moment is weight multiplied by arm.", sources: [phak-terms-and-principles], risk: foundational, script_sections: ["What the ACS is asking you to connect", "Build the lever mental model"], status: draft}
  - {id: useful-load-definition, type: faa_guidance, statement: "For general aviation aircraft, useful load is maximum allowable gross weight minus basic empty weight and includes occupants, baggage, usable fuel, and applicable drainable oil.", sources: [phak-terms-and-principles], risk: foundational, script_sections: ["Start with the airplane that actually exists"], status: draft}
  - {id: total-weight-and-distribution, type: faa_guidance, statement: "A valid loading solution must determine total loaded weight and distribute that weight so the resulting CG remains within specified limits.", sources: [phak-terms-and-principles], risk: safety_critical, script_sections: ["Two questions, not one", "Turn the loading into a calculation"], status: draft}
  - {id: moment-distance-leverage, type: faa_guidance, statement: "The same weight produces a larger moment when it is farther from the datum, and different weight-distance combinations can produce equal moments.", sources: [phak-moment-mental-model], risk: foundational, script_sections: ["Build the lever mental model"], status: draft}
  - {id: sample-data-not-aircraft-data, type: faa_guidance, statement: "Generic handbook and sample AFM loading problems illustrate a method but do not replace current weight-and-balance data for the individual aircraft.", sources: [phak-moment-mental-model], risk: safety_critical, script_sections: ["Start with the airplane that actually exists", "Turn the loading into a calculation"], status: draft}
  - {id: computational-sequence, type: faa_guidance, statement: "The computational method lists each loaded weight, determines its moment, totals weight and moment, divides total moment by total weight for CG, and compares the results with limits.", sources: [phak-computational-method], risk: operational, script_sections: ["Turn the loading into a calculation"], status: draft}
  - {id: moment-index-scale, type: faa_guidance, statement: "To simplify calculations, moment values may be divided by 100, 1,000, or 10,000 and expressed as a scaled moment.", sources: [phak-computational-method], risk: foundational, script_sections: ["Turn the loading into a calculation"], status: draft}
  - {id: weight-and-cg-independent-checks, type: faa_guidance, statement: "An aircraft can be within the weight limit but outside CG limits, or within CG limits but overweight.", sources: [phak-computational-method], risk: safety_critical, script_sections: ["Two questions, not one", "Turn the loading into a calculation"], status: draft}
  - {id: manufacturer-methods, type: faa_guidance, statement: "PHAK identifies computational methods and manufacturer-provided graphs and tables; the graph method follows the computational steps except that graphs supply the moments.", sources: [phak-computational-method], risk: foundational, script_sections: ["The method may look different in your POH"], status: draft}
  - {id: graph-method-same-logic, type: faa_guidance, statement: "A loading graph can supply item moments, and a CG envelope then shows whether the combined loaded condition is within limits.", sources: [phak-loading-graph-envelope], risk: operational, script_sections: ["What the ACS is asking you to connect", "The method may look different in your POH"], status: draft}
  - {id: envelope-point-two-coordinates, type: teaching_explanation, statement: "A point in a CG envelope represents both loaded weight and loaded moment or CG, so being horizontally or vertically within the drawing alone is insufficient.", sources: [phak-loading-graph-envelope], risk: operational, script_sections: ["The method may look different in your POH"], status: draft}
  - {id: phase-checks, type: faa_guidance, statement: "A flight may require distinct ramp, takeoff, and landing weight-and-balance checks because fuel changes the loaded condition.", sources: [phak-flight-phase-and-shifting], risk: safety_critical, script_sections: ["Check the whole flight, not one snapshot"], status: draft}
  - {id: shifting-changes-moment-not-weight, type: faa_guidance, statement: "Moving an item to a different station leaves total weight unchanged but changes total moment and CG.", sources: [phak-flight-phase-and-shifting], risk: operational, script_sections: ["Correct the loading, then run the plan again"], status: draft}
  - {id: addition-removal-recompute, type: faa_guidance, statement: "Adding or removing weight requires a new CG calculation and limit check; in the PHAK example, baggage added aft of the old CG moves the new CG aft.", sources: [phak-addition-removal-fuel], risk: safety_critical, script_sections: ["Turn the loading into a calculation", "Check the whole flight, not one snapshot", "Correct the loading, then run the plan again"], status: draft}
  - {id: fuel-burn-path, type: faa_guidance, statement: "Fuel consumption reduces weight at the fuel tanks; because tanks in most small aircraft are near CG, the CG generally changes little as fuel is consumed.", sources: [phak-addition-removal-fuel], risk: safety_critical, script_sections: ["Check the whole flight, not one snapshot"], status: draft}
  - {id: operating-limitations-control, type: regulation, statement: "Section 91.9 requires operation in compliance with the applicable approved flight-manual, marking, and placard limitations and requires applicable current approved manual material to be available in the aircraft.", sources: [cfr-91-9-operating-limitations], risk: safety_critical, script_sections: ["Start with the airplane that actually exists"], status: draft}
