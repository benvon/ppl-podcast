  - id: phak-primary-secondary-controls
    authority: faa_guidance
    title: "Pilot’s Handbook of Aeronautical Knowledge, Chapter 6: Flight Controls"
    document_id: "FAA-H-8083-25C"
    locator: "Chapter 6, Flight Control Systems, printed p. 6-2"
    url: "https://www.faa.gov/sites/faa.gov/files/regulations_policies/handbooks_manuals/aviation/phak/08_phak_ch6.pdf#page=2"
    programmatic_url: "https://www.faa.gov/sites/faa.gov/files/08_phak_ch6.pdf"
    programmatic_attestation: {url: "https://www.faa.gov/regulationspolicies/handbooksmanuals/aviation/phak/chapter-6-flight-controls", link_text: "08_phak_ch6.pdf", sha256: "0a96b7ea01fe975dceef40f0bab184030a886eb3373db810ce8f8da3506c0d5b"}
    revision: "FAA-H-8083-25C, 2023; FAA handbook index lists an October 2025 addendum"
    relevance_excerpt: "The PHAK identifies ailerons, elevator or stabilator, and rudder as primary controls. Flaps, leading-edge devices, spoilers, and trim systems are secondary controls that improve performance or relieve excessive control forces."
    verified_at_utc: "2026-08-15T23:54:13Z"
    link_status: 200
    supports_claims: [primary-secondary-controls]
  - id: phak-axes-ailerons-adverse-yaw
    authority: faa_guidance
    title: "Pilot’s Handbook of Aeronautical Knowledge, Chapter 6: Flight Controls"
    document_id: "FAA-H-8083-25C"
    locator: "Chapter 6, Primary Flight Controls, Ailerons and Adverse Yaw, printed p. 6-3"
    url: "https://www.faa.gov/sites/faa.gov/files/regulations_policies/handbooks_manuals/aviation/phak/08_phak_ch6.pdf#page=3"
    programmatic_url: "https://www.faa.gov/sites/faa.gov/files/08_phak_ch6.pdf"
    programmatic_attestation: {url: "https://www.faa.gov/regulationspolicies/handbooksmanuals/aviation/phak/chapter-6-flight-controls", link_text: "08_phak_ch6.pdf", sha256: "0a96b7ea01fe975dceef40f0bab184030a886eb3373db810ce8f8da3506c0d5b"}
    revision: "FAA-H-8083-25C, 2023; FAA handbook index lists an October 2025 addendum"
    relevance_excerpt: "The PHAK maps aileron to roll about the longitudinal axis and explains that differential aileron drag yaws the airplane opposite the direction of bank; it also notes adverse yaw is more pronounced at low airspeeds."
    verified_at_utc: "2026-08-15T23:54:13Z"
    link_status: 200
    supports_claims: [aileron-axis-role, adverse-yaw]
  - id: phak-coordinated-turn-controls
    authority: faa_guidance
    title: "Pilot’s Handbook of Aeronautical Knowledge, Chapter 6: Flight Controls"
    document_id: "FAA-H-8083-25C"
    locator: "Chapter 6, Adverse Yaw and Aileron Design, printed p. 6-4"
    url: "https://www.faa.gov/sites/faa.gov/files/regulations_policies/handbooks_manuals/aviation/phak/08_phak_ch6.pdf#page=4"
    programmatic_url: "https://www.faa.gov/sites/faa.gov/files/08_phak_ch6.pdf"
    programmatic_attestation: {url: "https://www.faa.gov/regulationspolicies/handbooksmanuals/aviation/phak/chapter-6-flight-controls", link_text: "08_phak_ch6.pdf", sha256: "0a96b7ea01fe975dceef40f0bab184030a886eb3373db810ce8f8da3506c0d5b"}
    revision: "FAA-H-8083-25C, 2023; FAA handbook index lists an October 2025 addendum"
    relevance_excerpt: "The PHAK says ailerons, rudder, and elevator are used to coordinate turns: aileron establishes bank, rudder counters adverse yaw, and increased lift for the turn requires increased angle of attack through elevator back pressure. Differential and Frise-type ailerons reduce adverse yaw but do not eliminate it."
    verified_at_utc: "2026-08-15T23:54:13Z"
    link_status: 200
    supports_claims: [coordinated-control-roles, coordination-harmonizes-effects, rudder-demand-conditions, design-mitigation-not-elimination]
  - id: phak-elevator
    authority: faa_guidance
    title: "Pilot’s Handbook of Aeronautical Knowledge, Chapter 6: Flight Controls"
    document_id: "FAA-H-8083-25C"
    locator: "Chapter 6, Elevator, printed p. 6-5"
    url: "https://www.faa.gov/sites/faa.gov/files/regulations_policies/handbooks_manuals/aviation/phak/08_phak_ch6.pdf#page=5"
    programmatic_url: "https://www.faa.gov/sites/faa.gov/files/08_phak_ch6.pdf"
    programmatic_attestation: {url: "https://www.faa.gov/regulationspolicies/handbooksmanuals/aviation/phak/chapter-6-flight-controls", link_text: "08_phak_ch6.pdf", sha256: "0a96b7ea01fe975dceef40f0bab184030a886eb3373db810ce8f8da3506c0d5b"}
    revision: "FAA-H-8083-25C, 2023; FAA handbook index lists an October 2025 addendum"
    relevance_excerpt: "The PHAK explains elevator control of pitch about the lateral axis and the aerodynamic force at the horizontal tail that produces the pitching moment."
    verified_at_utc: "2026-08-15T23:54:13Z"
    link_status: 200
    supports_claims: [elevator-role]
  - id: phak-rudder-effectiveness
    authority: faa_guidance
    title: "Pilot’s Handbook of Aeronautical Knowledge, Chapter 6: Flight Controls"
    document_id: "FAA-H-8083-25C"
    locator: "Chapter 6, Rudder, printed p. 6-8"
    url: "https://www.faa.gov/sites/faa.gov/files/regulations_policies/handbooks_manuals/aviation/phak/08_phak_ch6.pdf#page=8"
    programmatic_url: "https://www.faa.gov/sites/faa.gov/files/08_phak_ch6.pdf"
    programmatic_attestation: {url: "https://www.faa.gov/regulationspolicies/handbooksmanuals/aviation/phak/chapter-6-flight-controls", link_text: "08_phak_ch6.pdf", sha256: "0a96b7ea01fe975dceef40f0bab184030a886eb3373db810ce8f8da3506c0d5b"}
    revision: "FAA-H-8083-25C, 2023; FAA handbook index lists an October 2025 addendum"
    relevance_excerpt: "The PHAK explains rudder control of yaw about the vertical axis. Rudder effectiveness increases with speed, while propeller slipstream can increase its effectiveness in propeller-driven airplanes."
    verified_at_utc: "2026-08-15T23:54:13Z"
    link_status: 200
    supports_claims: [rudder-role, rudder-effectiveness]
  - id: phak-trim
    authority: faa_guidance
    title: "Pilot’s Handbook of Aeronautical Knowledge, Chapter 6: Flight Controls"
    document_id: "FAA-H-8083-25C"
    locator: "Chapter 6, Trim Systems and Trim Tabs, printed pp. 6-10–6-11"
    url: "https://www.faa.gov/sites/faa.gov/files/regulations_policies/handbooks_manuals/aviation/phak/08_phak_ch6.pdf#page=10"
    programmatic_url: "https://www.faa.gov/sites/faa.gov/files/08_phak_ch6.pdf"
    programmatic_attestation: {url: "https://www.faa.gov/regulationspolicies/handbooksmanuals/aviation/phak/chapter-6-flight-controls", link_text: "08_phak_ch6.pdf", sha256: "0a96b7ea01fe975dceef40f0bab184030a886eb3373db810ce8f8da3506c0d5b"}
    revision: "FAA-H-8083-25C, 2023; FAA handbook index lists an October 2025 addendum"
    relevance_excerpt: "The PHAK says trim systems relieve constant flight-control pressure and that retrimming is necessary as power, pitch attitude, or configuration changes."
    verified_at_utc: "2026-08-15T23:54:13Z"
    link_status: 200
    supports_claims: [trim-purpose, trim-desired-airspeed-context]
  - id: phak-flaps-leading-edge-devices
    authority: faa_guidance
    title: "Pilot’s Handbook of Aeronautical Knowledge, Chapter 6: Flight Controls"
    document_id: "FAA-H-8083-25C"
    locator: "Chapter 6, Flaps and Leading Edge Devices, printed p. 6-9"
    url: "https://www.faa.gov/sites/faa.gov/files/regulations_policies/handbooks_manuals/aviation/phak/08_phak_ch6.pdf#page=9"
    programmatic_url: "https://www.faa.gov/sites/faa.gov/files/08_phak_ch6.pdf"
    programmatic_attestation: {url: "https://www.faa.gov/regulationspolicies/handbooksmanuals/aviation/phak/chapter-6-flight-controls", link_text: "08_phak_ch6.pdf", sha256: "0a96b7ea01fe975dceef40f0bab184030a886eb3373db810ce8f8da3506c0d5b"}
    revision: "FAA-H-8083-25C, 2023; FAA handbook index lists an October 2025 addendum"
    relevance_excerpt: "The PHAK explains that flaps change wing camber and, in some designs, wing area; extension can change lift, drag, and pitch moment. It describes leading-edge devices as mechanisms that delay airflow separation or increase maximum lift capability."
    verified_at_utc: "2026-08-16T14:58:00Z"
    link_status: 200
    supports_claims: [flaps-change-aerodynamic-condition, leading-edge-devices-delay-separation]
  - id: phak-spoilers
    authority: faa_guidance
    title: "Pilot’s Handbook of Aeronautical Knowledge, Chapter 6: Flight Controls"
    document_id: "FAA-H-8083-25C"
    locator: "Chapter 6, Spoilers, printed p. 6-10"
    url: "https://www.faa.gov/sites/faa.gov/files/regulations_policies/handbooks_manuals/aviation/phak/08_phak_ch6.pdf#page=10"
    programmatic_url: "https://www.faa.gov/sites/faa.gov/files/08_phak_ch6.pdf"
    programmatic_attestation: {url: "https://www.faa.gov/regulationspolicies/handbooksmanuals/aviation/phak/chapter-6-flight-controls", link_text: "08_phak_ch6.pdf", sha256: "0a96b7ea01fe975dceef40f0bab184030a886eb3373db810ce8f8da3506c0d5b"}
    revision: "FAA-H-8083-25C, 2023; FAA handbook index lists an October 2025 addendum"
    relevance_excerpt: "The PHAK says spoilers spoil smooth airflow, reducing lift and increasing drag. Depending on the airplane, they can control descent, aid roll control, and improve braking effectiveness by transferring weight to the wheels after landing."
    verified_at_utc: "2026-08-16T14:58:00Z"
    link_status: 200
    supports_claims: [spoilers-change-lift-drag]
  - id: phak-static-stability
    authority: faa_guidance
    title: "Pilot’s Handbook of Aeronautical Knowledge, Chapter 5: Aerodynamics of Flight"
    document_id: "FAA-H-8083-25C"
    locator: "Chapter 5, Stability and Static Stability, printed p. 5-14"
    url: "https://www.faa.gov/sites/faa.gov/files/regulations_policies/handbooks_manuals/aviation/phak/07_phak_ch5.pdf#page=14"
    programmatic_url: "https://www.faa.gov/sites/faa.gov/files/07_phak_ch5_0.pdf"
    programmatic_attestation: {url: "https://www.faa.gov/regulationspolicies/handbooksmanuals/aviation/phak/chapter-5-aerodynamics-flight", link_text: "07_phak_ch5_0.pdf", sha256: "672c1a05653b628c20eef81cc42afaafbde98bf54c7e09f9c7ad1349292c1a37"}
    revision: "FAA-H-8083-25C, 2023; FAA handbook index lists an October 2025 addendum"
    relevance_excerpt: "The PHAK defines stability as an inherent design quality and explains static stability as the initial tendency after a disturbance."
    verified_at_utc: "2026-08-15T23:54:13Z"
    link_status: 200
    supports_claims: [stability-definition, static-stability]
  - id: phak-dynamic-stability-longitudinal-cg
    authority: faa_guidance
    title: "Pilot’s Handbook of Aeronautical Knowledge, Chapter 5: Aerodynamics of Flight"
    document_id: "FAA-H-8083-25C"
    locator: "Chapter 5, Dynamic Stability and Longitudinal Stability, printed p. 5-15"
    url: "https://www.faa.gov/sites/faa.gov/files/regulations_policies/handbooks_manuals/aviation/phak/07_phak_ch5.pdf#page=15"
    programmatic_url: "https://www.faa.gov/sites/faa.gov/files/07_phak_ch5_0.pdf"
    programmatic_attestation: {url: "https://www.faa.gov/regulationspolicies/handbooksmanuals/aviation/phak/chapter-5-aerodynamics-flight", link_text: "07_phak_ch5_0.pdf", sha256: "672c1a05653b628c20eef81cc42afaafbde98bf54c7e09f9c7ad1349292c1a37"}
    revision: "FAA-H-8083-25C, 2023; FAA handbook index lists an October 2025 addendum"
    relevance_excerpt: "The PHAK describes dynamic stability as the aircraft response over time, including damped, undamped, and divergent oscillations. It identifies wing location relative to the center of gravity, horizontal-tail location relative to the center of gravity, and tail size as factors affecting longitudinal stability."
    verified_at_utc: "2026-08-15T23:54:13Z"
    link_status: 200
    supports_claims: [dynamic-stability-oscillation, longitudinal-stability-cg]
  - id: phak-longitudinal-stability-tail-force
