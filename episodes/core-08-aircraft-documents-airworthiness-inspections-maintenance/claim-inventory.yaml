episode_id: "core-08"
claims:
  - {id: acs-airworthiness-scope, type: faa_standard, statement: "The private-pilot ACS airworthiness task covers certificate location and expiration, inspections and logbooks, ADs and SAIBs, special flight permits, owner/operator and PIC responsibilities, preventive maintenance, and inoperative equipment.", sources: [acs-airworthiness-requirements], risk: high, script_sections: [what-the-acs-is-asking-you-to-connect], status: supported}
  - {id: acs-scenario-skills, type: faa_standard, statement: "The ACS airworthiness task includes standard and special airworthiness certificates and asks an applicant to locate and describe airworthiness and registration information, determine whether the airplane is airworthy in a scenario, and apply procedures for operating with inoperative equipment in that scenario.", sources: [acs-airworthiness-skills], risk: high, script_sections: [what-the-acs-is-asking-you-to-connect, the-borrowed-airplane-decision, review], status: supported}
  - {id: mosaic-scope-boundary, type: faa_guidance, statement: "The October 20, 2025 PHAK addendum revised Chapter 9 language about special airworthiness certificates for light-sport category aircraft and preventive-maintenance privileges for sport pilots.", sources: [phak-mosaic-addendum], risk: medium, script_sections: [what-the-acs-is-asking-you-to-connect], status: supported}
  - {id: owner-manual-not-afm, type: faa_guidance, statement: "A generic aircraft owner or information manual is not FAA approved, may not be current, and is not specific to one aircraft.", sources: [phak-manual-types], risk: medium, script_sections: [documents-in-the-airplane], status: supported}
  - {id: afm-poh-aircraft-specific, type: faa_guidance, statement: "An AFM is FAA approved, and a POH may incorporate approved AFM material plus information organized for a specific airplane.", sources: [phak-manual-types], risk: high, script_sections: [documents-in-the-airplane], status: supported}
  - {id: poh-operating-sections, type: faa_guidance, statement: "POH sections organize emergency and normal procedures, performance information, weight-and-balance and equipment information, and system descriptions, while markings and placards also convey operating limitations.", sources: [phak-poh-contents], risk: high, script_sections: [documents-in-the-airplane], status: supported}
  - {id: supplements-part-of-picture, type: faa_guidance, statement: "The POH supplements section contains information needed to operate installed optional systems and equipment, and the applicable information is inserted into the flight manual when that equipment is installed.", sources: [phak-poh-supplements], risk: high, script_sections: [documents-in-the-airplane, the-borrowed-airplane-decision], status: supported}
  - {id: aircraft-certificates-aboard, type: regulation, statement: "For ordinary domestic civil operation, an appropriate current airworthiness certificate and effective U.S. registration certificate must be aboard the aircraft.", sources: [cfr-91-203-certificates], risk: safety_critical, script_sections: [documents-in-the-airplane, the-borrowed-airplane-decision], status: supported}
  - {id: airworthiness-certificate-display, type: regulation, statement: "The airworthiness certificate must be displayed at the cabin or cockpit entrance so it is legible to passengers or crew.", sources: [cfr-91-203-certificates], risk: high, script_sections: [documents-in-the-airplane], status: supported}
  - {id: registration-seven-years, type: regulation, statement: "An initial aircraft registration certificate generally expires seven years after the last day of its issue month, and renewal may be sought during the preceding six months.", sources: [cfr-47-40-registration-duration], risk: high, script_sections: [documents-in-the-airplane], status: supported}
  - {id: operating-limitations-control, type: regulation, statement: "A pilot may not operate contrary to the approved AFM, markings and placards, or other prescribed operating limitations.", sources: [cfr-91-9-flight-manual], risk: safety_critical, script_sections: [documents-in-the-airplane, an-inoperative-item], status: supported}
  - {id: current-manual-material-available, type: regulation, statement: "Required current approved manual material, markings, and placards must be available as § 91.9 specifies.", sources: [cfr-91-9-flight-manual], risk: high, script_sections: [documents-in-the-airplane], status: supported}
  - {id: airworthiness-two-part-model, type: faa_guidance, statement: "The PHAK airworthiness-certificate discussion identifies conformity to the type certificate and condition for safe operation as parts of the airworthiness finding at inspection and issuance.", sources: [phak-documents-airworthiness], risk: safety_critical, script_sections: [what-airworthy-means, review], status: supported}
  - {id: airworthiness-certificate-continuing-effect, type: regulation, statement: "Unless sooner surrendered, suspended, revoked, or otherwise given a termination date by the FAA, a standard airworthiness certificate remains effective while the aircraft is registered in the United States and its maintenance, preventive maintenance, and alterations are performed under parts 43 and 91.", sources: [cfr-21-181-airworthiness-duration], risk: safety_critical, script_sections: [what-airworthy-means], status: supported}
  - {id: pic-safe-flight-determination, type: regulation, statement: "The PIC is responsible for determining whether the aircraft is in condition for safe flight.", sources: [cfr-91-7-pic-airworthiness], risk: safety_critical, script_sections: [what-airworthy-means, the-borrowed-airplane-decision], status: supported}
  - {id: discontinue-unairworthy-flight, type: regulation, statement: "The PIC must discontinue a flight when an unairworthy mechanical, electrical, or structural condition occurs.", sources: [cfr-91-7-pic-airworthiness], risk: safety_critical, script_sections: [what-airworthy-means], status: supported}
  - {id: owner-primary-responsibility, type: regulation, statement: "The owner or operator is primarily responsible for maintaining the aircraft in an airworthy condition, including compliance with part 39.", sources: [cfr-91-403-owner-responsibility], risk: safety_critical, script_sections: [what-airworthy-means, what-the-maintenance-records-show], status: supported}
  - {id: maintenance-authority-limited, type: regulation, statement: "Maintenance, preventive maintenance, and alterations may be performed only by persons authorized by the applicable regulations.", sources: [cfr-91-403-owner-responsibility], risk: safety_critical, script_sections: [preventive-maintenance-by-a-pilot], status: supported}
  - {id: inspection-system-not-mnemonic, type: faa_guidance, statement: "Required inspection intervals depend on the type of operation, and an inspection program may use calendar time, time in service, system operations, or combinations of those measures.", sources: [phak-inspections-records], risk: high, script_sections: [inspection-due-dates], status: supported}
  - {id: preflight-condition-check, type: faa_guidance, statement: "A preflight inspection is a thorough, systematic means for the pilot to determine whether an aircraft is airworthy and in condition for safe operation.", sources: [phak-preflight-inspection], risk: safety_critical, script_sections: [inspection-due-dates], status: supported}
  - {id: annual-inspection-clock, type: regulation, statement: "Unless an exception in § 91.409 applies, an aircraft generally may not be operated unless, within the preceding 12 calendar months, it has either received an annual inspection and been approved for return to service or received an inspection for issuance of an airworthiness certificate under part 21.", sources: [cfr-91-409-inspections], risk: safety_critical, script_sections: [inspection-due-dates], status: supported}
  - {id: hundred-hour-trigger, type: regulation, statement: "The 100-hour inspection applies when an aircraft carries a person other than a crewmember for hire and when a person gives flight instruction for hire in an aircraft that person provides; a private owner flying their own aircraft for personal use does not trigger the rule merely by accumulating 100 hours.", sources: [cfr-91-409-inspections], risk: safety_critical, script_sections: [inspection-due-dates, the-borrowed-airplane-decision, review], status: supported}
  - {id: hundred-hour-ferry-overage, type: regulation, statement: "The 100-hour limit may be exceeded by no more than 10 hours only while en route to the place of inspection, and that excess counts toward the next 100 hours.", sources: [cfr-91-409-inspections], risk: safety_critical, script_sections: [inspection-due-dates], status: supported}
  - {id: elt-inspection-and-battery, type: regulation, statement: "An ELT subject to § 91.207 has a 12-calendar-month inspection requirement, while its battery has separate replacement or recharge triggers.", sources: [cfr-91-207-elt], risk: high, script_sections: [inspection-due-dates], status: supported}
  - {id: altimeter-ifr-inspection, type: regulation, statement: "IFR operation in controlled airspace generally requires the altimeter, static-pressure, and altitude-reporting systems to have been tested and inspected within the preceding 24 calendar months, with additional rules after specified work.", sources: [cfr-91-411-altimeter], risk: safety_critical, script_sections: [inspection-due-dates], status: supported}
  - {id: transponder-inspection, type: regulation, statement: "A transponder required by § 91.215(a) must generally have been tested and inspected within the preceding 24 calendar months, with additional testing after certain maintenance.", sources: [cfr-91-413-transponder], risk: safety_critical, script_sections: [inspection-due-dates], status: supported}
  - {id: records-work-history, type: regulation, statement: "Maintenance records must capture required details about maintenance, preventive maintenance, alteration, and required inspections.", sources: [cfr-91-417-records], risk: high, script_sections: [what-the-maintenance-records-show], status: supported}
  - {id: records-continuing-status, type: regulation, statement: "Specified continuing records include life-limited-part status, overhaul time, inspection status, and other current airworthiness information.", sources: [cfr-91-417-records], risk: high, script_sections: [what-the-maintenance-records-show, the-borrowed-airplane-decision], status: supported}
  - {id: ad-status-record, type: regulation, statement: "Maintenance records must include the current status of applicable ADs, including method of compliance and, for recurring ADs, the time and date when the next action is required.", sources: [cfr-91-417-records], risk: safety_critical, script_sections: [what-the-maintenance-records-show], status: supported}
  - {id: ad-regulatory-status, type: regulation, statement: "Airworthiness Directives are legally enforceable rules issued to address unsafe conditions in aviation products.", sources: [phak-ads-owner-responsibility], risk: safety_critical, script_sections: [what-the-maintenance-records-show], status: supported}
  - {id: owner-discrepancy-record-duty, type: regulation, statement: "Owners or operators must have required inspections performed, repair discrepancies between inspections except where allowed, and ensure maintenance entries are made; when listed discrepancies include inoperative instruments or equipment, they must ensure those items are properly placarded.", sources: [cfr-91-405-required-maintenance], risk: high, script_sections: [what-the-maintenance-records-show, an-inoperative-item], status: supported}
  - {id: mel-aircraft-loa-pathway, type: regulation, statement: "Among the requirements in § 91.213(a), an approved MEL must exist for the aircraft, the aircraft must carry the letter of authorization from the responsible Flight Standards office that authorizes operation under that MEL, and operation must follow every applicable condition and limitation in both documents.", sources: [cfr-91-213-inoperative], risk: safety_critical, script_sections: [an-inoperative-item], status: supported}
  - {id: mel-aircraft-specific-guidance, type: faa_guidance, statement: "PHAK explains that an approved MEL applies to an aircraft identified by serial and registration number and is used with the FAA letter of authorization.", sources: [phak-inoperative-preventive], risk: high, script_sections: [an-inoperative-item], status: supported}
  - {id: vfr-day-night-required-equipment, type: regulation, statement: "For powered civil aircraft with standard U.S. airworthiness certificates, § 91.205(b) lists required day-VFR instruments and equipment, including aircraft- and operation-dependent items such as a retractable-gear position indicator and flotation and signaling equipment for specified for-hire overwater operations. Paragraph (c) requires the day items plus specified lighting and electrical equipment for night VFR and an electric landing light when the aircraft is operated for hire.", sources: [cfr-91-205-vfr-equipment], risk: safety_critical, script_sections: [an-inoperative-item, the-borrowed-airplane-decision, review], status: supported}
  - {id: inoperative-no-mel-eligibility, type: regulation, statement: "The no-approved-MEL pathway in § 91.213(d) is limited to the aircraft classes listed in paragraph (d)(1), with eligibility depending in part on whether an MMEL has been developed.", sources: [cfr-91-213-inoperative], risk: safety_critical, script_sections: [an-inoperative-item], status: supported}
  - {id: inoperative-required-item-checks, type: regulation, statement: "For an eligible aircraft operated under § 91.213(d), paragraph (d)(2) screens an inoperative item against VFR-day instruments and equipment prescribed by the applicable type-certification rules, required indications on the aircraft equipment list or KOEL, § 91.205 and other applicable operating rules, and AD requirements.", sources: [cfr-91-213-inoperative], risk: safety_critical, script_sections: [an-inoperative-item, the-borrowed-airplane-decision, review], status: supported}
  - {id: inoperative-removal, type: regulation, statement: "Under § 91.213(d)(3)(i), a removed inoperative item requires the cockpit control to be placarded and the maintenance to be recorded in accordance with § 43.9.", sources: [cfr-91-213-inoperative], risk: safety_critical, script_sections: [an-inoperative-item, the-borrowed-airplane-decision, review], status: supported}
  - {id: inoperative-deactivation, type: regulation, statement: "Under § 91.213(d)(3)(ii), a deactivated item must be placarded INOPERATIVE; if deactivation involves maintenance, it must be accomplished and recorded in accordance with part 43.", sources: [cfr-91-213-inoperative], risk: safety_critical, script_sections: [an-inoperative-item, the-borrowed-airplane-decision, review], status: supported}
  - {id: inoperative-no-hazard, type: regulation, statement: "A pilot or appropriately rated maintenance person must determine that the inoperative item does not constitute a hazard to the aircraft before operation under § 91.213(d).", sources: [cfr-91-213-inoperative], risk: safety_critical, script_sections: [an-inoperative-item, the-borrowed-airplane-decision, review], status: supported}
  - {id: inoperative-decision-not-one-question, type: faa_guidance, statement: "For an eligible aircraft operated without an MEL, § 91.213(d) requires operative required equipment, the prescribed maintenance action, a no-hazard determination, and repair, removal, deactivation, or inspection followed by placarding.", sources: [ac-91-67a-non-mel], risk: safety_critical, script_sections: [an-inoperative-item], status: supported}
  - {id: inoperative-risk-context, type: faa_guidance, statement: "After an item is found not legally required, the pilot should consider environmental, operational, human, and equipment risk factors before flight.", sources: [ac-91-67a-risk], risk: safety_critical, script_sections: [an-inoperative-item], status: supported}
  - {id: deactivation-may-be-maintenance, type: faa_guidance, statement: "AC 91-67A states that deactivation of an inoperative system is not preventive maintenance, must be accomplished by an appropriately authorized person, and requires a § 43.9 maintenance-record entry.", sources: [ac-91-67a-deactivation], risk: safety_critical, script_sections: [an-inoperative-item], status: supported}
  - {id: preventive-list-controls, type: faa_guidance, statement: "FAA guidance explains that preventive maintenance is limited to specified operations and must not involve complex assembly operations.", sources: [phak-preventive-maintenance], risk: safety_critical, script_sections: [preventive-maintenance-by-a-pilot], status: supported}
  - {id: preventive-examples-bounded, type: faa_guidance, statement: "FAA guidance gives bounded preventive-maintenance examples such as spark-plug replacement and replacing or cleaning certain oil or fuel strainers and filters.", sources: [phak-preventive-maintenance], risk: high, script_sections: [preventive-maintenance-by-a-pilot], status: supported}
  - {id: pilot-preventive-eligibility, type: regulation, statement: "Subject to its exceptions, § 43.3(g) allows a pilot certificate holder to perform preventive maintenance on an aircraft the pilot owns or operates that is not used under parts 121, 129, or 135.", sources: [cfr-43-3-pilot-maintenance], risk: safety_critical, script_sections: [preventive-maintenance-by-a-pilot], status: supported}
  - {id: pilot-preventive-return-to-service, type: regulation, statement: "A person holding at least a private pilot certificate may approve an aircraft for return to service after preventive maintenance performed under § 43.3(g).", sources: [cfr-43-7-return-to-service], risk: safety_critical, script_sections: [preventive-maintenance-by-a-pilot], status: supported}
  - {id: preventive-maintenance-record-entry, type: regulation, statement: "Subject to the exceptions in § 43.9(b) and (c), the general maintenance-record rule requires a work description or acceptable reference, completion date, and performer name if different; when the work has been performed satisfactorily, it also requires the approving person's signature, certificate number, and certificate type.", sources: [cfr-43-9-maintenance-entry], risk: safety_critical, script_sections: [preventive-maintenance-by-a-pilot], status: supported}
  - {id: after-maintenance-return-entry, type: regulation, statement: "After maintenance or alteration, no person may operate the aircraft until it has been approved for return to service and the required entry has been made.", sources: [cfr-91-407-after-maintenance], risk: safety_critical, script_sections: [after-maintenance], status: supported}
  - {id: after-maintenance-operational-check, type: regulation, statement: "If maintenance or alteration may appreciably change flight characteristics or substantially affect in-flight operation, the aircraft may not carry anyone other than crewmembers until an appropriately rated pilot with at least a private pilot certificate conducts and logs an operational check, unless ground tests, inspection, or both conclusively show the work did not appreciably change those characteristics or substantially affect operation in flight.", sources: [cfr-91-407-after-maintenance], risk: safety_critical, script_sections: [after-maintenance], status: supported}
  - {id: special-flight-permit-purpose, type: regulation, statement: "A special flight permit may authorize specified flight of an aircraft that may not currently meet applicable airworthiness requirements but is capable of safe flight, including flight to a place where repair or maintenance will be performed.", sources: [cfr-21-197-special-flight-permit], risk: safety_critical, script_sections: [after-maintenance], status: supported}
