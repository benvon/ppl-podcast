learning_objectives:
  - "Connect aileron, elevator, and rudder inputs to roll, pitch, and yaw about the three axes."
  - "Explain adverse yaw, coordinated-control roles, and trim without turning the explanation into a generic procedure."
  - "Distinguish static from dynamic stability and explain why stability does not replace active control."
  - "Connect the four propeller effects to changing directional-control demand in the particular airplane."
trouble_spots:
  - "Treating rudder as a takeoff-only control rather than a control of yaw and coordination."
  - "Treating trim as a command input instead of relief of sustained control pressure."
  - "Treating stability as a guarantee that the airplane will hold an intended flightpath."
  - "Reciting left-turning tendencies without tying them to propeller rotation, airplane design, and flight condition."
