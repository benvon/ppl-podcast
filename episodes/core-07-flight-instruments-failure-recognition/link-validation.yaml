        claim_assessments:
          - claim_id: pitot-static-pressure-model
            verdict: supports
            rationale: The excerpt defines static pressure as ambient/barometric pressure,
              dynamic pressure as pressure due to motion, and states that total
              pressure entering the pitot tube consists of dynamic pressure plus
              static pressure.
          - claim_id: pitot-static-instrument-source-map
            verdict: supports
            rationale: The excerpt states that the ASI receives total pressure from the
              pitot tube and static pressure on the opposite side, while the
              altimeter and VSI use only static pressure from the static port.
          - claim_id: pitot-block-leaves-static-instruments
            verdict: partially_supports
            rationale: The source establishes that the altimeter and VSI use only static
              pressure and that the ASI uses pitot total pressure plus static
              pressure, which supports the system-source distinction. However,
              it does not explicitly state the consequences of a pitot-only
              blockage, that the ASI is affected, or that the other instruments
              remain available as independent evidence.
          - claim_id: shared-static-can-fail-together
            verdict: partially_supports
            rationale: The source states that the ASI receives static pressure and that the
              altimeter and VSI use static pressure from the static system,
              supporting the premise that all three depend on static pressure.
              It does not state that a single static blockage makes all three
              indications wrong or that their errors occur in a coordinated
              pattern.
