learning_objectives:
  - Use the FAA personal checklist to identify a pilot-fitness concern before
    departure.
  - Assess an illness and its proposed medication as separate possible sources
    of impairment.
  - Connect hypoxia, ear and sinus block, hyperventilation, carbon monoxide
    exposure, fatigue, and stress to their causes, cues, and safer choices.
  - Distinguish hypoxic, hypemic, stagnant, and histotoxic hypoxia by the part
    of the oxygen path that is impaired.
  - Reassess the pilot during flight and use a prepared landing option when
    symptoms or performance change.
  - Distinguish a felt motion or weak visual scene from reliable orientation
    references.
trouble_spots:
  - Treating symptom relief as proof that both the illness and its medicine are
    compatible with flying.
  - Diagnosing a vague in-flight symptom as one cause while ignoring other
    plausible exposures.
  - Assuming an arrival promise overrides a pilot-fitness stop point.
  - Using bodily sensation alone to judge airplane attitude when visual
    references are weak.
