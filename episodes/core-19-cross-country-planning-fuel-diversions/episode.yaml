learning_objectives:
  - Build a VFR cross-country plan from current route, weather, airport,
    aircraft-performance, fuel, and alternative information.
  - Complete a route-planning navigation log from verified chart, checkpoint,
    altitude, wind, departure-time, and aircraft inputs through course, heading,
    groundspeed, time, ETA, and planned fuel results.
  - Separate climb, cruise, arrival, and reserve fuel and distinguish the VFR
    regulatory departure minimum from a personal planning floor.
  - Compare checkpoint time, observed groundspeed, fuel used, fuel indications,
    and updated weather with the plan, then revise ETA and landing-fuel
    estimates.
  - Select and prepare a suitable alternative before departure and execute a
    prompt, low-workload diversion when destination weather crosses a personal
    decision trigger and the progress and fuel trends show the cost of delay.
  - Explain the pilot's responsibility to file or simulate, activate, update,
    and close a VFR flight plan as applicable.
trouble_spots:
  - Treating a direct route or EFB output as a complete plan without verifying
    its source inputs, airplane data, and airport suitability.
  - Copying navigation-log outputs without preserving the course, wind, heading,
    groundspeed, time, ETA, and fuel relationships that produced them.
  - Multiplying one cruise fuel-flow number by total trip time without separate
    climb, arrival, and reserve treatment.
  - Treating the regulatory VFR reserve as the desired landing quantity or as
    fuel set aside for a planned diversion.
  - Waiting for destination weather or fuel to become urgent before using an
    alternative that was available earlier.
  - Selecting the nearest airport instead of a suitable airport.
  - Allowing diversion calculations or display programming to displace aircraft
    control and the outside scan.
  - Assuming ATC or a tower automatically activates or closes a VFR flight plan.
