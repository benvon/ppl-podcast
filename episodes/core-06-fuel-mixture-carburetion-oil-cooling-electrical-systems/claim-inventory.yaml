episode_id: "core-06"
claims:
  - {id: acs-systems-anchor, type: faa_standard, statement: "The Private Pilot Airplane ACS includes powerplant, fuel and oil, and electrical systems as airplane-systems knowledge.", sources: [acs-airplane-systems], risk: instructional, script_sections: [what-this-episode-connects], status: draft}
  - {id: acs-system-malfunction-anchor, type: faa_standard, statement: "The ACS connects systems knowledge to recognizing and managing abnormalities and detecting malfunctions or failures.", sources: [acs-airplane-systems], risk: safety_critical, script_sections: [read-relationships-not-isolated-gauges, what-the-acs-is-really-asking], status: draft}
  - {id: acs-preflight-system-awareness, type: faa_standard, statement: "The ACS connects preflight inspection and engine-start knowledge with reasons for checking items, detecting possible defects, starting limitations, and propeller safety.", sources: [acs-preflight-and-engine-start], risk: safety_critical, script_sections: [fuel-system-is-more-than-a-tank, what-the-acs-is-really-asking], status: draft}
  - {id: intake-stroke-draws-charge, type: faa_guidance, statement: "During the intake stroke, the descending piston creates a low-pressure area and the fuel-air charge moves into the cylinder through the open intake valve.", sources: [phak-intake-stroke], risk: instructional, script_sections: [air-and-fuel-need-a-path], status: draft}
  - {id: induction-system-purpose, type: faa_guidance, statement: "The induction system brings outside air in, mixes it with fuel, and delivers the mixture to the cylinders for combustion.", sources: [phak-induction-carburetor], risk: instructional, script_sections: [air-and-fuel-need-a-path], status: draft}
  - {id: induction-alternate-air, type: faa_guidance, statement: "The induction system normally filters intake air and provides alternate air because an intake filter can become clogged.", sources: [phak-induction-carburetor], risk: safety_critical, script_sections: [air-and-fuel-need-a-path], status: draft}
  - {id: carburetor-mixes-before-manifold, type: faa_guidance, statement: "A carburetor mixes fuel and air before the mixture enters the intake manifold.", sources: [phak-induction-carburetor], risk: instructional, script_sections: [carburetors-and-fuel-injection], status: draft}
  - {id: venturi-pressure-and-fuel-metering, type: faa_guidance, statement: "In a float-type carburetor, air flowing through the venturi creates low pressure that draws fuel through a discharge nozzle into the airstream.", sources: [phak-induction-carburetor], risk: instructional, script_sections: [carburetors-and-fuel-injection], status: draft}
  - {id: throttle-airflow-boundary, type: faa_guidance, statement: "The throttle valve regulates the flow of fuel-air mixture to the combustion chambers.", sources: [phak-induction-carburetor], risk: instructional, script_sections: [carburetors-and-fuel-injection, mixture-is-ratio-not-power], status: draft}
  - {id: mixture-is-fuel-to-air-ratio, type: faa_guidance, statement: "Mixture control adjusts fuel flow to maintain the appropriate fuel-air ratio as air density changes.", sources: [phak-mixture-and-carburetor-ice], risk: instructional, script_sections: [mixture-is-ratio-not-power], status: draft}
  - {id: density-changes-mixture, type: faa_guidance, statement: "As altitude increases, a fixed mixture setting becomes progressively richer because air density decreases while fuel density remains the same; descent requires enrichment to avoid an overly lean mixture.", sources: [phak-mixture-and-carburetor-ice], risk: safety_critical, script_sections: [mixture-is-ratio-not-power], status: draft}
  - {id: aircraft-specific-mixture-procedures, type: faa_guidance, statement: "Mixture-adjustment procedures vary by aircraft and are specified in its AFM or POH.", sources: [phak-mixture-and-carburetor-ice], risk: safety_critical, script_sections: [mixture-is-ratio-not-power, read-relationships-not-isolated-gauges], status: draft}
  - {id: carburetor-ice-physics, type: faa_guidance, statement: "Carburetor ice can form because fuel vaporization and pressure reduction in the venturi lower the carburetor temperature.", sources: [phak-mixture-and-carburetor-ice], risk: safety_critical, script_sections: [carburetor-ice-is-a-temperature-problem], status: draft}
  - {id: carburetor-ice-restricts-power, type: faa_guidance, statement: "Carburetor ice can form on internal carburetor surfaces, restrict mixture flow, reduce power, and eventually stop the engine.", sources: [phak-mixture-and-carburetor-ice], risk: safety_critical, script_sections: [carburetor-ice-is-a-temperature-problem], status: draft}
  - {id: propeller-type-changes-ice-indication, type: faa_guidance, statement: "Carburetor ice in a fixed-pitch installation usually appears first as rpm loss; in a constant-speed installation it usually appears as manifold-pressure loss while rpm remains constant.", sources: [phak-mixture-and-carburetor-ice], risk: safety_critical, script_sections: [carburetor-ice-is-a-temperature-problem, read-relationships-not-isolated-gauges], status: draft}
  - {id: carburetor-heat-system-effect, type: faa_guidance, statement: "Carburetor heat supplies warmer, less-dense induction air; the associated power decrease and richer mixture are expected effects of the system.", sources: [phak-mixture-and-carburetor-ice], risk: safety_critical, script_sections: [carburetor-ice-is-a-temperature-problem], status: draft}
  - {id: carburetor-heat-indication, type: faa_guidance, statement: "With carburetor ice present, carburetor heat can initially reduce the fixed-pitch rpm or constant-speed manifold-pressure indication and then produce a gradual recovery as the ice melts.", sources: [phak-mixture-and-carburetor-ice], risk: safety_critical, script_sections: [carburetor-ice-is-a-temperature-problem], status: draft}
  - {id: fuel-injection-distinction, type: faa_guidance, statement: "Some piston engines use fuel injection instead of a carburetor; they meter fuel near or into each cylinder and may require different approved procedures.", sources: [phak-fuel-injection], risk: safety_critical, script_sections: [carburetors-and-fuel-injection], status: draft}
  - {id: fuel-system-purpose, type: faa_guidance, statement: "The fuel system is designed to provide uninterrupted clean fuel from tanks to engine under all approved power, altitude, attitude, and maneuver conditions.", sources: [phak-fuel-system-layout], risk: safety_critical, script_sections: [fuel-system-is-more-than-a-tank], status: draft}
  - {id: gravity-versus-pump-system, type: faa_guidance, statement: "Small airplanes commonly have gravity-feed or fuel-pump systems; design determines which system is needed.", sources: [phak-fuel-system-layout], risk: instructional, script_sections: [fuel-system-is-more-than-a-tank], status: draft}
  - {id: auxiliary-pump-system-role, type: faa_guidance, statement: "Fuel-pump systems commonly use an engine-driven main pump and an electrically driven auxiliary pump for starting and added reliability if the engine-driven pump fails.", sources: [phak-fuel-system-layout], risk: safety_critical, script_sections: [fuel-system-is-more-than-a-tank], status: draft}
  - {id: fuel-gauge-empty-reference, type: faa_guidance, statement: "The zero indication is calibrated to the point at which only unusable fuel remains; FAA guidance treats the installed quantity indicators as the primary in-flight fuel-remaining instruments and calls for a visual preflight comparison with the indications.", sources: [phak-fuel-gauges-and-contamination, ac-23-17c-fuel-quantity], risk: safety_critical, script_sections: [fuel-system-is-more-than-a-tank], status: draft}
  - {id: correct-fuel-grade, type: faa_guidance, statement: "The correct fuel grade for an airplane is identified in its AFM/POH and on applicable placards and filler-cap markings; fuel color is a supporting identification check.", sources: [phak-fuel-grade], risk: safety_critical, script_sections: [fuel-system-is-more-than-a-tank], status: draft}
  - {id: selector-is-aircraft-specific, type: faa_guidance, statement: "Fuel-selector positions and operating requirements depend on the airplane's fuel-system design and belong in its AFM or POH.", sources: [phak-fuel-gauges-and-contamination], risk: safety_critical, script_sections: [fuel-system-is-more-than-a-tank], status: draft}
  - {id: fuel-sumps-remove-contaminants, type: faa_guidance, statement: "Water and sediment settle in system low points, so fuel samples are drained and visually checked during preflight.", sources: [phak-fuel-gauges-and-contamination], risk: safety_critical, script_sections: [fuel-system-is-more-than-a-tank], status: draft}
  - {id: fuel-contamination-can-stop-engine, type: faa_guidance, statement: "Water contamination can freeze and block fuel lines or reach the carburetor and stop the engine.", sources: [phak-fuel-gauges-and-contamination], risk: safety_critical, script_sections: [fuel-system-is-more-than-a-tank], status: draft}
  - {id: oil-system-functions, type: faa_guidance, statement: "Engine oil lubricates moving parts, reduces friction and removes heat, seals between cylinders and pistons, and carries contaminants away.", sources: [phak-oil-system], risk: instructional, script_sections: [oil-is-a-working-fluid], status: draft}
  - {id: wet-and-dry-sump-layouts, type: faa_guidance, statement: "Wet-sump systems store oil in a sump that is part of the engine; dry-sump systems use a separate external oil tank.", sources: [phak-oil-system], risk: instructional, script_sections: [oil-is-a-working-fluid], status: draft}
  - {id: oil-pressure-versus-temperature, type: faa_guidance, statement: "Oil pressure is a direct indication of oil-system operation, while oil-temperature changes normally occur more slowly.", sources: [phak-oil-system], risk: safety_critical, script_sections: [oil-is-a-working-fluid, read-relationships-not-isolated-gauges], status: draft}
  - {id: oil-quantity-is-aircraft-specific, type: faa_guidance, statement: "The AFM or POH or nearby placards specify the correct oil type, weight, and quantity limits for an airplane.", sources: [phak-oil-system], risk: safety_critical, script_sections: [oil-is-a-working-fluid], status: draft}
  - {id: air-cooling-path, type: faa_guidance, statement: "In an air-cooled engine, baffles route outside air over cylinder fins and other engine parts, then hot air exits the cowling.", sources: [phak-engine-cooling], risk: instructional, script_sections: [cooling-is-an-airflow-job], status: draft}
  - {id: cooling-demand-relationship, type: faa_guidance, statement: "Air cooling is less effective during high-power, low-airspeed operation, when engine heat demand is high and cooling airflow is reduced.", sources: [phak-engine-cooling], risk: safety_critical, script_sections: [cooling-is-an-airflow-job], status: draft}
  - {id: cht-versus-oil-temperature, type: faa_guidance, statement: "CHT responds directly and immediately to cylinder temperature changes, while oil temperature is an indirect and delayed indication of engine temperature.", sources: [phak-engine-cooling], risk: safety_critical, script_sections: [cooling-is-an-airflow-job, read-relationships-not-isolated-gauges], status: draft}
  - {id: manufacturer-temperature-limits, type: faa_guidance, statement: "Published operating ranges and manufacturer recommendations govern how the intended airplane's engine temperatures are managed.", sources: [phak-engine-cooling], risk: safety_critical, script_sections: [cooling-is-an-airflow-job, read-relationships-not-isolated-gauges], status: draft}
  - {id: electrical-system-parts, type: faa_guidance, statement: "A basic aircraft electrical system includes an alternator or generator, battery, switches, bus bar, circuit protection, voltage regulator, monitoring, and wiring.", sources: [phak-electrical-system], risk: instructional, script_sections: [electricity-makes-and-stores], status: draft}
  - {id: alternator-and-battery-roles, type: faa_guidance, statement: "The engine-driven alternator or generator supplies electrical current and maintains battery charge; the battery starts the engine and supplies limited electrical power after a generating-system failure.", sources: [phak-electrical-system], risk: safety_critical, script_sections: [electricity-makes-and-stores, read-relationships-not-isolated-gauges], status: draft}
  - {id: master-does-not-power-magnetos, type: faa_guidance, statement: "The master switch supplies electrical equipment circuits but not the ignition system, which is powered by magnetos.", sources: [phak-electrical-system], risk: safety_critical, script_sections: [electricity-makes-and-stores], status: draft}
  - {id: circuit-protection-role, type: faa_guidance, statement: "Fuses and circuit breakers protect circuits and equipment from electrical overload; their location, limits, and handling are airplane-specific.", sources: [phak-electrical-system], risk: safety_critical, script_sections: [electricity-makes-and-stores], status: draft}
  - {id: ammeter-shows-battery-balance, type: faa_guidance, statement: "An ammeter shows whether the generating system is supplying power and whether the battery is charging; a negative indication means more current is being drawn from the battery than is being replaced.", sources: [phak-electrical-indications], risk: safety_critical, script_sections: [electricity-makes-and-stores, read-relationships-not-isolated-gauges], status: draft}
  - {id: loadmeter-measures-generator-load, type: faa_guidance, statement: "A loadmeter indicates the portion of generator or alternator capacity being used by electrical accessories and battery charging.", sources: [phak-electrical-indications], risk: instructional, script_sections: [electricity-makes-and-stores], status: draft}
  - {id: electrical-indications-need-aircraft-context, type: faa_guidance, statement: "Electrical indication type and the approved response to a warning or abnormal reading depend on the airplane and its AFM or POH.", sources: [phak-electrical-indications], risk: safety_critical, script_sections: [read-relationships-not-isolated-gauges], status: draft}
