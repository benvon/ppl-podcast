          rationale: The locator identifies Weather Information on printed page 4, and the
            supplied excerpt from cited PDF page 12 is printed page 4 and
            contains PA.I.C.K3e–K3l, R1–R2, and S1–S3.
        claim_assessments:
          - claim_id: acs-hazards-decision-standard
            verdict: supports
            rationale: The excerpt requires knowledge of hazardous conditions including
              turbulence, thunderstorms/microbursts, icing, fog, frost, and
              visibility obstructions; it also requires go/no-go and
              continue/divert risk decisions. S2 and S3 require analysis of
              implications and correlation to a decision, supporting the
              distinction from mere name recall.
          - claim_id: conservative-correlation-framework
            verdict: supports
            rationale: S2 requires analysis of implications of weather conditions and S3
              requires correlating weather information to a go/no-go decision.
              R1 includes personal weather minimums, while R2 expressly
              addresses the use and limitations of onboard equipment, weather
              reports/forecasts, and inflight weather resources.
