episode_id: "core-11"
claims:
  - {id: acs-weather-vfr-scope, type: faa_standard, statement: "ACS Weather Information requires meteorology applicable to departure, en route, alternate, and destination under VFR, including atmospheric composition and stability.", sources: [acs-weather-stability], risk: operational, script_sections: ["What the ACS is asking you to connect"], status: draft}
  - {id: acs-weather-topic-scope, type: faa_standard, statement: "ACS Weather Information includes temperature and heat exchange, moisture and precipitation, weather-system formation, clouds, turbulence, thunderstorms, icing, fog, frost, and visibility obstructions.", sources: [acs-weather-moisture-clouds-risk], risk: operational, script_sections: ["What the ACS is asking you to connect"], status: draft}
  - {id: acs-weather-decision-use, type: faa_standard, statement: "The applicant analyzes the implications of at least three weather conditions and correlates weather information to make a go/no-go decision while identifying, assessing, and mitigating risks associated with go/no-go, continue/divert, and weather-information limitations.", sources: [acs-weather-moisture-clouds-risk], risk: safety_critical, script_sections: ["What the ACS is asking you to connect", "The map for this lesson", "From theory to Episode 12", "Two mornings, two outcomes", "Retrieval review"], status: draft}
  - {id: weather-theory-supports-interpretation, type: faa_guidance, statement: "Understanding weather theory supports sound decisions based on aviation weather reports and forecasts.", sources: [phak-weather-theory-purpose], risk: operational, script_sections: ["What the ACS is asking you to connect", "The map for this lesson", "Rising air, stability, and convection", "From theory to Episode 12", "Retrieval review"], status: draft}
  - {id: atmosphere-mixture-water-vapor, type: faa_guidance, statement: "The atmosphere is a moving mixture of gases that includes a variable amount of water vapor, and that small variable component is responsible for major weather changes.", sources: [phak-atmosphere-troposphere], risk: foundational, script_sections: ["The atmosphere is the working material"], status: draft}
  - {id: troposphere-weather-phenomena, type: faa_guidance, statement: "Most weather, clouds, storms, and temperature variations occur in the troposphere.", sources: [phak-atmosphere-troposphere], risk: foundational, script_sections: ["The atmosphere is the working material"], status: draft}
  - {id: troposphere-depth, type: faa_guidance, statement: "The troposphere extends to about 36,000 feet and varies in depth with latitude and season.", sources: [awh-air-parcel-troposphere], risk: foundational, script_sections: ["The atmosphere is the working material"], status: draft}
  - {id: air-parcel-conceptual-model, type: faa_guidance, statement: "An air parcel is an imaginary volume used to assign atmospheric properties and reason about what selected air is doing.", sources: [awh-air-parcel-troposphere], risk: foundational, script_sections: ["The atmosphere is the working material"], status: draft}
  - {id: parcel-properties-uniform, type: faa_guidance, statement: "An air parcel has no precise numerical definition, and its assigned atmospheric properties are treated as approximately uniform.", sources: [awh-air-parcel-troposphere], risk: foundational, script_sections: ["The atmosphere is the working material"], status: draft}
  - {id: unequal-heating-drives-motion, type: faa_guidance, statement: "Uneven heating of Earth's surface changes density and pressure and sets air in motion.", sources: [phak-heating-density-pressure], risk: foundational, script_sections: ["Heating changes density and starts motion", "Rising air, stability, and convection", "Retrieval review"], status: draft}
  - {id: heat-transfer-modes, type: faa_guidance, statement: "The Aviation Weather Handbook identifies radiation, conduction, and convection as atmospheric heat-transfer modes.", sources: [awh-heat-transfer-modes], risk: foundational, script_sections: ["Heating changes density and starts motion"], status: draft}
  - {id: temperature-advection, type: faa_guidance, statement: "Temperature advection is the horizontal change to an air column's temperature profile when wind brings colder or warmer air into part of that column.", sources: [awh-temperature-advection], risk: foundational, script_sections: ["Heating changes density and starts motion"], status: draft}
  - {id: temperature-density-relationship, type: faa_guidance, statement: "Warming spreads air molecules and makes air less dense, while cooling packs molecules more closely and makes air denser.", sources: [phak-heating-density-pressure], risk: foundational, script_sections: ["Heating changes density and starts motion", "Rising air, stability, and convection", "Retrieval review"], status: draft}
  - {id: pressure-air-weight, type: faa_guidance, statement: "Atmospheric pressure is the force per unit area exerted by the weight of the air above a surface.", sources: [phak-heating-density-pressure], risk: foundational, script_sections: ["Pressure and its reference systems"], status: draft}
  - {id: standard-pressure-reference, type: faa_guidance, statement: "The standard sea-level pressure reference is 29.92 inches of mercury or 1,013.2 millibars.", sources: [phak-pressure-reference-altitude], risk: foundational, script_sections: ["Pressure and its reference systems"], status: draft}
  - {id: hectopascal-millibar-equivalence, type: faa_guidance, statement: "Hectopascals and millibars are equivalent pressure units.", sources: [awh-pressure-units-station], risk: foundational, script_sections: ["Pressure and its reference systems"], status: draft}
  - {id: standard-atmosphere-fixed-reference, type: faa_guidance, statement: "The standard atmosphere is a fixed hypothetical distribution of pressure, temperature, and density used as a common reference for altimeter calibration and aircraft-performance relationships.", sources: [awh-standard-atmosphere-reference], risk: foundational, script_sections: ["Pressure and its reference systems"], status: draft}
  - {id: station-pressure-local-reference, type: faa_guidance, statement: "Station pressure is the actual pressure at field elevation and is normally lower at higher-elevation airports.", sources: [awh-pressure-units-station], risk: foundational, script_sections: ["Pressure and its reference systems", "Retrieval review"], status: draft}
  - {id: sea-level-pressure-comparison, type: faa_guidance, statement: "Weather stations normalize station pressure to a mean-sea-level reference so readings from different elevations can be compared without confusing terrain elevation with the pressure pattern.", sources: [awh-sea-level-pressure-reference], risk: operational, script_sections: ["Pressure and its reference systems", "Retrieval review"], status: draft}
  - {id: msl-agl-references, type: faa_guidance, statement: "MSL altitude is measured from mean sea level, while AGL altitude is measured above ground level.", sources: [faa-pcg-altitude-reference], risk: operational, script_sections: ["How pressure references appear in flight information"], status: draft}
  - {id: airport-elevation-reference, type: faa_guidance, statement: "Airport elevation is the highest point of an airport's usable runways measured in feet from mean sea level.", sources: [faa-pcg-airport-elevation], risk: operational, script_sections: ["How pressure references appear in flight information"], status: draft}
  - {id: altimeter-setting-purpose, type: faa_guidance, statement: "The altimeter setting is the value set so the altimeter indicates true altitude at field elevation.", sources: [awh-altimeter-setting-reference], risk: operational, script_sections: ["How pressure references appear in flight information", "Retrieval review"], status: draft}
  - {id: metar-altimeter-cloud-references, type: faa_guidance, statement: "A METAR's cloud-layer heights are expressed in feet AGL, and its altimeter group reports the altimeter setting.", sources: [awh-metar-altimeter-cloud-bases], risk: operational, script_sections: ["How pressure references appear in flight information"], status: draft}
  - {id: metar-sea-level-pressure-remark, type: faa_guidance, statement: "At designated stations, a METAR remark may report sea-level pressure in millibars as an SLP group.", sources: [awh-metar-sea-level-pressure], risk: operational, script_sections: ["How pressure references appear in flight information"], status: draft}
  - {id: asos-awos-observations, type: faa_guidance, statement: "ASOS/AWOS provides continuous airport weather observations, generates METAR and other aviation weather information, and may transmit those observations by radio voice.", sources: [aim-awos-asos-observations], risk: operational, script_sections: ["How pressure references appear in flight information"], status: draft}
  - {id: atis-altimeter-content, type: faa_guidance, statement: "ATIS weather content includes the current altimeter setting as appropriate when ATIS is provided.", sources: [atc-atis-altimeter-content], risk: operational, script_sections: ["How pressure references appear in flight information"], status: draft}
  - {id: atc-altimeter-setting-issuance, type: faa_guidance, statement: "Controllers issue current altimeter settings under the procedures that govern their operation.", sources: [atc-altimeter-setting-issuance], risk: operational, script_sections: ["How pressure references appear in flight information"], status: draft}
  - {id: pressure-altitude-reference, type: faa_guidance, statement: "Pressure altitude associates measured static pressure with the standard 29.92 inHg reference.", sources: [awh-pressure-altitude-reference], risk: operational, script_sections: ["How pressure references appear in flight information", "Retrieval review"], status: draft}
  - {id: density-altitude-performance-index, type: faa_guidance, statement: "Density altitude corrects pressure altitude for nonstandard temperature and is an index to aircraft performance.", sources: [awh-density-altitude-reference], risk: operational, script_sections: ["How pressure references appear in flight information", "Retrieval review"], status: draft}
  - {id: pressure-decreases-altitude, type: faa_guidance, statement: "Atmospheric pressure decreases with altitude, and lower pressure corresponds to less-dense air.", sources: [phak-pressure-reference-altitude], risk: foundational, script_sections: ["Pressure and its reference systems", "Rising air, stability, and convection"], status: draft}
  - {id: pressure-patterns-motion-weather, type: faa_guidance, statement: "Pressure and temperature differences contribute to atmospheric motion; descending dry air is generally associated with high pressure, while rising air and increasing cloudiness or precipitation commonly accompany low pressure.", sources: [phak-high-low-vertical-motion], risk: operational, script_sections: ["Rising air, stability, and convection"], status: draft}
  - {id: stability-definition, type: faa_guidance, statement: "Atmospheric stability is resistance to vertical motion: stable air damps small vertical disturbances, while unstable air allows them to grow.", sources: [phak-stability-adiabatic], risk: operational, script_sections: ["Rising air, stability, and convection", "Retrieval review"], status: draft}
  - {id: convection-vertical-transport, type: faa_guidance, statement: "Meteorological convection is vertical transport of heat and moisture in the atmosphere.", sources: [awh-convection-definition], risk: operational, script_sections: ["Rising air, stability, and convection"], status: draft}
  - {id: surface-heating-rising-air, type: faa_guidance, statement: "Surface heating can make air less dense and cause it to rise.", sources: [phak-heating-density-pressure], risk: operational, script_sections: ["Rising air, stability, and convection", "Retrieval review"], status: draft}
  - {id: parcel-environment-stability-comparison, type: faa_guidance, statement: "Stability reasoning compares a hypothetically lifted parcel with surrounding environmental air at the same level: colder and denser favors sinking, while warmer and less dense favors continued ascent.", sources: [awh-parcel-stability-comparison], risk: operational, script_sections: ["Rising air, stability, and convection"], status: draft}
  - {id: rising-cools-descending-warms, type: faa_guidance, statement: "Rising air expands and cools as pressure decreases, while descending air compresses and warms as pressure increases.", sources: [phak-stability-adiabatic], risk: foundational, script_sections: ["Rising air, stability, and convection", "Retrieval review"], status: draft}
  - {id: adiabatic-parcel-chain, type: faa_guidance, statement: "For a rising unsaturated parcel, decreasing pressure permits expansion and the parcel's temperature falls; descent reverses that pressure-volume-temperature chain.", sources: [phak-lapse-moisture-inversion], risk: foundational, script_sections: ["Rising air, stability, and convection"], status: draft}
  - {id: saturated-parcel-slower-cooling, type: faa_guidance, statement: "Moist air cools more slowly than dry air.", sources: [phak-lapse-moisture-inversion], risk: foundational, script_sections: ["Rising air, stability, and convection"], status: draft}
  - {id: warm-air-moisture-capacity, type: faa_guidance, statement: "Warmer air can contain more water vapor than cooler air before saturation.", sources: [phak-lapse-moisture-inversion], risk: foundational, script_sections: ["Moisture becomes visible at saturation", "Retrieval review"], status: draft}
  - {id: relative-humidity-definition, type: faa_guidance, statement: "Relative humidity compares the water vapor present with the amount the air could contain at the current temperature and pressure.", sources: [phak-lapse-moisture-inversion], risk: foundational, script_sections: ["Moisture becomes visible at saturation", "Retrieval review"], status: draft}
  - {id: inversion-stable-layer, type: faa_guidance, statement: "A temperature inversion is a layer in which temperature rises with altitude; it is commonly smooth and stable and can trap weather and pollutants below it.", sources: [phak-lapse-moisture-inversion], risk: operational, script_sections: ["Rising air, stability, and convection", "Two mornings, two outcomes"], status: draft}
  - {id: dewpoint-saturation-definition, type: federal_science_guidance, statement: "Dew point is the temperature to which air must be cooled to reach saturation when air pressure and moisture content are constant.", sources: [nws-dew-point-definition], risk: foundational, script_sections: ["Moisture becomes visible at saturation", "Retrieval review"], status: draft}
  - {id: saturation-four-paths, type: faa_guidance, statement: "Air can reach saturation by moving over a cold surface, mixing warm and cold air, cooling through contact with the ground at night, or being lifted and cooled.", sources: [phak-dewpoint-saturation-lifting], risk: operational, script_sections: ["Four paths to saturation", "Retrieval review"], status: draft}
  - {id: temperature-dewpoint-cloud-base-model, type: faa_guidance, statement: "When unsaturated air is lifted, temperature and dew point converge; a wider surface spread generally requires more lifting before saturation, and the PHAK uses that relationship to estimate an approximate cloud-base height.", sources: [phak-dewpoint-saturation-lifting], risk: operational, script_sections: ["Four paths to saturation"], status: draft}
  - {id: cloud-formation-requirements, type: faa_guidance, statement: "Cloud formation requires adequate water vapor, condensation nuclei, and a process that cools air to saturation.", sources: [phak-cloud-formation-low-clouds], risk: foundational, script_sections: ["Moisture becomes visible at saturation", "Clouds make the chain visible", "Retrieval review"], status: draft}
  - {id: visible-cloud-formation, type: faa_guidance, statement: "When air cools to saturation, invisible water vapor condenses or deposits on condensation nuclei and becomes visible.", sources: [phak-cloud-formation-low-clouds], risk: foundational, script_sections: ["Moisture becomes visible at saturation", "Clouds make the chain visible", "Retrieval review"], status: draft}
  - {id: cloud-particle-light-scattering, type: federal_science_guidance, statement: "Small water droplets or ice crystals scatter sunlight.", sources: [noaa-cloud-light-scattering], risk: foundational, script_sections: ["Moisture becomes visible at saturation", "Clouds make the chain visible", "Retrieval review"], status: draft}
  - {id: low-cloud-operational-meaning, type: faa_guidance, statement: "Low clouds can create low ceilings, restrict visibility, change rapidly, and make VFR flight impossible.", sources: [phak-cloud-formation-low-clouds], risk: safety_critical, script_sections: ["Clouds make the chain visible"], status: draft}
  - {id: cloud-base-classification, type: faa_guidance, statement: "The PHAK groups basic cloud forms into low, middle, high, and extensive-vertical-development families.", sources: [phak-cloud-families-vertical], risk: foundational, script_sections: ["What cloud structure can tell you", "Retrieval review"], status: draft}
  - {id: cloud-vertical-development-family, type: faa_guidance, statement: "Cumulus clouds can build vertically into towering cumulus or cumulonimbus clouds.", sources: [phak-cloud-families-vertical], risk: foundational, script_sections: ["What cloud structure can tell you", "Retrieval review"], status: draft}
  - {id: cloud-name-classifications, type: faa_guidance, statement: "The PHAK defines cumulus as heaped or piled clouds, stratus as formed in layers, cirrus as ringlets or fibrous clouds, and nimbus as rain-bearing clouds.", sources: [phak-cloud-name-classifications], risk: foundational, script_sections: ["Retrieval review"], status: draft}
  - {id: vertical-cloud-instability, type: faa_guidance, statement: "Towering cumulus indicates instability, and cumulonimbus contains unstable air and substantial moisture and can produce hazardous weather.", sources: [phak-cloud-families-vertical], risk: safety_critical, script_sections: ["What cloud structure can tell you", "Retrieval review"], status: draft}
  - {id: ceiling-visibility-meaning, type: faa_guidance, statement: "For aviation, ceiling is the lowest broken or overcast layer or vertical visibility into an obscuration, while visibility is the greatest horizontal distance at which prominent objects can be seen with the naked eye.", sources: [phak-ceiling-visibility-precipitation], risk: operational, script_sections: ["From theory to Episode 12"], status: draft}
  - {id: precipitation-observable-consequence, type: faa_guidance, statement: "Precipitation forms when cloud water or ice particles grow large enough to fall and can reduce visibility or contribute to icing and runway hazards.", sources: [phak-ceiling-visibility-precipitation], risk: safety_critical, script_sections: ["What cloud structure can tell you", "From theory to Episode 12"], status: draft}
