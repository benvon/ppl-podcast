learning_objectives:
  - Distinguish position-light timing, the civil-twilight night definition,
    night recent experience, and proficiency for the actual planned flight.
  - Explain dark adaptation and off-center scanning, and prepare readable
    cockpit lighting and accessible personal equipment.
  - Build a night route using terrain, weather, current lighting status, fuel
    and a prepared suitable alternative.
  - Verify pilot-controlled lighting and use airport light patterns to identify
    the intended runway while managing taxi and traffic risks.
  - Interpret PAPI and two-bar VASI indications within verified coverage;
    identify other slope systems before using them, cross-check altitude and
    airspeed, and go around when runway position or altitude is uncertain.
  - Connect night weather cues and electrical/engine failures to early landing
    decisions and airplane-specific checklists.
trouble_spots:
  - Three timing windows answer different questions; qualifying night currency
    does not establish trip proficiency.
  - Red light can distort chart colors; dim white light and controlled screen
    brightness support readable information.
  - PAPI visibility is not its obstruction-clearance coverage, which may have
    local limitations.
  - Night VFR outside references can be inadequate even when some lights remain
    visible.
  - Darkness does not establish terrain suitable for forced landing.
  - A landing-light rule for for-hire flight does not settle all aircraft
    equipment requirements.
