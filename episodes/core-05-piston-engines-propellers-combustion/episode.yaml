learning_objectives:
  - "Trace how a four-stroke reciprocating engine converts combustion pressure into crankshaft rotation."
  - "Explain how a propeller acts as a rotating airfoil and why blade twist, pitch, rpm, and airspeed affect thrust."
  - "Distinguish fixed-pitch from constant-speed propeller behavior and interpret the basic engine-power indications associated with each."
  - "Separate normal combustion, detonation, and preignition by timing, pressure development, indications, and operating awareness."
  - "Explain why dual magnetos improve ignition reliability and why a propeller must always be treated as capable of moving the engine."
trouble_spots:
  - "Treating the piston as directly producing thrust instead of following the chain from pressure to crankshaft rotation to propeller thrust."
  - "Confusing propeller blade angle with propeller angle of attack or assuming every part of an untwisted blade would meet the air the same way."
  - "Treating rpm as a universal, standalone measure of power without accounting for propeller type, altitude, and the airplane's published power-setting information."
  - "Using detonation and preignition as synonyms instead of distinguishing an explosive end-gas event from ignition before the intended spark event."
  - "Assuming an aircraft electrical-system shutdown makes a magneto ignition system unable to fire."
