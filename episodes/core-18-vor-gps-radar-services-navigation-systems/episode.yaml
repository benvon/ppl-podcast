learning_objectives:
  - Prepare a VOR frequency and identifier, then explain the radial, selected
    course, TO/FROM indication, CDI/HSI relationship, DME range, and signal
    status.
  - Use GPS position information with an integrity, data-currency, and
    independent-cross-check question.
  - Distinguish radar traffic information, VFR radar navigation assistance, and
    basic terminal radar service.
  - Build on Episode 16's ADS-B Out/In distinction to explain direct traffic,
    ground-delivered TIS-B, equipment-specific documentation, and visual
    acquisition.
  - Recognize a navigation disagreement early and prioritize aircraft control,
    outside vigilance, and current authoritative information.
trouble_spots:
  - Treating a VOR radial as a course toward a station, or using an indication
    before station identification and usable-signal status are established.
  - Treating GPS database content or a displayed position as self-validating.
  - Assuming requested VFR radar service guarantees traffic detection,
    vectoring, or separation.
  - Assuming every ADS-B In display receives the same traffic sources, or
    allowing an avionics task or traffic display to displace the visual scan and
    aircraft control.
