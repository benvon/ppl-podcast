            verdict: supports
            rationale: The excerpt states that spark-ignition engines use a spark plug to
              ignite a pre-mixed fuel-air mixture, while compression-ignition
              engines compress air to raise its temperature sufficiently for
              automatic ignition when fuel is injected.
