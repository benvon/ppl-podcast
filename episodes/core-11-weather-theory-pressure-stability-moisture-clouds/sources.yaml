    revision: "Current FAA web edition verified August 31, 2026"
    relevance_excerpt: "ATIS weather content includes sky condition, temperature, dew point, altimeter, and other pertinent remarks; ASOS/AWOS is the primary source of altimeter data where equipped."
    verified_at_utc: "2026-08-31T14:29:00Z"
    link_status: 200
    supports_claims: [atis-altimeter-content]

  - id: atc-altimeter-setting-issuance
    authority: faa_guidance
    title: "FAA Order JO 7110.65, Air Traffic Control"
    document_id: "FAA Order JO 7110.65"
    locator: "Ch. 2, Current Settings and Altimeter Setting Issuance, paras. 2-7-1 to 2-7-2"
    url: "https://www.faa.gov/air_traffic/publications/atpubs/atc_html/chap2_section_7.html"
    revision: "Current FAA web edition verified August 31, 2026"
    relevance_excerpt: "Controllers obtain current altimeter settings from instruments or weather reporting stations and issue settings to en route aircraft and terminal departures under the specified procedures."
    verified_at_utc: "2026-08-31T14:29:00Z"
