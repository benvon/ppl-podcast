episode_id: "core-11"
claims:
  - {id: acs-weather-theory-scope, type: faa_standard, statement: "ACS Weather Information requires meteorology applicable to VFR flight, including atmospheric composition and stability, temperature and heat exchange, moisture and precipitation, weather-system formation, clouds, turbulence, thunderstorms, icing, fog, frost, and visibility obstructions.", sources: [acs-weather-stability, acs-weather-moisture-clouds-risk], risk: operational, script_sections: ["What the ACS is asking you to connect"], status: draft}
  - {id: acs-weather-decision-use, type: faa_standard, statement: "The applicant analyzes the implications of weather conditions and correlates weather information to make a go/no-go decision while identifying risks associated with go/no-go, continue/divert, and weather-information limitations.", sources: [acs-weather-moisture-clouds-risk], risk: safety_critical, script_sections: ["What the ACS is asking you to connect", "From physical model to weather products", "A complete causal story"], status: draft}
  - {id: weather-theory-supports-interpretation, type: faa_guidance, statement: "Understanding weather theory supports sound decisions based on aviation weather reports and forecasts.", sources: [phak-weather-theory-purpose], risk: operational, script_sections: ["What the ACS is asking you to connect", "Pressure patterns reveal vertical motion", "From physical model to weather products"], status: draft}
  - {id: atmosphere-mixture-water-vapor, type: faa_guidance, statement: "The atmosphere is a moving mixture of gases that includes a variable amount of water vapor, and that small variable component is responsible for major weather changes.", sources: [phak-atmosphere-troposphere], risk: foundational, script_sections: ["The atmosphere is the working material"], status: draft}
  - {id: troposphere-weather-layer, type: faa_guidance, statement: "Most weather, clouds, storms, and temperature variations occur in the troposphere.", sources: [phak-atmosphere-troposphere], risk: foundational, script_sections: ["The atmosphere is the working material"], status: draft}
  - {id: unequal-heating-drives-motion, type: faa_guidance, statement: "Uneven heating of Earth's surface changes density and pressure and sets air in motion.", sources: [phak-heating-density-pressure], risk: foundational, script_sections: ["Temperature gives air a reason to move"], status: draft}
  - {id: temperature-density-relationship, type: faa_guidance, statement: "Warming spreads air molecules and makes air less dense, while cooling packs molecules more closely and makes air denser.", sources: [phak-heating-density-pressure], risk: foundational, script_sections: ["Temperature gives air a reason to move", "Rising air cools; descending air warms"], status: draft}
  - {id: pressure-air-weight, type: faa_guidance, statement: "Atmospheric pressure is the force exerted by the weight of air molecules.", sources: [phak-heating-density-pressure], risk: foundational, script_sections: ["Pressure is the weight of the air above"], status: draft}
  - {id: standard-pressure-reference, type: faa_guidance, statement: "The standard sea-level pressure reference is 29.92 inches of mercury or 1,013.2 millibars.", sources: [phak-pressure-reference-altitude], risk: foundational, script_sections: ["Pressure is the weight of the air above"], status: draft}
  - {id: sea-level-pressure-comparison, type: faa_guidance, statement: "Weather stations convert local station pressure to sea-level pressure so readings from different elevations can be compared.", sources: [phak-pressure-reference-altitude], risk: operational, script_sections: ["Pressure is the weight of the air above", "From physical model to weather products"], status: draft}
  - {id: pressure-decreases-altitude, type: faa_guidance, statement: "Atmospheric pressure decreases with altitude, and lower pressure corresponds to less-dense air.", sources: [phak-pressure-reference-altitude], risk: foundational, script_sections: ["Pressure is the weight of the air above", "Rising air cools; descending air warms"], status: draft}
  - {id: pressure-patterns-motion-weather, type: faa_guidance, statement: "Pressure and temperature differences contribute to atmospheric motion; descending dry air is generally associated with high pressure, while rising air and increasing cloudiness or precipitation commonly accompany low pressure.", sources: [phak-high-low-vertical-motion], risk: operational, script_sections: ["Pressure patterns reveal vertical motion", "From physical model to weather products"], status: draft}
  - {id: stability-definition, type: faa_guidance, statement: "Atmospheric stability is resistance to vertical motion: stable air damps small vertical disturbances, while unstable air allows them to grow.", sources: [phak-stability-adiabatic], risk: operational, script_sections: ["Rising air cools; descending air warms", "Stability asks what happens after air is lifted"], status: draft}
  - {id: rising-cools-descending-warms, type: faa_guidance, statement: "Rising air expands and cools as pressure decreases, while descending air compresses and warms as pressure increases.", sources: [phak-stability-adiabatic], risk: foundational, script_sections: ["Rising air cools; descending air warms"], status: draft}
  - {id: adiabatic-parcel-chain, type: faa_guidance, statement: "For a rising unsaturated parcel, decreasing pressure permits expansion and the parcel's temperature falls; descent reverses that pressure-volume-temperature chain.", sources: [phak-lapse-moisture-inversion], risk: foundational, script_sections: ["Rising air cools; descending air warms"], status: draft}
  - {id: saturated-parcel-slower-cooling, type: faa_guidance, statement: "Saturated or moist rising air cools more slowly than unsaturated or dry air and therefore must rise farther before cooling to the temperature of surrounding air.", sources: [phak-lapse-moisture-inversion], risk: foundational, script_sections: ["Rising air cools; descending air warms"], status: draft}
  - {id: warm-air-moisture-capacity, type: faa_guidance, statement: "Warmer air can contain more water vapor than cooler air before saturation.", sources: [phak-lapse-moisture-inversion], risk: foundational, script_sections: ["Moisture becomes visible at saturation"], status: draft}
  - {id: relative-humidity-definition, type: faa_guidance, statement: "Relative humidity compares the water vapor present with the amount the air could contain at the current temperature.", sources: [phak-lapse-moisture-inversion], risk: foundational, script_sections: ["Moisture becomes visible at saturation"], status: draft}
  - {id: inversion-stable-layer, type: faa_guidance, statement: "A temperature inversion is a layer in which temperature rises with altitude; it is commonly smooth and stable and can trap moisture and pollutants below it.", sources: [phak-lapse-moisture-inversion], risk: operational, script_sections: ["Stability asks what happens after air is lifted", "A complete causal story"], status: draft}
  - {id: dewpoint-saturation-definition, type: faa_guidance, statement: "Dew point is the temperature at which air becomes saturated; cooling to that temperature permits water vapor to condense into visible moisture.", sources: [phak-dewpoint-saturation-lifting], risk: foundational, script_sections: ["Moisture becomes visible at saturation"], status: draft}
  - {id: saturation-four-paths, type: faa_guidance, statement: "Air can reach saturation by moving over a cold surface, mixing warm and cold air, cooling through contact with the ground at night, or being lifted and cooled.", sources: [phak-dewpoint-saturation-lifting], risk: operational, script_sections: ["Four paths to saturation"], status: draft}
  - {id: temperature-dewpoint-cloud-base-model, type: faa_guidance, statement: "When unsaturated air is lifted, temperature and dew point converge; a wider surface spread generally requires more lifting before saturation, and the PHAK uses that relationship to estimate an approximate cloud-base height.", sources: [phak-dewpoint-saturation-lifting], risk: operational, script_sections: ["Four paths to saturation"], status: draft}
  - {id: cloud-formation-requirements, type: faa_guidance, statement: "Cloud formation requires adequate water vapor, condensation nuclei, and a process that cools air to saturation.", sources: [phak-cloud-formation-low-clouds], risk: foundational, script_sections: ["Clouds show the process that built them"], status: draft}
  - {id: low-cloud-operational-meaning, type: faa_guidance, statement: "Low clouds can create low ceilings, restrict visibility, change rapidly, and make VFR flight impossible.", sources: [phak-cloud-formation-low-clouds], risk: safety_critical, script_sections: ["Clouds show the process that built them", "From physical model to weather products"], status: draft}
  - {id: cloud-family-classification, type: faa_guidance, statement: "The PHAK groups clouds by base height and vertical development into low, middle, high, and vertically developing families.", sources: [phak-cloud-families-vertical], risk: foundational, script_sections: ["What cloud structure can tell you"], status: draft}
  - {id: vertical-cloud-instability, type: faa_guidance, statement: "Towering cumulus indicates instability, and cumulonimbus contains unstable air and substantial moisture and can produce hazardous weather.", sources: [phak-cloud-families-vertical], risk: safety_critical, script_sections: ["What cloud structure can tell you"], status: draft}
  - {id: ceiling-visibility-meaning, type: faa_guidance, statement: "For aviation, ceiling is the lowest broken or overcast layer or vertical visibility into an obscuration, while visibility is the greatest horizontal distance at which prominent objects can be seen.", sources: [phak-ceiling-visibility-precipitation], risk: operational, script_sections: ["From physical model to weather products"], status: draft}
  - {id: precipitation-observable-consequence, type: faa_guidance, statement: "Precipitation forms when cloud water or ice particles grow large enough to fall and can reduce visibility or contribute to icing and runway hazards.", sources: [phak-ceiling-visibility-precipitation], risk: safety_critical, script_sections: ["What cloud structure can tell you", "From physical model to weather products"], status: draft}
  - {id: variables-not-verdicts, type: teaching_explanation, statement: "A weather observation or forecast supplies evidence about pressure, temperature, moisture, clouds, visibility, and change; the pilot must connect those variables to the route, timing, capabilities, and decision rather than treating one value as a complete verdict.", sources: [acs-weather-moisture-clouds-risk, phak-weather-theory-purpose], risk: safety_critical, script_sections: ["Pressure patterns reveal vertical motion", "From physical model to weather products", "A complete causal story"], status: draft}
