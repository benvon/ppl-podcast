episode_id: "core-04"
claims:
  - {id: acs-left-turning-anchor, type: faa_standard, statement: "The private-airplane ACS identifies left-turning tendencies as knowledge for the soft-field takeoff and climb task.", sources: [acs-left-turning-tendencies], risk: checkride, script_sections: ["What the ACS is asking you to connect"], status: fact_checked_initial_draft}
  - {id: primary-secondary-controls, type: faa_guidance, statement: "Ailerons, elevator or stabilator, and rudder are primary flight controls; flaps, leading-edge devices, spoilers, and trim systems are secondary controls.", sources: [phak-primary-secondary-controls], risk: safety_critical, script_sections: ["Controls change the airflow", "Trim changes the workload"], status: fact_checked_initial_draft}
  - {id: axes-and-primary-controls, type: faa_guidance, statement: "Ailerons control roll about the longitudinal axis, the elevator controls pitch about the lateral axis, and the rudder controls yaw about the vertical axis.", sources: [phak-axes-ailerons-adverse-yaw, phak-elevator-rudder], risk: checkride, script_sections: ["Three controls, three rotations"], status: fact_checked_initial_draft}
  - {id: elevator-and-rudder-roles, type: faa_guidance, statement: "Elevator input changes the aerodynamic force at the horizontal tail to control pitch, and rudder deflection creates a sideward aerodynamic force to control yaw.", sources: [phak-elevator-rudder], risk: safety_critical, script_sections: ["Three controls, three rotations"], status: fact_checked_initial_draft}
  - {id: adverse-yaw, type: faa_guidance, statement: "Aileron deflection creates unequal drag as well as unequal lift, producing adverse yaw opposite the direction of bank; the effect is more pronounced at low airspeeds.", sources: [phak-axes-ailerons-adverse-yaw], risk: safety_critical, script_sections: ["Why aileron alone is incomplete"], status: fact_checked_initial_draft}
  - {id: coordinated-control-roles, type: faa_guidance, statement: "In a coordinated turn, aileron establishes bank, rudder counters adverse yaw, and elevator increases angle of attack as needed for the increased lift requirement.", sources: [phak-coordinated-turn-controls], risk: safety_critical, script_sections: ["Why aileron alone is incomplete", "Control is a conversation, not a sequence"], status: fact_checked_initial_draft}
  - {id: design-mitigation-not-elimination, type: faa_guidance, statement: "Differential, Frise-type, and coupled aileron-rudder designs can reduce adverse yaw but do not eliminate the need for coordinated rudder use when ailerons are applied.", sources: [phak-coordinated-turn-controls], risk: safety_critical, script_sections: ["Why aileron alone is incomplete"], status: fact_checked_initial_draft}
  - {id: trim-purpose, type: faa_guidance, statement: "Trim relieves constant control pressure, and a changed power setting, pitch attitude, or configuration requires retrimming for the new flight condition.", sources: [phak-trim], risk: safety_critical, script_sections: ["Trim changes the workload"], status: fact_checked_initial_draft}
  - {id: stability-static-dynamic, type: faa_guidance, statement: "Static stability is the airplane's initial tendency after a disturbance, while dynamic stability describes its response over time.", sources: [phak-static-dynamic-stability], risk: checkride, script_sections: ["Stability is not self-flying"], status: fact_checked_initial_draft}
  - {id: stability-by-axis, type: faa_guidance, statement: "Longitudinal, lateral, and directional stability describe the airplane's pitch, roll, and yaw stability about its lateral, longitudinal, and vertical axes.", sources: [phak-axis-stability], risk: checkride, script_sections: ["Stability is not self-flying"], status: fact_checked_initial_draft}
  - {id: directional-weather-vane, type: faa_guidance, statement: "The vertical fin and fuselage area aft of the center of gravity contribute to directional stability by tending to point the airplane's nose into the relative wind.", sources: [phak-axis-stability], risk: safety_critical, script_sections: ["Stability helps, but it does not replace control"], status: fact_checked_initial_draft}
  - {id: torque-reaction, type: faa_guidance, statement: "Torque reaction from engine and propeller rotation can create a left roll tendency in the usual U.S.-built clockwise-from-the-pilot propeller example and additional left yaw on the takeoff roll.", sources: [phak-torque-slipstream], risk: safety_critical, script_sections: ["The four propeller effects: start with the situation"], status: fact_checked_initial_draft}
  - {id: spiraling-slipstream, type: faa_guidance, statement: "At high propeller speed and low forward speed, spiraling slipstream can exert a strong sideward force on the vertical tail and create a yawing moment.", sources: [phak-torque-slipstream], risk: safety_critical, script_sections: ["The four propeller effects: start with the situation"], status: fact_checked_initial_draft}
  - {id: gyroscopic-precession, type: faa_guidance, statement: "Gyroscopic precession produces a resultant force 90 degrees ahead in the direction of propeller rotation when a deflecting force is applied.", sources: [phak-gyroscopic-p-factor], risk: checkride, script_sections: ["The four propeller effects: start with the situation"], status: fact_checked_initial_draft}
  - {id: p-factor, type: faa_guidance, statement: "At high angle of attack, asymmetric propeller loading can give the downward-moving blade more thrust and create left yaw in the usual propeller-rotation example.", sources: [phak-gyroscopic-p-factor], risk: safety_critical, script_sections: ["The four propeller effects: start with the situation"], status: fact_checked_initial_draft}
  - {id: aircraft-specific-variation, type: faa_guidance, statement: "The relative strength and direction of propeller effects vary with the flight situation and with the airplane, engine, propeller, and design features.", sources: [phak-torque-slipstream, phak-gyroscopic-p-factor], risk: safety_critical, script_sections: ["The four propeller effects: start with the situation", "Bring the model back to the airplane"], status: fact_checked_initial_draft}
