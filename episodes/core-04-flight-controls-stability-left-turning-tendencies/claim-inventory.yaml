episode_id: "core-04"
claims:
  - {id: acs-left-turning-anchor, type: faa_standard, statement: "The private-airplane ACS identifies left-turning tendencies as knowledge for the soft-field takeoff and climb task.", sources: [acs-left-turning-tendencies], risk: checkride, script_sections: ["What the ACS is asking you to connect"], status: fact_checked_initial_draft}
  - {id: primary-secondary-controls, type: faa_guidance, statement: "Ailerons, elevator or stabilator, and rudder are primary flight controls; flaps, leading-edge devices, spoilers, and trim systems are secondary controls.", sources: [phak-primary-secondary-controls], risk: safety_critical, script_sections: ["Controls change the airflow", "Trim changes the workload"], status: fact_checked_initial_draft}
  - {id: aileron-axis-role, type: faa_guidance, statement: "Ailerons control roll about the longitudinal axis.", sources: [phak-axes-ailerons-adverse-yaw], risk: checkride, script_sections: ["Controls change the airflow", "Three controls, three rotations"], status: fact_checked_initial_draft}
  - {id: elevator-role, type: faa_guidance, statement: "Elevator input changes the aerodynamic force at the horizontal tail to control pitch about the lateral axis.", sources: [phak-elevator], risk: safety_critical, script_sections: ["Three controls, three rotations"], status: fact_checked_initial_draft}
  - {id: rudder-role, type: faa_guidance, statement: "Rudder deflection creates a sideward aerodynamic force to control yaw about the vertical axis.", sources: [phak-rudder-effectiveness], risk: safety_critical, script_sections: ["Three controls, three rotations", "Rudder manages yaw, not just takeoff"], status: fact_checked_initial_draft}
  - {id: rudder-effectiveness, type: faa_guidance, statement: "Rudder effectiveness increases with airspeed, and propeller slipstream can increase rudder effectiveness in propeller-driven airplanes.", sources: [phak-rudder-effectiveness], risk: safety_critical, script_sections: ["Rudder manages yaw, not just takeoff"], status: fact_checked_initial_draft}
  - {id: adverse-yaw, type: faa_guidance, statement: "Aileron deflection creates unequal drag as well as unequal lift, producing adverse yaw opposite the direction of bank; the effect is more pronounced at low airspeeds.", sources: [phak-axes-ailerons-adverse-yaw], risk: safety_critical, script_sections: ["Why aileron alone is incomplete"], status: fact_checked_initial_draft}
  - {id: coordinated-control-roles, type: faa_guidance, statement: "In a coordinated turn, aileron establishes bank, rudder counters adverse yaw, and elevator increases angle of attack as needed for the increased lift requirement.", sources: [phak-coordinated-turn-controls], risk: safety_critical, script_sections: ["Why aileron alone is incomplete", "Control is a conversation, not a sequence"], status: fact_checked_initial_draft}
  - {id: rudder-demand-conditions, type: faa_guidance, statement: "The need for rudder to counter adverse yaw is greatest at low airspeed, high angle of attack, or with large aileron application.", sources: [phak-coordinated-turn-controls], risk: safety_critical, script_sections: ["Rudder manages yaw, not just takeoff"], status: fact_checked_initial_draft}
  - {id: coordination-harmonizes-effects, type: teaching_explanation, statement: "Coordination is not equal control input; it is recognizing and harmonizing the coupled roll, pitch, and yaw effects of control changes so that unwanted yaw or sideslip is not layered onto the intended motion.", sources: [phak-coordinated-turn-controls], risk: safety_critical, script_sections: ["Why aileron alone is incomplete"], status: fact_checked_initial_draft}
  - {id: design-mitigation-not-elimination, type: faa_guidance, statement: "Differential, Frise-type, and coupled aileron-rudder designs can reduce adverse yaw but do not eliminate the need for coordinated rudder use when ailerons are applied.", sources: [phak-coordinated-turn-controls], risk: safety_critical, script_sections: ["Why aileron alone is incomplete"], status: fact_checked_initial_draft}
  - {id: trim-purpose, type: faa_guidance, statement: "Trim relieves constant control pressure, and a changed power setting, pitch attitude, or configuration requires retrimming for the new flight condition.", sources: [phak-trim], risk: safety_critical, script_sections: ["Trim changes the workload"], status: fact_checked_initial_draft}
  - {id: trim-desired-airspeed-context, type: teaching_explanation, statement: "After the desired power, pitch attitude, and configuration establish a flight condition including the desired airspeed, trim relieves the sustained control pressure used to hold that condition; trim is not the primary speed command.", sources: [phak-trim], risk: safety_critical, script_sections: ["Trim changes the workload"], status: fact_checked_initial_draft}
  - {id: flaps-change-aerodynamic-condition, type: faa_guidance, statement: "Flaps change wing camber and, in some designs, wing area; their extension changes lift, drag, and can create an airplane-specific pitching moment that may require trim adjustment.", sources: [phak-flaps-leading-edge-devices], risk: safety_critical, script_sections: ["Secondary controls reshape the airflow"], status: fact_checked_initial_draft}
  - {id: leading-edge-devices-delay-separation, type: faa_guidance, statement: "Fixed slots, movable slats, leading-edge flaps, and cuffs can delay airflow separation or increase maximum lift capability at higher angles of attack.", sources: [phak-flaps-leading-edge-devices], risk: safety_critical, script_sections: ["Secondary controls reshape the airflow"], status: fact_checked_initial_draft}
  - {id: spoilers-change-lift-drag, type: faa_guidance, statement: "Spoilers reduce lift and increase drag; depending on the airplane, they can aid descent, roll control, and braking effectiveness after landing.", sources: [phak-spoilers], risk: safety_critical, script_sections: ["Secondary controls reshape the airflow"], status: fact_checked_initial_draft}
  - {id: stability-definition, type: faa_guidance, statement: "Stability is an inherent design quality that helps an airplane correct for a disturbance and return to, or continue on, its original flightpath.", sources: [phak-static-stability], risk: checkride, script_sections: ["Stability is not self-flying"], status: fact_checked_initial_draft}
  - {id: static-stability, type: faa_guidance, statement: "Static stability is the airplane's initial tendency after a disturbance.", sources: [phak-static-stability], risk: checkride, script_sections: ["Stability is not self-flying"], status: fact_checked_initial_draft}
  - {id: dynamic-stability-oscillation, type: faa_guidance, statement: "Dynamic stability describes the response over time: damped oscillations decrease, undamped oscillations remain constant, and divergent oscillations increase.", sources: [phak-dynamic-stability-longitudinal-cg], risk: checkride, script_sections: ["Stability is not self-flying"], status: fact_checked_initial_draft}
  - {id: longitudinal-stability-cg, type: faa_guidance, statement: "Wing location relative to the center of gravity, horizontal-tail location relative to the center of gravity, and tail size affect longitudinal stability.", sources: [phak-dynamic-stability-longitudinal-cg], risk: safety_critical, script_sections: ["Stability is not self-flying"], status: fact_checked_initial_draft}
  - {id: longitudinal-stability-tail-force, type: faa_guidance, statement: "In the conventional-airplane example, the relationship among center of gravity, center of lift, horizontal-tail downforce, and changing downwash with airspeed contributes to longitudinal pitch stability.", sources: [phak-longitudinal-stability-tail-force], risk: safety_critical, script_sections: ["How design stabilizes pitch and roll"], status: fact_checked_initial_draft}
  - {id: longitudinal-stability-power-change, type: faa_guidance, statement: "The thrust line’s relationship to the center of gravity can make a power change create a pitching moment, and positive dynamic stability produces diminishing pitch oscillations after a disturbance.", sources: [phak-longitudinal-stability-power], risk: safety_critical, script_sections: ["How design stabilizes pitch and roll"], status: fact_checked_initial_draft}
  - {id: lateral-stability-dihedral, type: faa_guidance, statement: "In a sideslip, dihedral changes the angle of attack and lift on each wing, creating a restoring roll moment.", sources: [phak-lateral-stability], risk: safety_critical, script_sections: ["How design stabilizes pitch and roll"], status: fact_checked_initial_draft}
  - {id: lateral-stability-design-factors, type: faa_guidance, statement: "Dihedral, sweepback, keel effect, and weight distribution contribute to lateral stability.", sources: [phak-lateral-stability], risk: checkride, script_sections: ["How design stabilizes pitch and roll"], status: fact_checked_initial_draft}
  - {id: stability-by-axis, type: faa_guidance, statement: "Longitudinal, lateral, and directional stability describe the airplane's pitch, roll, and yaw stability about its lateral, longitudinal, and vertical axes.", sources: [phak-axis-stability], risk: checkride, script_sections: ["Stability is not self-flying"], status: fact_checked_initial_draft}
  - {id: directional-weather-vane, type: faa_guidance, statement: "The vertical fin and fuselage area aft of the center of gravity contribute to directional stability by tending to point the airplane's nose into the relative wind.", sources: [phak-axis-stability], risk: safety_critical, script_sections: ["Stability helps, but it does not replace control"], status: fact_checked_initial_draft}
  - {id: torque-reaction, type: faa_guidance, statement: "Torque reaction from engine and propeller rotation can create a left roll tendency in the usual U.S.-built clockwise-from-the-pilot propeller example and additional left yaw on the takeoff roll.", sources: [phak-torque-slipstream], risk: safety_critical, script_sections: ["The four propeller effects: start with the situation"], status: fact_checked_initial_draft}
  - {id: spiraling-slipstream, type: faa_guidance, statement: "At high propeller speed and low forward speed, spiraling slipstream can exert a strong sideward force on the vertical tail and create a yawing moment.", sources: [phak-torque-slipstream], risk: safety_critical, script_sections: ["The four propeller effects: start with the situation"], status: fact_checked_initial_draft}
  - {id: gyroscopic-precession, type: faa_guidance, statement: "Gyroscopic precession produces a resultant force 90 degrees ahead in the direction of propeller rotation when a deflecting force is applied.", sources: [phak-gyroscopic-p-factor], risk: checkride, script_sections: ["The four propeller effects: start with the situation"], status: fact_checked_initial_draft}
  - {id: p-factor, type: faa_guidance, statement: "At high angle of attack, asymmetric propeller loading can give the downward-moving blade more thrust and create left yaw in the usual propeller-rotation example.", sources: [phak-gyroscopic-p-factor], risk: safety_critical, script_sections: ["The four propeller effects: start with the situation"], status: fact_checked_initial_draft}
  - {id: aircraft-specific-variation, type: faa_guidance, statement: "The relative strength and direction of propeller effects vary with the flight situation and with the airplane, engine, propeller, and design features.", sources: [phak-torque-slipstream, phak-gyroscopic-p-factor], risk: safety_critical, script_sections: ["The four propeller effects: start with the situation", "Bring the model back to the airplane"], status: fact_checked_initial_draft}
  - {id: right-rudder-context, type: teaching_explanation, statement: "In the common clockwise-from-the-pilot propeller example, 'more right rudder' is shorthand for applying enough rudder to counter an increased left-yaw tendency in conditions such as high power, low forward speed, or high angle of attack; it is not a fixed pedal setting.", sources: [phak-torque-slipstream, phak-gyroscopic-p-factor], risk: safety_critical, script_sections: ["The four propeller effects: start with the situation"], status: fact_checked_initial_draft}
