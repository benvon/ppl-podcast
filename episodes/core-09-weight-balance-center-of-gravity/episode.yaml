learning_objectives:
  - "Distinguish total-weight limits from center-of-gravity limits and explain why both comparisons are required."
  - "Explain datum, arm, moment, and the lever reasoning behind a loaded-CG calculation."
  - "Identify the current aircraft-specific data and approved method needed before calculating a loading."
  - "Compute or interpret loaded weight and CG using computational, graph, or table methods without transferring sample aircraft data."
  - "Explain how forward and aft CG affect stability, control forces, and control authority."
  - "Track fuel-driven weight and CG changes through relevant phases of flight and correct an unacceptable loading."
  - "Carry takeoff and landing weights into performance planning and secure every item at its calculated station."
trouble_spots:
  - "Treating a below-maximum weight as proof that CG is within limits."
  - "Using sample or stale aircraft data instead of the current empty-weight and configuration record."
  - "Reading an envelope as a one-dimensional maximum-weight chart."
  - "Assuming fuel burn moves CG in one universal direction."
  - "Moving baggage to address an overweight condition without removing weight."
  - "Reducing fuel without rebuilding the fuel, reserve, and performance plan."
