learning_objectives:
  - Explain a proposed flight using current evidence and identify what would
    change the decision.
  - Distinguish pilot qualifications and currency from proficiency and fitness
    today.
  - Connect loading, performance, weather, fuel, and suitable alternatives
    before departure.
  - Compare actual progress with planned time and fuel and make a timely
    suitable diversion.
  - Apply aircraft-specific systems and emergency information while protecting
    control and landing options.
  - Connect stall/load awareness, a stable approach, and a timely go-around with
    demonstrated skill.
  - Prepare across all applicable ACS tasks and understand oral questioning,
    safety, and test interruption.
trouble_spots:
  - Treating an isolated correct fact as the complete operational answer.
  - Counting the same fuel as both reserve and a separate diversion allowance.
  - Treating qualification records or a legal weather threshold as a complete
    readiness decision.
  - Retaining old performance, arrival-time or fuel calculations after an input
    changes.
  - Assuming a remembered stall speed or fixed battery endurance guarantees a
    margin.
  - Confusing a practice dialogue with an official or exhaustive test script.
