learning_objectives:
  - Recognize a developing abnormal engine indication and choose an early
    precautionary landing while power remains.
  - If power is lost, establish the airplane’s recommended best glide speed and
    select a reachable landing area using altitude, wind, terrain, and
    obstacles.
  - Use a timely urgency or distress call and distinguish communication guidance
    from bounded emergency authority under 14 CFR 91.3.
  - Connect an electrical failure or smoke scenario to the airplane-specific
    checklist, landing decision, and applicable airspeed or system limits.
  - Locate installed emergency equipment, choose route-appropriate survival
    gear, and brief the passenger before flight.
trouble_spots:
  - An unexplained improvement in an engine indication is not a reason by itself
    to resume the planned cross-country.
  - Pitching up to stretch a glide can reduce reach and risk a stall.
  - A checklist, radio call, or passenger task must fit around maintaining
    control and a reachable landing path.
  - An electrical generation failure in a single-generator trainer may leave
    only limited battery time.
  - An emergency descent still respects the airplane’s configuration and
    structural speed limits.
  - The actual AFM or POH supplies aircraft-specific speeds, limits, and action
    sequence.
