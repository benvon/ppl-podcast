episode_id: "core-10"
claims:
  - {id: acs-performance-objective, type: faa_standard, statement: "ACS Task PA.I.F evaluates knowledge, risk management, and skill for operating an airplane within its performance capabilities and limitations.", sources: [acs-performance-knowledge-risk], risk: operational, script_sections: ["What the ACS is asking you to connect"], status: draft}
  - {id: acs-performance-factors, type: faa_standard, statement: "The ACS performance task connects atmospheric conditions, pilot technique, airplane configuration, airport environment, loading, weight and balance, and aerodynamics with chart and data use.", sources: [acs-performance-knowledge-risk], risk: operational, script_sections: ["What the ACS is asking you to connect", "A repeatable planning flow"], status: draft}
  - {id: acs-calculated-actual-risk, type: faa_standard, statement: "The ACS requires risk management for performance data, airplane limitations, and possible differences between calculated and actual performance.", sources: [acs-performance-knowledge-risk], risk: safety_critical, script_sections: ["What the ACS is asking you to connect", "Calculated performance is a disciplined estimate"], status: draft}
  - {id: acs-use-appropriate-data, type: faa_standard, statement: "ACS skill PA.I.F.S2 requires use of the appropriate airplane performance charts, tables, and data.", sources: [acs-performance-skill], risk: operational, script_sections: ["What the ACS is asking you to connect", "Performance starts with the actual airplane"], status: draft}
  - {id: airfoil-air-reaction, type: faa_guidance, statement: "A wing airfoil is designed to produce lift by obtaining an aerodynamic reaction from air moving past its surface.", sources: [phak-airfoil-air-reaction], risk: operational, script_sections: ["Density altitude is a performance altitude"], status: draft}
  - {id: poh-afm-identification, type: faa_guidance, statement: "The POH for most light airplanes built after 1975 is also designated as the FAA-approved flight manual, and its title or preliminary pages identify its approval status and the airplane to which it applies.", sources: [phak-poh-afm-identification], risk: operational, script_sections: ["What the ACS is asking you to connect"], status: draft}
  - {id: afm-poh-primary-performance-data, type: faa_guidance, statement: "The intended airplane's AFM or POH contains its operating data for takeoff, climb, range, endurance, descent, and landing.", sources: [phak-performance-data-introduction], risk: safety_critical, script_sections: ["Performance starts with the actual airplane", "A repeatable planning flow"], status: draft}
  - {id: later-flight-preflight-information, type: regulation, statement: "Section 91.103 requires the pilot in command, before beginning a flight, to become familiar with available information concerning that flight; before a later flight begins, the pilot in command must become familiar with available information concerning that later flight.", sources: [cfr-preflight-performance], risk: safety_critical, script_sections: ["Performance starts with the actual airplane", "Plan cruise and the climb to it", "A repeatable planning flow"], status: draft}
  - {id: performance-data-not-standardized, type: faa_guidance, statement: "Manufacturers do not standardize performance-data presentation; the data may use tables or graphs and may be based on standard conditions, pressure altitude, or density altitude.", sources: [phak-data-basis-and-density-effects], risk: operational, script_sections: ["Performance starts with the actual airplane", "Read the chart before reading the number"], status: draft}
  - {id: thin-air-reduces-performance, type: faa_guidance, statement: "Less-dense air reduces engine power, propeller thrust, and wing lift.", sources: [phak-data-basis-and-density-effects], risk: safety_critical, script_sections: ["Why thinner air changes takeoff and climb"], status: draft}
  - {id: pressure-altitude-definition, type: faa_guidance, statement: "Pressure altitude is the standard-atmosphere altitude corresponding to sensed pressure and can be read with the altimeter set to 29.92 inches of mercury.", sources: [phak-pressure-density-altitude-definitions], risk: operational, script_sections: ["Pressure altitude comes first"], status: draft}
  - {id: density-altitude-definition, type: faa_guidance, statement: "Density altitude is pressure altitude corrected for nonstandard temperature.", sources: [phak-pressure-density-altitude-definitions], risk: operational, script_sections: ["Density altitude is a performance altitude", "Pressure altitude comes first"], status: draft}
  - {id: high-density-altitude-thin-air, type: faa_guidance, statement: "Higher density altitude means lower air density and decreased airplane performance.", sources: [phak-density-altitude-performance], risk: safety_critical, script_sections: ["Density altitude is a performance altitude"], status: draft}
  - {id: density-altitude-inputs, type: faa_guidance, statement: "Density altitude can be determined from pressure altitude and outside air temperature using an appropriate chart or flight computer.", sources: [phak-density-altitude-performance], risk: operational, script_sections: ["Pressure altitude comes first"], status: draft}
  - {id: high-density-altitude-factors, type: faa_guidance, statement: "High elevation, low atmospheric pressure, high temperature, high humidity, or a combination can produce high density altitude.", sources: [phak-density-altitude-performance], risk: safety_critical, script_sections: ["Temperature and moisture change density"], status: draft}
  - {id: humidity-contributes-to-density, type: faa_guidance, statement: "Increasing moisture makes air less dense, increases density altitude, and reduces performance, even though humidity is usually not a primary input in basic density-altitude calculations.", sources: [phak-humidity-density], risk: operational, script_sections: ["Temperature and moisture change density"], status: draft}
  - {id: indicated-airspeed-definition-use, type: faa_guidance, statement: "Indicated airspeed is the direct airspeed-indicator reading before density, installation, or instrument-error corrections; AFM/POH takeoff, landing, and stall speeds are normally stated as indicated airspeeds.", sources: [phak-indicated-airspeed], risk: operational, script_sections: ["Why thinner air changes takeoff and climb"], status: draft}
  - {id: calibrated-true-airspeed-definitions, type: faa_guidance, statement: "Calibrated airspeed corrects indicated airspeed for installation and instrument error; true airspeed corrects calibrated airspeed for altitude and nonstandard temperature and describes speed through the surrounding air for flight planning.", sources: [phak-airspeed-cas-tas-groundspeed], risk: operational, script_sections: ["Why thinner air changes takeoff and climb"], status: draft}
  - {id: angle-rate-climb-distinction, type: faa_guidance, statement: "Angle of climb describes altitude gained per horizontal distance, while rate of climb describes altitude gained per unit of time.", sources: [phak-climb-angle-rate], risk: safety_critical, script_sections: ["Climb is distance and time"], status: draft}
  - {id: climb-gradient-groundspeed-conversion, type: faa_guidance, statement: "FAA obstacle-climb guidance expresses climb gradient in feet per nautical mile and bases its conversion to climb rate in feet per minute on groundspeed; a higher groundspeed increases the required climb rate.", sources: [aim-climb-gradient-groundspeed], risk: safety_critical, script_sections: ["Climb is distance and time"], status: draft}
  - {id: groundspeed-wind-relationship, type: faa_guidance, statement: "Groundspeed is true airspeed adjusted for wind; a headwind decreases groundspeed and a tailwind increases it.", sources: [phak-airspeed-cas-tas-groundspeed], risk: operational, script_sections: ["Why thinner air changes takeoff and climb", "Climb is distance and time"], status: draft}
  - {id: climb-factors-change-margin, type: faa_guidance, statement: "Increased weight, increased altitude, and configuration changes such as extended gear or flaps reduce excess thrust or power and reduce climb angle and rate.", sources: [phak-climb-performance-factors], risk: safety_critical, script_sections: ["Why thinner air changes takeoff and climb", "Climb is distance and time"], status: draft}
  - {id: runway-condition-matters, type: faa_guidance, statement: "A performance chart may assume a paved, level, smooth, dry runway, while soft or contaminated surfaces can reduce acceleration or braking effectiveness.", sources: [phak-runway-surface-gradient], risk: safety_critical, script_sections: ["Read the chart before reading the number", "Build the takeoff picture", "Plan landing as its own operation"], status: draft}
  - {id: runway-slope-matters, type: faa_guidance, statement: "An upsloping runway impedes takeoff acceleration and typically shortens landing roll; a downsloping runway has the opposite effect.", sources: [phak-runway-gradient-effects], risk: safety_critical, script_sections: ["Build the takeoff picture", "Plan landing as its own operation"], status: draft}
  - {id: takeoff-weight-effects, type: faa_guidance, statement: "Higher takeoff weight requires a higher lift-off speed, adds mass to accelerate, and increases retarding forces such as drag and ground friction.", sources: [phak-takeoff-weight-wind], risk: safety_critical, script_sections: ["Build the takeoff picture"], status: draft}
  - {id: takeoff-wind-groundspeed, type: faa_guidance, statement: "A headwind allows lift-off airspeed at a lower groundspeed, while a tailwind requires a higher groundspeed.", sources: [phak-takeoff-weight-wind], risk: safety_critical, script_sections: ["Build the takeoff picture"], status: draft}
  - {id: density-altitude-takeoff-effects, type: faa_guidance, statement: "Higher density altitude can require greater true speed for lift-off and reduce thrust and net acceleration, increasing takeoff demand.", sources: [phak-takeoff-density-inputs], risk: safety_critical, script_sections: ["Why thinner air changes takeoff and climb", "Build the takeoff picture"], status: draft}
  - {id: takeoff-chart-primary-inputs, type: faa_guidance, statement: "Primary takeoff-distance inputs include pressure altitude and temperature, gross weight, wind, and runway slope and condition.", sources: [phak-takeoff-density-inputs], risk: safety_critical, script_sections: ["Build the takeoff picture", "A repeatable planning flow"], status: draft}
  - {id: afh-predict-takeoff-climb-performance, type: faa_guidance, statement: "Before going to the airplane, the pilot checks the POH/AFM charts to predict takeoff and climb performance for the conditions and location; high density altitude reduces engine and propeller performance, increases takeoff roll, and decreases climb performance.", sources: [afh-prior-to-takeoff-performance], risk: safety_critical, script_sections: ["Why thinner air changes takeoff and climb", "A repeatable planning flow"], status: draft}
  - {id: landing-density-altitude-effect, type: faa_guidance, statement: "At higher density altitude, the same indicated landing speed corresponds to a higher true speed and greater landing distance.", sources: [phak-landing-performance-inputs], risk: safety_critical, script_sections: ["Plan landing as its own operation"], status: draft}
  - {id: landing-chart-primary-inputs, type: faa_guidance, statement: "Landing-distance planning must consider pressure altitude and temperature, landing weight, wind, and runway slope and condition.", sources: [phak-landing-performance-inputs], risk: safety_critical, script_sections: ["Plan landing as its own operation", "A repeatable planning flow"], status: draft}
  - {id: afh-landing-airplane-data-controls, type: faa_guidance, statement: "Manufacturer-recommended airplane configuration, airspeeds, and other information relevant to approaches and landings are in the airplane's AFM/POH and take precedence over general AFH discussion.", sources: [afh-landing-airplane-information], risk: safety_critical, script_sections: ["Plan landing as its own operation", "A repeatable planning flow"], status: draft}
  - {id: chart-flight-test-basis, type: faa_guidance, statement: "Manufacturer performance charts are built from flight-test data under stated aircraft, operating, and technique conditions.", sources: [phak-performance-chart-boundaries], risk: operational, script_sections: ["Read the chart before reading the number", "Calculated performance is a disciplined estimate"], status: draft}
  - {id: chart-conditions-notes, type: faa_guidance, statement: "Every performance chart has controlling conditions and notes that must be read before applying its outputs.", sources: [phak-performance-chart-boundaries], risk: safety_critical, script_sections: ["Read the chart before reading the number", "A repeatable planning flow"], status: draft}
  - {id: chart-accuracy-boundary, type: faa_guidance, statement: "Actual performance may differ when airplane condition, environmental conditions, pilot technique, or chart-reading accuracy differs from the chart basis.", sources: [phak-performance-chart-boundaries], risk: safety_critical, script_sections: ["Plan landing as its own operation", "Calculated performance is a disciplined estimate"], status: draft}
  - {id: interpolation-purpose, type: faa_guidance, statement: "Interpolation estimates an intermediate value between known chart values; using a slightly more adverse available value can provide a conservative estimate when appropriate to the chart.", sources: [phak-interpolation-takeoff-charts], risk: operational, script_sections: ["Read the chart before reading the number"], status: draft}
  - {id: takeoff-outputs-distinct, type: faa_guidance, statement: "Takeoff charts may provide both ground roll and total distance to clear a 50-foot obstacle as separate outputs.", sources: [phak-interpolation-takeoff-charts], risk: safety_critical, script_sections: ["Build the takeoff picture"], status: draft}
  - {id: climb-chart-three-outputs, type: faa_guidance, statement: "Fuel, time, and distance-to-climb charts estimate the fuel used, time elapsed, and ground distance covered during the climb.", sources: [phak-climb-cruise-charts], risk: operational, script_sections: ["Plan cruise and the climb to it"], status: draft}
  - {id: range-endurance-distinction, type: faa_guidance, statement: "Range concerns flying distance available from fuel, while endurance concerns flying time available from fuel.", sources: [phak-range-endurance], risk: operational, script_sections: ["Plan cruise and the climb to it"], status: draft}
  - {id: cruise-chart-outputs, type: faa_guidance, statement: "Cruise performance tables can connect altitude and power setting with true airspeed, fuel consumption, endurance, and range for stated conditions.", sources: [phak-cruise-performance-table], risk: operational, script_sections: ["Plan cruise and the climb to it"], status: draft}
  - {id: landing-outputs-and-arrival-weight, type: faa_guidance, statement: "Landing charts may provide ground roll and total distance over a 50-foot obstacle, and the calculation uses landing weight after accounting for fuel used.", sources: [phak-landing-charts], risk: safety_critical, script_sections: ["Plan landing as its own operation"], status: draft}
  - {id: preflight-runway-performance-information, type: regulation, statement: "Before flight, § 91.103 requires intended-airport runway lengths and applicable takeoff and landing performance information; the pilot uses the approved flight-manual data when paragraph (b)(1) applies and otherwise uses reliable aircraft-appropriate information for the conditions named by the rule.", sources: [cfr-preflight-performance], risk: safety_critical, script_sections: ["What the ACS is asking you to connect", "Build the takeoff picture", "A repeatable planning flow"], status: draft}
