learning_objectives:
  - Apply pilot-document, aircraft-qualification, medical, and flight-review
    requirements to a proposed private-pilot VFR passenger flight.
  - Use logbook evidence to distinguish general passenger recency from the
    specific night-passenger full-stop requirement.
  - Evaluate an offered rental payment against private-pilot compensation and
    pro-rata expense-sharing rules.
  - Identify the BasicMed qualification and operating-limit checks when that
    alternate medical basis is used.
  - Assess proficiency in the actual airplane and avionics after legal currency
    is established.
trouble_spots:
  - A private pilot certificate alone does not answer every PIC, airplane,
    passenger, and medical question.
  - A flight review does not automatically establish passenger
    takeoff-and-landing recency.
  - After-sunset landings do not necessarily meet the one-hour-after-sunset
    night-passenger window.
  - A passenger's full rental payment can violate the pilot's pro-rata
    expense-share limit.
  - BasicMed is more than possession of a U.S. driver's license.
  - Regulatory currency does not establish proficiency in unfamiliar equipment.
