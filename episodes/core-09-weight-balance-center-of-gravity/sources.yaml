  - id: phak-weight-balance-introduction
    authority: faa_guidance
    title: "Pilot's Handbook of Aeronautical Knowledge, Chapter 10: Weight and Balance"
    document_id: "FAA-H-8083-25C"
    locator: "Ch. 10, Introduction and Weight Control, p. 10-1"
    url: "https://www.faa.gov/sites/faa.gov/files/12_phak_ch10.pdf#page=1"
    revision: "2023 edition; Chapter 10 page updated July 10, 2023"
    relevance_excerpt: "Operating above maximum weight compromises structural integrity and performance; a CG outside approved limits creates control difficulty."
    verified_at_utc: "2026-08-26T00:38:13Z"
    link_status: 200
    supports_claims: [weight-and-cg-separate-limits, excess-weight-lift-demand]

  - id: phak-weight-effects-and-cg
    authority: faa_guidance
    title: "Pilot's Handbook of Aeronautical Knowledge, Chapter 10: Weight and Balance"
    document_id: "FAA-H-8083-25C"
    locator: "Ch. 10, Effects of Weight through Balance, Stability, and Center of Gravity, p. 10-2"
    url: "https://www.faa.gov/sites/faa.gov/files/12_phak_ch10.pdf#page=2"
    revision: "2023 edition"
    relevance_excerpt: "Excess weight degrades takeoff, climb, stall, landing, range, and maneuvering performance; CG depends on weight distribution and may change as loads shift or are expended."
    verified_at_utc: "2026-08-26T00:38:13Z"
    link_status: 200
    supports_claims: [weight-performance-effects, combined-performance-risk, cg-is-weight-distribution, fuel-load-tradeoff, equipment-changes-data]

  - id: phak-adverse-balance-effects
    authority: faa_guidance
    title: "Pilot's Handbook of Aeronautical Knowledge, Chapter 10: Weight and Balance"
    document_id: "FAA-H-8083-25C"
    locator: "Ch. 10, Effects of Adverse Balance through Stability and Center of Gravity, p. 10-3"
    url: "https://www.faa.gov/sites/faa.gov/files/12_phak_ch10.pdf#page=3"
    revision: "2023 edition"
    relevance_excerpt: "Forward CG can create high control forces and insufficient flare authority; aft CG reduces longitudinal stability, produces light control forces, and reduces stall and spin recovery capability."
    verified_at_utc: "2026-08-26T00:38:13Z"
    link_status: 200
    supports_claims: [forward-cg-effects, aft-cg-effects, cg-limits-aircraft-specific, loading-controls-cg]

  - id: phak-weight-balance-management
    authority: faa_guidance
    title: "Pilot's Handbook of Aeronautical Knowledge, Chapter 10: Weight and Balance"
    document_id: "FAA-H-8083-25C"
    locator: "Ch. 10, Management of Weight and Balance Control, p. 10-4"
    url: "https://www.faa.gov/sites/faa.gov/files/12_phak_ch10.pdf#page=4"
    revision: "2023 edition"
    relevance_excerpt: "The approved AFM supplies weight-and-balance limits and computation aids; pilots control loading and fuel management, and current aircraft records are the basis for calculations and decisions."
    verified_at_utc: "2026-08-26T00:38:13Z"
    link_status: 200
    supports_claims: [aircraft-data-foundation, loading-fuel-variable-factors, seats-bags-fuel-tradeoff]

  - id: phak-terms-and-principles
    authority: faa_guidance
    title: "Pilot's Handbook of Aeronautical Knowledge, Chapter 10: Weight and Balance"
    document_id: "FAA-H-8083-25C"
    locator: "Ch. 10, Terms and Definitions through Principles of Weight and Balance Computations, p. 10-5"
    url: "https://www.faa.gov/sites/faa.gov/files/12_phak_ch10.pdf#page=5"
    revision: "2023 edition"
    relevance_excerpt: "The datum establishes the measurement reference, arm is distance from it, moment is weight times arm, useful load is maximum allowable gross weight minus basic empty weight, and loaded weight must also be distributed within CG limits."
    verified_at_utc: "2026-08-26T00:38:13Z"
    link_status: 200
    supports_claims: [datum-arm-moment, useful-load-definition, total-weight-and-distribution]

  - id: phak-moment-mental-model
    authority: faa_guidance
    title: "Pilot's Handbook of Aeronautical Knowledge, Chapter 10: Weight and Balance"
    document_id: "FAA-H-8083-25C"
    locator: "Ch. 10, Figures 10-2 through 10-4 and accompanying explanation, p. 10-6"
    url: "https://www.faa.gov/sites/faa.gov/files/12_phak_ch10.pdf#page=6"
    revision: "2023 edition"
    relevance_excerpt: "Figures 10-2 through 10-4 show the datum, arms, CG range, and how equal moments can be produced by different combinations of weight and distance."
    verified_at_utc: "2026-08-26T00:38:13Z"
    link_status: 200
    supports_claims: [moment-distance-leverage, sample-data-not-aircraft-data]

  - id: phak-computational-method
    authority: faa_guidance
    title: "Pilot's Handbook of Aeronautical Knowledge, Chapter 10: Weight and Balance"
    document_id: "FAA-H-8083-25C"
    locator: "Ch. 10, Determining Loaded Weight and CG and Computational Method, p. 10-7"
    url: "https://www.faa.gov/sites/faa.gov/files/12_phak_ch10.pdf#page=7"
    revision: "2023 edition"
    relevance_excerpt: "A loaded-aircraft computation lists aircraft, occupants, fuel, and baggage; totals weight and moment; divides total moment by total weight for CG; and compares both results with the applicable limits."
    verified_at_utc: "2026-08-26T00:38:13Z"
    link_status: 200
    supports_claims: [computational-sequence, weight-and-cg-independent-checks, manufacturer-methods]

