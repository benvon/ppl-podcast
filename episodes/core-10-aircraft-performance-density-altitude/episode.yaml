learning_objectives:
  - "Explain pressure altitude, density altitude, and the atmospheric changes that raise or lower density altitude."
  - "Connect lower air density with reduced normally aspirated engine power, propeller thrust, wing lift, and airplane performance."
  - "Identify the title, conditions, notes, inputs, and outputs that control an aircraft performance chart."
  - "Use the intended airplane's POH or AFM to build takeoff, climb, cruise, and landing performance estimates for expected conditions."
  - "Distinguish takeoff ground roll from obstacle-clearance distance, climb angle from climb rate, and landing ground roll from obstacle-clearance distance."
  - "Explain why calculated performance can differ from actual performance and identify lower-demand planning choices when margin is inadequate."
trouble_spots:
  - "Treating airport elevation as density altitude."
  - "Treating high density altitude as dense air rather than thin air."
  - "Using a handbook sample chart or another airplane's data as aircraft-specific performance information."
  - "Reading a chart output before checking its title, conditions, notes, configuration, and units."
  - "Comparing takeoff ground roll with runway length when obstacle-clearance distance is the relevant output."
  - "Using takeoff weight or departure weather for the landing calculation without rebuilding arrival conditions."
  - "Treating a calculated distance as a guarantee instead of an estimate tied to stated conditions and technique."
