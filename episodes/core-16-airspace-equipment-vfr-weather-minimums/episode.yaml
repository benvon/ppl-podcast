learning_objectives:
  - Identify the controlling airspace by combining lateral position, altitude, floor, and ceiling.
  - Distinguish no general VFR entry communication, established two-way radio communication, and an explicit Class B clearance.
  - Match pilot qualifications, radio, altitude-reporting transponder, and ADS-B Out requirements to the complete planned route.
  - Apply basic VFR visibility, cloud-clearance, and surface-area ceiling requirements to changing airspace and weather.
  - Explain the limited scope and conditions of a Special VFR clearance and identify when the surrounding conditions make another plan safer.
  - Distinguish prohibited, restricted, warning, MOA, alert, CFA, TFR, SATR, and SFRA decision paths.
trouble_spots:
  - Treating a flat chart boundary as the complete airspace picture without checking floor, ceiling, and aircraft altitude.
  - Assuming controlled airspace means every VFR airplane is controlled or separated by ATC.
  - Treating a callsign response or transponder code as an explicit Class B clearance.
  - Assuming that remaining below a Class B or Class C shelf avoids Mode C veil or above-the-shelf equipment requirements.
  - Memorizing VFR weather numbers without identifying class, day or night, height above the surface, and MSL altitude.
  - Treating a scattered cloud layer as a weather ceiling.
  - Treating Special VFR as evidence that the weather beyond the surface area supports continued VFR flight.
  - Treating every special-use or other-airspace boundary as either a complete prohibition or an ignorable chart marking.
